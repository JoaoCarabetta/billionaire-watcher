unit_tests:
  - name: test_gestora_qsa_partners_keeps_all_seven_and_null_percent
    description: |
      Every configured gestora has its fictional QSA rows or one explicit
      zero-count row. Receita's absent ownership percentage stays null.
    model: gestora_qsa_partners
    given:
      - input: ref('gestora_cnpj_basicos')
        format: sql
        rows: |
          select '11752203' as cnpj_basico
          union all select '72116353'
          union all select '41020034'
          union all select '05395883'
          union all select '33857830'
          union all select '09267871'
          union all select '14406534'
      - input: source('br_me_cnpj', 'socios')
        format: sql
        rows: |
          select
            cast('2026-01-11' as date) as data,
            '11752203' as cnpj_basico,
            '2' as tipo,
            'PESSOA FICTICIA AURORA' as nome,
            '***111111**' as documento,
            '49' as qualificacao,
            cast('2020-01-02' as date) as data_entrada_sociedade
          union all select
            cast('2026-01-11' as date), '11752203', '1',
            'EMPRESA FICTICIA BOREAL', '11.111.111/0001-11', '22',
            cast('2021-02-03' as date)
          union all select
            cast('2026-01-11' as date), '72116353', '2',
            'PESSOA FICTICIA CEDRO', '***222222**', '10',
            cast('2019-03-04' as date)
          union all select
            cast('2026-01-11' as date), '41020034', '2',
            'PESSOA FICTICIA DUNA', '***333333**', '16',
            cast('2018-04-05' as date)
          union all select
            cast('2026-01-11' as date), '05395883', '1',
            'EMPRESA FICTICIA ESTRELA', '22.222.222/0001-22', '5',
            cast('2017-05-06' as date)
          union all select
            cast('2026-01-11' as date), '33857830', '2',
            'PESSOA FICTICIA FLORESTA', '***444444**', '49',
            cast('2016-06-07' as date)
          union all select
            cast('2026-01-11' as date), '09267871', '2',
            'PESSOA FICTICIA GRANITO', '***555555**', '22',
            cast('2015-07-08' as date)
          union all select
            cast('2025-12-31' as date), '14406534', '2',
            'PESSOA FICTICIA FORA DA PARTICAO', '***666666**', '10',
            cast('2014-08-09' as date)
    expect:
      format: sql
      rows: |
        with expected_without_query as (
          select '11752203' as cnpj_basico, '2' as tipo, 'PESSOA FICTICIA AURORA' as nome, '***111111**' as documento, '49' as qualificacao, cast('2020-01-02' as date) as data_entrada_sociedade, cast(null as double) as percent, 2 as partner_count
          union all select '11752203', '1', 'EMPRESA FICTICIA BOREAL', '11.111.111/0001-11', '22', cast('2021-02-03' as date), cast(null as double), 2
          union all select '72116353', '2', 'PESSOA FICTICIA CEDRO', '***222222**', '10', cast('2019-03-04' as date), cast(null as double), 1
          union all select '41020034', '2', 'PESSOA FICTICIA DUNA', '***333333**', '16', cast('2018-04-05' as date), cast(null as double), 1
          union all select '05395883', '1', 'EMPRESA FICTICIA ESTRELA', '22.222.222/0001-22', '5', cast('2017-05-06' as date), cast(null as double), 1
          union all select '33857830', '2', 'PESSOA FICTICIA FLORESTA', '***444444**', '49', cast('2016-06-07' as date), cast(null as double), 1
          union all select '09267871', '2', 'PESSOA FICTICIA GRANITO', '***555555**', '22', cast('2015-07-08' as date), cast(null as double), 1
          union all select '14406534', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
        )
        select
          expected_without_query.*,
          concat(
            'SELECT tipo, nome, documento, qualificacao, data_entrada_sociedade ',
            'FROM basedosdados.br_me_cnpj.socios WHERE data = DATE ',
            chr(39), '2026-01-11', chr(39),
            ' AND LPAD(CAST(cnpj_basico AS STRING), 8, ',
            chr(39), '0', chr(39), ') = ',
            chr(39), cnpj_basico, chr(39)
          ) as source_query
        from expected_without_query

  - name: test_gestora_qsa_partners_lazard_shaped_empty_has_query
    description: |
      A Lazard-shaped configured key with no partition rows emits exactly one
      explicit zero-count row with a reproducible source query.
    model: gestora_qsa_partners
    given:
      - input: ref('gestora_cnpj_basicos')
        format: sql
        rows: |
          select '14406534' as cnpj_basico
      - input: source('br_me_cnpj', 'socios')
        format: sql
        rows: |
          select
            cast('2026-01-11' as date) as data,
            '99999999' as cnpj_basico,
            '2' as tipo,
            'PESSOA FICTICIA DISTANTE' as nome,
            '***999999**' as documento,
            '22' as qualificacao,
            cast('2022-09-10' as date) as data_entrada_sociedade
    expect:
      format: sql
      rows: |
        select
          '14406534' as cnpj_basico,
          cast(null as varchar) as tipo,
          cast(null as varchar) as nome,
          cast(null as varchar) as documento,
          cast(null as varchar) as qualificacao,
          cast(null as date) as data_entrada_sociedade,
          cast(null as double) as percent,
          0 as partner_count,
          concat(
            'SELECT tipo, nome, documento, qualificacao, data_entrada_sociedade ',
            'FROM basedosdados.br_me_cnpj.socios WHERE data = DATE ',
            chr(39), '2026-01-11', chr(39),
            ' AND LPAD(CAST(cnpj_basico AS STRING), 8, ',
            chr(39), '0', chr(39), ') = ',
            chr(39), '14406534', chr(39)
          ) as source_query
