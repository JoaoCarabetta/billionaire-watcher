unit_tests:
  - name: test_empresas_seed_a_union_b
    description: |
      Locks the issue 178 final grain: duplicate seed sources collapse by
      empresa_id, leading zeros survive, all active CVM fixture companies enter,
      short BCB/SUSEP keys stay out, BCB cooperative types 3/9/11 stay out,
      closed groups never walk, and Natura walks whenever it has a full CNPJ.
      It also locks issue 180's non-door rule: an uncovered CVM company and all
      no-CNPJ exceptions stay in empresas with tem_piso=false.
    model: empresas
    given:
      - input: source('fase1_landing', 'controle_empresas_walk')
        format: sql
        fixture: empresas_seed_a_given
      - input: ref('stg_cvm_cad_cia_aberta')
        format: sql
        fixture: empresas_cvm_given
      - input: source('fase1_landing', 'bcb_entidades_supervisionadas')
        format: sql
        fixture: empresas_bcb_given
      - input: source('fase1_landing', 'susep_dados_cadastrais')
        format: sql
        fixture: empresas_susep_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: ownership_fre_empty
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: ownership_qsa_empresas_empty
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: ownership_qsa_socios_empty
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: ownership_qsa_estabelecimentos_empty
      - input: ref('int_empresas_piso')
        format: sql
        fixture: empresas_pisos_given
    expect:
      format: sql
      fixture: empresas_expect

  - name: test_stg_bolsa_cotahist_piso
    description: |
      Calculates market value from B3 share quantities and official COTAHIST
      PREULT cents after the FCA ticker-to-CNPJ join.
    model: stg_bolsa_cotahist_piso
    given:
      - input: source('fase1_landing', 'b3_listed_companies')
        format: sql
        rows: |
          select
            '2916265000160' as cnpj, 'JBSS' as issuingCompany, '1' as type
      - input: source('fase1_landing', 'b3_listed_supplement')
        format: sql
        rows: |
          select
            'JBSS' as code, '1.000' as numberCommonShares,
            '500' as numberPreferredShares
      - input: source('fase1_landing', 'cvm_fca_valor_mobiliario_2026')
        format: sql
        rows: |
          select
            '02.916.265/0001-60' as CNPJ_Companhia,
            'JBSS3' as Codigo_Negociacao,
            'Ações Ordinárias' as Valor_Mobiliario,
            '2026-01-01' as Data_Referencia,
            10 as ID_Documento, 'Bolsa' as Mercado,
            cast(null as varchar) as Data_Fim_Negociacao
          union all
          select
            '02.916.265/0001-60', 'JBSS4', 'Ações Preferenciais',
            '2026-01-01', 10, 'Bolsa', null
      - input: source('fase1_landing', 'b3_cotahist_2026')
        format: sql
        rows: |
          select
            '20260826' as DATA_PREGAO, '02' as CODBDI, 'JBSS3' as CODNEG,
            '010' as TPMERC, 1000 as PREULT, 100 as NUMNEG
          union all
          select '20260826', '02', 'JBSS4', '010', 2000, 50
    expect:
      format: sql
      rows: |
        select '02916265000160' as cnpj, cast(20000 as numeric) as valor_do_piso

  - name: test_stg_ifdata_ativo_total_piso
    description: |
      Maps the prudential reporter to its leader CNPJ8 and then to the full
      BCB headquarters CNPJ without inventing a branch or check digits.
    model: stg_ifdata_ativo_total_piso
    given:
      - input: source('fase1_landing', 'ifdata_cadastro')
        format: sql
        rows: |
          select
            'C0001' as CodInst, 'C0001' as CodConglomeradoPrudencial,
            '1234567' as CnpjInstituicaoLider, 'A' as Situacao
      - input: source('fase1_landing', 'ifdata_ativo_total_prudencial')
        format: sql
        rows: |
          select
            'C0001' as CodInst, 1 as TipoInstituicao, '2' as NumeroRelatorio,
            '140220' as Conta, cast(500 as numeric) as Saldo
      - input: source('fase1_landing', 'bcb_entidades_supervisionadas')
        format: sql
        rows: |
          select
            '01234567000189' as codigoCNPJ14, '01234567' as codigoCNPJ8,
            3 as codigoTipoSituacaoPessoaJuridica,
            2 as codigoTipoEntidadeSupervisionada
    expect:
      format: sql
      rows: |
        select '01234567000189' as cnpj, cast(500 as numeric) as valor_do_piso

  - name: test_stg_susep_premios_emitidos_piso
    description: Sums ReceitasSeguros.valor across monthly ramo rows by CNPJ.
    model: stg_susep_premios_emitidos_piso
    given:
      - input: source('fase1_landing', 'susep_receitas_seguros_2026')
        format: sql
        rows: |
          select '999999000199' as cnpj, cast(100 as numeric) as valor
          union all
          select '999999000199', cast(200 as numeric)
    expect:
      format: sql
      rows: |
        select '00999999000199' as cnpj, cast(300 as numeric) as valor_do_piso

  - name: test_int_empresas_piso_source_precedence
    description: |
      Locks the three source strings and one-row CNPJ grain. A listed company
      wins deterministic precedence over overlapping IF.data and SUSEP floors.
    model: int_empresas_piso
    given:
      - input: ref('stg_bolsa_cotahist_piso')
        format: sql
        rows: |
          select '02916265000160' as cnpj, cast(1200 as numeric) as valor_do_piso
      - input: ref('stg_ifdata_ativo_total_piso')
        format: sql
        rows: |
          select '02916265000160' as cnpj, cast(900 as numeric) as valor_do_piso
          union all
          select '01234567000189', cast(500 as numeric)
      - input: ref('stg_susep_premios_emitidos_piso')
        format: sql
        rows: |
          select '02916265000160' as cnpj, cast(700 as numeric) as valor_do_piso
          union all
          select '00999999000199', cast(300 as numeric)
    expect:
      format: sql
      rows: |
        select
          '02916265000160' as empresa_id,
          '02916265000160' as cnpj,
          cast(1200 as numeric) as valor_do_piso,
          'bolsa_cotahist' as fonte_do_piso,
          true as tem_piso
        union all
        select
          '01234567000189', '01234567000189', cast(500 as numeric),
          'ifdata_ativo_total', true
        union all
        select
          '00999999000199', '00999999000199', cast(300 as numeric),
          'susep_premios_emitidos', true
