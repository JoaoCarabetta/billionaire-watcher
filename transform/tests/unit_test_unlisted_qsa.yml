unit_tests:
  - name: test_unlisted_qsa_partners_keeps_every_company_and_null_percent
    description: |
      Every configured company has either its QSA rows or one explicit zero-count
      row. Names are fictional and Receita's absent ownership percentage stays null.
    model: unlisted_qsa_partners
    given:
      - input: ref('unlisted_owned_cnpj_basicos')
        format: sql
        rows: |
          select '61563585' as cnpj_basico
          union all select '02049012'
          union all select '23349343'
          union all select '07544616'
          union all select '39513958'
          union all select '42601461'
          union all select '43347650'
          union all select '45278506'
          union all select '58534632'
      - input: source('br_me_cnpj', 'socios')
        format: sql
        rows: |
          select
            cast('2026-01-11' as date) as data,
            '61563585' as cnpj_basico,
            '2' as tipo,
            'PESSOA FICTICIA DELTA' as nome,
            '***246810**' as documento,
            '49' as qualificacao,
            cast('2021-04-05' as date) as data_entrada_sociedade
          union all
          select
            cast('2025-12-31' as date) as data,
            '02049012' as cnpj_basico,
            '2' as tipo,
            'PESSOA FICTICIA FORA DA PARTICAO' as nome,
            '***135791**' as documento,
            '22' as qualificacao,
            cast('2018-06-07' as date) as data_entrada_sociedade
    expect:
      format: sql
      rows: |
        with expected_without_query as (
          select '61563585' as cnpj_basico, '2' as tipo, 'PESSOA FICTICIA DELTA' as nome, '***246810**' as documento, '49' as qualificacao, cast('2021-04-05' as date) as data_entrada_sociedade, cast(null as double) as percent, 1 as partner_count
          union all select '02049012', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '23349343', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '07544616', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '39513958', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '42601461', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '43347650', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '45278506', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
          union all select '58534632', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as date), cast(null as double), 0
        )
        select
          expected_without_query.*,
          concat(
            'SELECT tipo, nome, documento, qualificacao, data_entrada_sociedade ',
            'FROM basedosdados.br_me_cnpj.socios WHERE data = DATE ',
            chr(39), '2026-01-11', chr(39),
            ' AND LPAD(CAST(cnpj_basico AS STRING), 8, ',
            chr(39), '0', chr(39), ') = ',
            chr(39), cnpj_basico, chr(39)
          ) as source_query
        from expected_without_query

  - name: test_unlisted_qsa_companies_owned_uses_prefix_eight_only
    description: |
      PJ CNPJs whose first eight digits equal configured owners match. A CNPJ
      containing a key only later does not, PF rows do not, all other owners
      receive explicit zeros, and no percentage is invented.
    model: unlisted_qsa_companies_owned
    given:
      - input: ref('unlisted_owned_cnpj_basicos')
        format: sql
        rows: |
          select '61563585' as cnpj_basico
          union all select '02049012'
          union all select '23349343'
          union all select '07544616'
          union all select '39513958'
          union all select '42601461'
          union all select '43347650'
          union all select '45278506'
          union all select '58534632'
      - input: source('br_me_cnpj', 'socios')
        format: sql
        rows: |
          select
            cast('2026-01-11' as date) as data,
            '71000001' as cnpj_basico,
            '1' as tipo,
            'SOCIA FICTICIA EXATA UM' as nome,
            '07.544.616/0001-01' as documento,
            '49' as qualificacao
          union all
          select
            cast('2026-01-11' as date) as data,
            '71000002' as cnpj_basico,
            '1' as tipo,
            'SOCIA FICTICIA EXATA DOIS' as nome,
            '45.278.506/0001-02' as documento,
            '22' as qualificacao
          union all
          select
            cast('2026-01-11' as date) as data,
            '71000003' as cnpj_basico,
            '1' as tipo,
            'SOCIA FICTICIA FALSO POSITIVO' as nome,
            '99.075.446/1600-01' as documento,
            '22' as qualificacao
          union all
          select
            cast('2026-01-11' as date) as data,
            '71000004' as cnpj_basico,
            '2' as tipo,
            'PESSOA FICTICIA' as nome,
            '***544616**' as documento,
            '10' as qualificacao
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        rows: |
          select cast('2026-01-11' as date) as data, '71000001' as cnpj_basico, 'EMPRESA FICTICIA UM' as razao_social
          union all
          select cast('2026-01-11' as date), '71000002', 'EMPRESA FICTICIA DOIS'
          union all
          select cast('2026-01-11' as date), '71000003', 'EMPRESA FICTICIA FALSO POSITIVO'
          union all
          select cast('2026-01-11' as date), '71000004', 'EMPRESA FICTICIA PF'
    expect:
      format: sql
      rows: |
        with expected_without_query as (
          select '07544616' as owner_cnpj_basico, '71000001' as owned_cnpj_basico, 'EMPRESA FICTICIA UM' as owned_name, '49' as qualificacao, '07.544.616/0001-01' as documento, cast(null as double) as percent, 1 as owned_company_count
          union all select '45278506', '71000002', 'EMPRESA FICTICIA DOIS', '22', '45.278.506/0001-02', cast(null as double), 1
          union all select '61563585', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
          union all select '02049012', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
          union all select '23349343', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
          union all select '39513958', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
          union all select '42601461', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
          union all select '43347650', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
          union all select '58534632', cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as double), 0
        )
        select
          expected_without_query.*,
          concat(
            'SELECT s.cnpj_basico, e.razao_social, s.qualificacao, s.documento ',
            'FROM basedosdados.br_me_cnpj.socios AS s ',
            'JOIN basedosdados.br_me_cnpj.empresas AS e ',
            'ON LPAD(CAST(e.cnpj_basico AS STRING), 8, ',
            chr(39), '0', chr(39),
            ') = LPAD(CAST(s.cnpj_basico AS STRING), 8, ',
            chr(39), '0', chr(39),
            ') AND e.data = s.data WHERE s.data = DATE ',
            chr(39), '2026-01-11', chr(39),
            ' AND CAST(s.tipo AS STRING) = ',
            chr(39), '1', chr(39),
            ' AND LEFT(LPAD(REGEXP_REPLACE(CAST(s.documento AS STRING), r',
            chr(39), '[^0-9]', chr(39), ', ', chr(39), chr(39),
            '), 14, ', chr(39), '0', chr(39), '), 8) = ',
            chr(39), owner_cnpj_basico, chr(39)
          ) as source_query
        from expected_without_query
