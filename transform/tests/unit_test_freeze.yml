            controlador_tipo: 'listed'
            freeze_status_hint: 'pending'
            notes: 'Test'
            source_doc: 'CVM'
            cnpj_source: 'BD'
            retrieved_at: '2026-08-24'
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        rows:
          # Controller with Acionista_Controlador=S
          - CNPJ_Companhia: '02916265000160'
            Data_Referencia: '2025-12-31'
            Versao: 1
            ID_Documento: 1
            Nome_Companhia: 'Test Listed S.A.'
            ID_Acionista: 100
            Acionista: 'Família Silva'
            Tipo_Pessoa_Acionista: 'PJ'
            CPF_CNPJ_Acionista: '12345678000100'
