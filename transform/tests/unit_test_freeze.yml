      SEAM TEST: Listed company with empty FRE 6.1 (no Acionista_Controlador=S)
      results in hole, not a CEO fill-in or offshore invention.
    model: int_freeze_listed_controllers
    given:
      - input: ref('stg_group_flags')
        rows:
          - rank_2024: 3
            empresa: 'No Controller Inc'
            razao_social: 'No Controller S.A.'
            cnpj_basico: '11111111'
            cnpj_full: '11111111000100'
            listed_flag: true
            listed_source: 'CVM'
            soe_flag: false
            soe_source: null
            controlador_tipo: 'listed'
            freeze_status_hint: 'pending'
            notes: 'Test'
            source_doc: 'CVM'
            cnpj_source: 'BD'
            retrieved_at: '2026-08-24'
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        rows:
          # Only acionista_relevante, no controller
          - CNPJ_Companhia: '11111111000100'
            Data_Referencia: '2025-12-31'
            Versao: 1
            ID_Documento: 1
            Nome_Companhia: 'No Controller S.A.'
            ID_Acionista: 300
            Acionista: 'BlackRock'
            Tipo_Pessoa_Acionista: 'PJ'
            CPF_CNPJ_Acionista: '99999999000199'
            ID_Acionista_Relacionado: null
            Acionista_Relacionado: null
            Tipo_Pessoa_Acionista_Relacionado: null
            CPF_CNPJ_Acionista_Relacionado: null
            Quantidade_Acao_Ordinaria_Circulacao: 120
            Percentual_Acao_Ordinaria_Circulacao: 6.0
            Quantidade_Acao_Preferencial_Circulacao: 0
            Percentual_Acao_Preferencial_Circulacao: 0.0
            Quantidade_Total_Acoes_Circulacao: 120
            Percentual_Total_Acoes_Circulacao: 6.0
            Nacionalidade: 'Estrangeira'
            Sigla_UF: null
            Residente_Exterior: 'S'
            Representante_Legal: null
            Tipo_Pessoa_Representante_Legal: null
            CPF_CNPJ_Representante_legal: null
            Data_Composicao_Capital_Social: '2025-12-31'
            Data_Ultima_Alteracao: '2025-12-31'
            Acionista_Controlador: 'N'
            Participante_Acordo_Acionistas: 'N'
    expect:
      rows: [] # Empty result because no Acionista_Controlador=S found

  # SEAM 5: QSA-only edge is socio, never acionista_controlador
  - name: test_freeze_unlisted_qsa_edge_is_socio
    description: |
      SEAM TEST: RF QSA edges must be labeled 'socio' or 'administrador',
      never 'acionista_controlador'. QSA is not the shareholder book.
    model: int_freeze_unlisted_rf
    given:
      - input: ref('stg_group_flags')
        rows:
          - rank_2024: 18
            empresa: 'Copersucar'
            razao_social: 'Copersucar S.A.'
            cnpj_basico: '10265949'
            cnpj_full: '10265949000177'
            listed_flag: false
            listed_source: null
            soe_flag: false
            soe_source: null
            controlador_tipo: 'unlisted'
            freeze_status_hint: 'pending'
            notes: 'SA fechada'
            source_doc: 'CVM cancelled'
            cnpj_source: 'BD'
            retrieved_at: '2026-08-24'
      - input: ref('stg_rf_socios')
        rows:
          - ano: 2026
            mes: 1
            data: '2026-01-11'
            cnpj_basico: '10265949'
            tipo: 'PF'
            nome: 'Maria Santos'
            documento: '***789012**'
            qualificacao: '16'
            data_entrada_sociedade: '2020-01-01'
            id_pais: null
            cpf_representante_legal: null
            nome_representante_legal: null
            qualificacao_representante_legal: null
            faixa_etaria: null
      - input: ref('stg_rf_empresas')
        rows:
          - ano: 2026
            mes: 1
            data: '2026-01-11'
            cnpj_basico: '10265949'
            razao_social: 'COPERSUCAR S.A.'
            natureza_juridica: '2054'
            qualificacao_responsavel: '05'
            capital_social: 1775195789.81
            porte: '05'
            ente_federativo: null
    expect:
      rows:
        # For S.A. (natureza 2054), QSA is officers, so we have a hole
        # Edge label should never be acionista_controlador
        - group_rank: 18
          person_name: null
          role: null
          edge_label: null
          freeze_status: 'hole'

