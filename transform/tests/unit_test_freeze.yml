            Acionista_Relacionado: 'João Silva'
            Tipo_Pessoa_Acionista_Relacionado: 'PF'
            CPF_CNPJ_Acionista_Relacionado: '***123456**'
            Quantidade_Acao_Ordinaria_Circulacao: 1000
            Percentual_Acao_Ordinaria_Circulacao: 51.0
            Quantidade_Acao_Preferencial_Circulacao: 0
            Percentual_Acao_Preferencial_Circulacao: 0.0
            Quantidade_Total_Acoes_Circulacao: 1000
            Percentual_Total_Acoes_Circulacao: 51.0
            Nacionalidade: 'Brasileira'
            Sigla_UF: 'SP'
            Residente_Exterior: 'N'
            Representante_Legal: null
            Tipo_Pessoa_Representante_Legal: null
            CPF_CNPJ_Representante_legal: null
            Data_Composicao_Capital_Social: '2025-12-31'
            Data_Ultima_Alteracao: '2025-12-31'
            Acionista_Controlador: 'S'
            Participante_Acordo_Acionistas: 'S'
          # Institution with ≥5% but NOT controlling (no acordo)
          - CNPJ_Companhia: '02916265000160'
            Data_Referencia: '2025-12-31'
            Versao: 1
            ID_Documento: 1
            Nome_Companhia: 'Test Listed S.A.'
            ID_Acionista: 200
            Acionista: 'Previ'
            Tipo_Pessoa_Acionista: 'PJ'
            CPF_CNPJ_Acionista: '00000000000191'
            ID_Acionista_Relacionado: null
            Acionista_Relacionado: null
            Tipo_Pessoa_Acionista_Relacionado: null
            CPF_CNPJ_Acionista_Relacionado: null
            Quantidade_Acao_Ordinaria_Circulacao: 150
            Percentual_Acao_Ordinaria_Circulacao: 7.5
            Quantidade_Acao_Preferencial_Circulacao: 0
            Percentual_Acao_Preferencial_Circulacao: 0.0
            Quantidade_Total_Acoes_Circulacao: 150
            Percentual_Total_Acoes_Circulacao: 7.5
            Nacionalidade: 'Brasileira'
            Sigla_UF: 'DF'
            Residente_Exterior: 'N'
            Representante_Legal: null
            Tipo_Pessoa_Representante_Legal: null
            CPF_CNPJ_Representante_legal: null
            Data_Composicao_Capital_Social: '2025-12-31'
            Data_Ultima_Alteracao: '2025-12-31'
            Acionista_Controlador: 'N'
            Participante_Acordo_Acionistas: 'N'
    expect:
      rows:
        # Only the controller with Acionista_Controlador=S should appear
        - group_rank: 2
          person_name: 'João Silva'
          role: 'controlador'
          edge_label: 'acionista_controlador'

