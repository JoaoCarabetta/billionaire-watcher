      SEAM TEST: Listed company with empty FRE 6.1 (no Acionista_Controlador=S)
      results in a visible hole row, not an absent row or CEO fill-in.
      Every listed non-SOE group must appear in freeze_persons.
    model: freeze_persons
    given:
      - input: ref('int_freeze_listed_controllers')
        rows:
          # Listed group with empty FRE 6.1
          - group_rank: 3
            group_name: 'No Controller Inc'
