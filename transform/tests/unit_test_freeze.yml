unit_tests:
  # SEAM 1: No edge_label dono or UBO
  - name: test_freeze_rejects_dono_edge_label
    description: |
      SEAM TEST: A row with edge_label 'dono' or 'UBO' must fail.
      This test should FAIL if we ever introduce a dono/UBO edge.
    model: freeze_persons
    given:
      - input: ref('int_freeze_listed_controllers')
        rows:
          - group_rank: 1
            group_name: 'Test Company'
            cnpj_basico: '12345678'
            ranking_source: 'Valor 1000 FY2024'
            receita_fy2024_brl: null
            listed_flag: true
            soe_flag: false
            controlador_tipo: 'listed'
            person_name: 'João Silva'
            role: 'controlador'
            edge_label: 'acionista_controlador'
            acordo_acionistas: null
            source_doc: 'CVM FRE 2026'
            fre_item: '6.1'
            hole: false
            cpf_masked: '***123456**'
            freeze_status: 'in'
            notes: 'Test'
      - input: ref('int_freeze_soe')
        rows: []
      - input: ref('int_freeze_unlisted_rf')
        rows: []
      - input: ref('int_freeze_foreign_hq')
        rows: []
    expect:
      rows:
        - group_rank: 1
          group_name: 'Test Company'
          cnpj_basico: '12345678'
          edge_label: 'acionista_controlador'

  # SEAM 2: SOE with freeze_status=in and a PF controlador fails
  - name: test_freeze_soe_skip_with_no_pf
    description: |
      SEAM TEST: SOE groups must have freeze_status=skip_soe and no PF controlador.
      SOE with freeze_status=in and a PF controlador must fail.
    model: int_freeze_soe
    given:
      - input: ref('stg_group_flags')
        rows:
          - rank_2024: 1
            empresa: 'Petrobras'
            razao_social: 'Petróleo Brasileiro S.A.'
            cnpj_basico: '33000167'
            cnpj_full: '33000167000101'
            listed_flag: true
            listed_source: 'CVM'
            soe_flag: true
            soe_source: 'Carta Anual 2025'
            controlador_tipo: 'soe'
            freeze_status_hint: 'skip_soe'
            notes: 'Federal SOE'
            source_doc: 'Carta Anual'
            cnpj_source: 'BD'
            retrieved_at: '2026-08-24'
    expect:
      rows:
        - group_rank: 1
          group_name: 'Petrobras'
          cnpj_basico: '33000167'
          person_name: null
          role: null
          freeze_status: 'skip_soe'

