unit_tests:
- name: test_freeze_rejects_dono_edge_label
  description: 'SEAM TEST: A row with edge_label ''dono'' or ''UBO'' must fail.

    This test should FAIL if we ever introduce a dono/UBO edge.

    '
  model: freeze_persons
  given:
  - input: ref('int_freeze_listed_controllers')
    rows: "select\n            1 as group_rank,\n            'Test Company' as group_name,\n            '12345678' as cnpj_basico,\n            'Valor 1000 FY2024' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            true as listed_flag,\n            false as soe_flag,\n            'listed' as controlador_tipo,\n            'João Silva' as person_name,\n            'controlador' as role,\n            'acionista_controlador' as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'CVM FRE 2026' as source_doc,\n            '6.1' as fre_item,\n            false as hole,\n            '***123456**' as cpf_masked,\n            'in' as freeze_status,\n            'Test' as notes"
    format: sql
  - input: ref('int_freeze_soe')
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
  - input: ref('int_freeze_unlisted_rf')
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
  - input: ref('int_freeze_foreign_hq')
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
  expect:
    rows: "select\n            1 as group_rank,\n            'Test Company' as group_name,\n            '12345678' as cnpj_basico,\n            'acionista_controlador' as edge_label"
    format: sql
- name: test_freeze_soe_skip_with_no_pf
  description: 'SEAM TEST: SOE groups must have freeze_status=skip_soe and no PF controlador.

    SOE with freeze_status=in and a PF controlador must fail.

    '
  model: int_freeze_soe
  given:
  - input: ref('stg_group_flags')
    rows: "select\n            1 as rank_2024,\n            'Petrobras' as empresa,\n            'Petróleo Brasileiro S.A.' as razao_social,\n            '33000167' as cnpj_basico,\n            '33000167000101' as cnpj_full,\n            true as listed_flag,\n            'CVM' as listed_source,\n            true as soe_flag,\n            'Carta Anual 2025' as soe_source,\n            'soe' as controlador_tipo,\n            'skip_soe' as freeze_status_hint,\n            'Federal SOE' as notes,\n            'Carta Anual' as source_doc,\n            'BD' as cnpj_source,\n            cast('2026-08-24' as date) as retrieved_at"
    format: sql
  expect:
    rows: "select\n            1 as group_rank,\n            'Petrobras' as group_name,\n            '33000167' as cnpj_basico,\n            cast(null as varchar) as person_name,\n            cast(null as varchar) as role,\n            'skip_soe' as freeze_status"
    format: sql
- name: test_freeze_fre_62_without_acordo_not_controlador
  description: 'SEAM TEST: FRE 6.2 ≥5% institutions without Participante_Acordo_Acionistas=S

    must not be role=controlador. They are acionista_relevante, OUT.

    '
  model: int_freeze_listed_controllers
  given:
  - input: ref('stg_group_flags')
    rows: "select\n            2 as rank_2024,\n            'Test Listed' as empresa,\n            'Test Listed S.A.' as razao_social,\n            '02916265' as cnpj_basico,\n            '02916265000160' as cnpj_full,\n            true as listed_flag,\n            'CVM' as listed_source,\n            false as soe_flag,\n            cast(null as varchar) as soe_source,\n            'listed' as controlador_tipo,\n            'pending' as freeze_status_hint,\n            'Test' as notes,\n            'CVM' as source_doc,\n            'BD' as cnpj_source,\n            cast('2026-08-24' as date) as retrieved_at"
    format: sql
  - input: ref('stg_cvm_fre_posicao_acionaria_2026')
    rows: "select\n            '02916265000160' as CNPJ_Companhia,\n            cast('2025-12-31' as date) as Data_Referencia,\n            1 as Versao,\n            1 as ID_Documento,\n            'Test Listed S.A.' as Nome_Companhia,\n            100 as ID_Acionista,\n            'Família Silva' as Acionista,\n            'PJ' as Tipo_Pessoa_Acionista,\n            '12345678000100' as CPF_CNPJ_Acionista,\n            101 as ID_Acionista_Relacionado,\n            'João Silva' as Acionista_Relacionado,\n            'PF' as Tipo_Pessoa_Acionista_Relacionado,\n            '***123456**' as CPF_CNPJ_Acionista_Relacionado,\n            1000 as Quantidade_Acao_Ordinaria_Circulacao,\n            51.0 as Percentual_Acao_Ordinaria_Circulacao,\n            0 as Quantidade_Acao_Preferencial_Circulacao,\n            0.0 as Percentual_Acao_Preferencial_Circulacao,\n            1000 as Quantidade_Total_Acoes_Circulacao,\n            51.0 as Percentual_Total_Acoes_Circulacao,\n            'Brasileira'\
      \ as Nacionalidade,\n            'SP' as Sigla_UF,\n            'N' as Residente_Exterior,\n            cast(null as varchar) as Representante_Legal,\n            cast(null as varchar) as Tipo_Pessoa_Representante_Legal,\n            cast(null as varchar) as CPF_CNPJ_Representante_legal,\n            cast('2025-12-31' as date) as Data_Composicao_Capital_Social,\n            cast('2025-12-31' as date) as Data_Ultima_Alteracao,\n            'S' as Acionista_Controlador,\n            'S' as Participante_Acordo_Acionistas\n          union all\n          select\n            '02916265000160' as CNPJ_Companhia,\n            cast('2025-12-31' as date) as Data_Referencia,\n            1 as Versao,\n            1 as ID_Documento,\n            'Test Listed S.A.' as Nome_Companhia,\n            200 as ID_Acionista,\n            'Previ' as Acionista,\n            'PJ' as Tipo_Pessoa_Acionista,\n            '00000000000191' as CPF_CNPJ_Acionista,\n            cast(null as varchar) as ID_Acionista_Relacionado,\n\
      \            cast(null as varchar) as Acionista_Relacionado,\n            cast(null as varchar) as Tipo_Pessoa_Acionista_Relacionado,\n            cast(null as varchar) as CPF_CNPJ_Acionista_Relacionado,\n            150 as Quantidade_Acao_Ordinaria_Circulacao,\n            7.5 as Percentual_Acao_Ordinaria_Circulacao,\n            0 as Quantidade_Acao_Preferencial_Circulacao,\n            0.0 as Percentual_Acao_Preferencial_Circulacao,\n            150 as Quantidade_Total_Acoes_Circulacao,\n            7.5 as Percentual_Total_Acoes_Circulacao,\n            'Brasileira' as Nacionalidade,\n            'DF' as Sigla_UF,\n            'N' as Residente_Exterior,\n            cast(null as varchar) as Representante_Legal,\n            cast(null as varchar) as Tipo_Pessoa_Representante_Legal,\n            cast(null as varchar) as CPF_CNPJ_Representante_legal,\n            cast('2025-12-31' as date) as Data_Composicao_Capital_Social,\n            cast('2025-12-31' as date) as Data_Ultima_Alteracao,\n\
      \            'N' as Acionista_Controlador,\n            'N' as Participante_Acordo_Acionistas"
    format: sql
  expect:
    rows: "select\n            2 as group_rank,\n            'João Silva' as person_name,\n            'controlador' as role,\n            'acionista_controlador' as edge_label"
    format: sql
- name: test_freeze_listed_empty_61_is_hole_int
  description: 'SEAM TEST: Listed company with empty FRE 6.1 (no Acionista_Controlador=S)

    produces hole row in int_freeze_listed_controllers itself.

    '
  model: int_freeze_listed_controllers
  given:
  - input: ref('stg_group_flags')
    rows: "select\n            3 as rank_2024,\n            'No Controller Inc' as empresa,\n            'No Controller S.A.' as razao_social,\n            '11111111' as cnpj_basico,\n            '11111111000100' as cnpj_full,\n            true as listed_flag,\n            'CVM' as listed_source,\n            false as soe_flag,\n            cast(null as varchar) as soe_source,\n            'listed' as controlador_tipo,\n            'pending' as freeze_status_hint,\n            'Test' as notes,\n            'CVM' as source_doc,\n            'BD' as cnpj_source,\n            cast('2026-08-24' as date) as retrieved_at"
    format: sql
  - input: ref('stg_cvm_fre_posicao_acionaria_2026')
    rows: "select\n            '11111111000100' as CNPJ_Companhia,\n            cast('2025-12-31' as date) as Data_Referencia,\n            1 as Versao,\n            1 as ID_Documento,\n            'No Controller S.A.' as Nome_Companhia,\n            300 as ID_Acionista,\n            'BlackRock' as Acionista,\n            'PJ' as Tipo_Pessoa_Acionista,\n            '99999999000199' as CPF_CNPJ_Acionista,\n            cast(null as varchar) as ID_Acionista_Relacionado,\n            cast(null as varchar) as Acionista_Relacionado,\n            cast(null as varchar) as Tipo_Pessoa_Acionista_Relacionado,\n            cast(null as varchar) as CPF_CNPJ_Acionista_Relacionado,\n            120 as Quantidade_Acao_Ordinaria_Circulacao,\n            6.0 as Percentual_Acao_Ordinaria_Circulacao,\n            0 as Quantidade_Acao_Preferencial_Circulacao,\n            0.0 as Percentual_Acao_Preferencial_Circulacao,\n            120 as Quantidade_Total_Acoes_Circulacao,\n            6.0 as Percentual_Total_Acoes_Circulacao,\n\
