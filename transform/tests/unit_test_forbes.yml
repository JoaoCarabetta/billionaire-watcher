    format: sql
  expect:
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
- name: test_forbes_no_duplicate_if_in_positional_freeze
  description: 'FORBES SEAM TEST 5: A person already in positional freeze

    (freeze_status in ''in'', ''skip_soe'') must NOT be duplicated as candidato_forbes.

    '
  model: int_forbes_candidates
  given:
  - input: ref('forbes_billionaires_brazil_nexus')
    rows: "select\n            'Already In Freeze' as person_name,\n            2026 as forbes_year,\n            8.0 as estimated_wealth_usd_billions,\n            true as brazil_operations_nexus,\n            true as control_doc_available,\n            '33333333' as cnpj_basico,\n            'Consta da lista Forbes 2026' as notes,\n            'Forbes 2026' as source_doc"
    format: sql
  - input: ref('freeze_persons')
    rows: "select\n            5 as group_rank,\n            'Existing Company' as group_name,\n            '33333333' as cnpj_basico,\n            'Valor 1000 FY2024' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            true as listed_flag,\n            false as soe_flag,\n            'listed' as controlador_tipo,\n            'Already In Freeze' as person_name,\n            'controlador' as role,\n            'acionista_controlador' as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'CVM FRE 2026' as source_doc,\n            '6.1' as fre_item,\n            false as hole,\n            '***999999**' as cpf_masked,\n            'in' as freeze_status,\n            'Positional controller' as notes"
    format: sql
  expect:
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
