unit_tests:
- name: test_forbes_positional_freeze_preserved
  description: 'FORBES SEAM TEST 1: Positional freeze rows must still be present.

    Forbes candidates are ADDITIVE, not replacement.

    '
  model: freeze_persons_with_forbes
  given:
  - input: ref('freeze_persons')
    rows: "select\n            1 as group_rank,\n            'Test Company' as group_name,\n            '12345678' as cnpj_basico,\n            'Valor 1000 FY2024' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            true as listed_flag,\n            false as soe_flag,\n            'listed' as controlador_tipo,\n            'João Silva' as person_name,\n            'controlador' as role,\n            'acionista_controlador' as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'CVM FRE 2026' as source_doc,\n            '6.1' as fre_item,\n            false as hole,\n            '***123456**' as cpf_masked,\n            'in' as freeze_status,\n            'Test positional' as notes"
    format: sql
  - input: ref('int_forbes_candidates')
    rows: "select\n            cast(null as varchar) as group_rank,\n            cast(null as varchar) as group_name,\n            '87654321' as cnpj_basico,\n            'Forbes World''s Billionaires 2026' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            false as listed_flag,\n            false as soe_flag,\n            cast(null as varchar) as controlador_tipo,\n            'Maria Forbes' as person_name,\n            'candidato_forbes' as role,\n            cast(null as varchar) as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'Forbes 2026' as source_doc,\n            cast(null as varchar) as fre_item,\n            false as hole,\n            cast(null as varchar) as cpf_masked,\n            'review' as freeze_status,\n            'Consta da lista Forbes 2026' as notes"
    format: sql
  expect:
    rows: "select\n            1 as group_rank,\n            'Test Company' as group_name,\n            '12345678' as cnpj_basico,\n            'Valor 1000 FY2024' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            true as listed_flag,\n            false as soe_flag,\n            'listed' as controlador_tipo,\n            'João Silva' as person_name,\n            'controlador' as role,\n            'acionista_controlador' as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'CVM FRE 2026' as source_doc,\n            '6.1' as fre_item,\n            false as hole,\n            '***123456**' as cpf_masked,\n            'in' as freeze_status,\n            'Test positional' as notes\n          union all\n          select\n            cast(null as integer),\n            cast(null as varchar),\n            '87654321',\n            'Forbes World''s Billionaires 2026',\n            cast(null as varchar),\n            false,\n            false,\n            cast(null as varchar),\n            'Maria Forbes',\n            'candidato_forbes',\n            cast(null as varchar),\n            cast(null as varchar),\n            'Forbes 2026',\n            cast(null as varchar),\n            false,\n            cast(null as varchar),\n            'review',\n            'Consta da lista Forbes 2026'"
    format: sql
- name: test_forbes_candidates_are_review
  description: 'FORBES SEAM TEST 2: New Forbes rows must be role=candidato_forbes and freeze_status=review.

    '
  model: int_forbes_candidates
  given:
  - input: ref('forbes_billionaires_brazil_nexus')
    rows: "select\n            'Test Forbes Person' as person_name,\n            2026 as forbes_year,\n            5.0 as estimated_wealth_usd_billions,\n            true as brazil_operations_nexus,\n            false as control_doc_available,\n            '11111111' as cnpj_basico,\n            'Consta da lista Forbes 2026' as notes,\n            'Forbes 2026' as source_doc"
    format: sql
  - input: ref('freeze_persons')
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
  expect:
    rows: "select\n            cast(null as integer) as group_rank,\n            cast(null as varchar) as group_name,\n            '11111111' as cnpj_basico,\n            'Forbes World''s Billionaires 2026' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            false as listed_flag,\n            false as soe_flag,\n            cast(null as varchar) as controlador_tipo,\n            'Test Forbes Person' as person_name,\n            'candidato_forbes' as role,\n            cast(null as varchar) as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'Forbes 2026' as source_doc,\n            cast(null as varchar) as fre_item,\n            false as hole,\n            cast(null as varchar) as cpf_masked,\n            'review' as freeze_status,\n            'Consta da lista Forbes 2026' as notes"
    format: sql
- name: test_forbes_no_auto_promote_to_in
  description: 'FORBES SEAM TEST 3: candidato_forbes must stay freeze_status=review

    even when control_doc_available=true. No auto-promotion to ''in''.

    Humans promote, models do not.

    '
  model: int_forbes_candidates
  given:
  - input: ref('forbes_billionaires_brazil_nexus')
    rows: "select\n            'Forbes With Control Doc' as person_name,\n            2026 as forbes_year,\n            10.0 as estimated_wealth_usd_billions,\n            true as brazil_operations_nexus,\n            true as control_doc_available,\n            '22222222' as cnpj_basico,\n            'Consta da lista Forbes 2026 com controle documentado' as notes,\n            'Forbes 2026; FRE 6.1' as source_doc"
    format: sql
  - input: ref('freeze_persons')
    rows: "select
            cast(null as integer) as group_rank,
            cast(null as varchar) as group_name,
            cast(null as varchar) as cnpj_basico,
            cast(null as varchar) as ranking_source,
            cast(null as varchar) as receita_fy2024_brl,
            cast(null as boolean) as listed_flag,
            cast(null as boolean) as soe_flag,
            cast(null as varchar) as controlador_tipo,
            cast(null as varchar) as person_name,
            cast(null as varchar) as role,
            cast(null as varchar) as edge_label,
            cast(null as varchar) as acordo_acionistas,
            cast(null as varchar) as source_doc,
            cast(null as varchar) as fre_item,
            cast(null as boolean) as hole,
            cast(null as varchar) as cpf_masked,
            cast(null as varchar) as freeze_status,
            cast(null as varchar) as notes
          where false"
    format: sql
  expect:
    rows: "select\n            cast(null as integer) as group_rank,\n            cast(null as varchar) as group_name,\n            '22222222' as cnpj_basico,\n            'Forbes World''s Billionaires 2026' as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            false as listed_flag,\n            false as soe_flag,\n            cast(null as varchar) as controlador_tipo,\n            'Forbes With Control Doc' as person_name,\n            'candidato_forbes' as role,\n            cast(null as varchar) as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'Forbes 2026; FRE 6.1' as source_doc,\n            cast(null as varchar) as fre_item,\n            false as hole,\n            cast(null as varchar) as cpf_masked,\n            'review' as freeze_status,\n            'Consta da lista Forbes 2026 com controle documentado' as notes"
    format: sql
