unit_tests:
  - name: test_stg_cvm_fre_cnpj_14_digit_string
    description: |
      Verify CNPJ_Companhia is 14-digit STRING after stripping punctuation.
      JBS: 02.916.265/0001-60 → '02916265000160'.
    model: stg_cvm_fre_posicao_acionaria_2026
    given:
      - input: source('gcs_cvm', 'fre_posicao_acionaria_2026')
        format: sql
        rows: |
          select
            '02916265000160' as CNPJ_Companhia,
            '2025-12-31' as Data_Referencia,
            1 as Versao,
            123456 as ID_Documento,
            'JBS S.A.' as Nome_Companhia,
            1 as ID_Acionista,
            'TEST SHAREHOLDER' as Acionista,
            'PJ' as Tipo_Pessoa_Acionista,
            '12.345.678/0001-90' as CPF_CNPJ_Acionista,
            cast(null as integer) as ID_Acionista_Relacionado,
            cast(null as varchar) as Acionista_Relacionado,
            cast(null as varchar) as Tipo_Pessoa_Acionista_Relacionado,
            cast(null as varchar) as CPF_CNPJ_Acionista_Relacionado,
            1000000 as Quantidade_Acao_Ordinaria_Circulacao,
            25.5 as Percentual_Acao_Ordinaria_Circulacao,
            0 as Quantidade_Acao_Preferencial_Circulacao,
            0.0 as Percentual_Acao_Preferencial_Circulacao,
            1000000 as Quantidade_Total_Acoes_Circulacao,
            25.5 as Percentual_Total_Acoes_Circulacao,
            'BRASILEIRA' as Nacionalidade,
            'SP' as Sigla_UF,
            'N' as Residente_Exterior,
            cast(null as varchar) as Representante_Legal,
            cast(null as varchar) as Tipo_Pessoa_Representante_Legal,
            cast(null as varchar) as CPF_CNPJ_Representante_legal,
            '31/12/2025' as Data_Composicao_Capital_Social,
            '2025-12-31' as Data_Ultima_Alteracao,
            'N' as Acionista_Controlador,
            'N' as Participante_Acordo_Acionistas
    expect:
      format: sql
      fixture: stg_cvm_fre_cnpj_expect

