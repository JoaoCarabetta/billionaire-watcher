unit_tests:
  - name: test_stg_rf_socios_preserves_leading_zeros
    description: |
      Verify that cnpj_basico preserves leading zeros (JBS 02916265).
      RF partner edges are sócio relationships, never dono/UBO.
    model: stg_rf_socios
    given:
      - input: source('br_me_cnpj', 'socios')
        rows:
          - ano: 2026
            mes: 1
            data: '2026-01-11'
            cnpj_basico: '02916265'
            tipo: 'PJ'
            nome: 'TEST PARTNER LTDA'
            documento: '12345678901234'
            qualificacao: '49'
            data_entrada_sociedade: '2020-01-01'
            id_pais: null
            cpf_representante_legal: null
            nome_representante_legal: null
            qualificacao_representante_legal: null
            faixa_etaria: null
      - input: ref('freeze_cnpj_basicos')
        rows:
          - cnpj_basico: '02916265'
    expect:
      rows:
        - ano: 2026
          mes: 1
          data: '2026-01-11'
          cnpj_basico: '02916265'
          tipo: 'PJ'
          nome: 'TEST PARTNER LTDA'
          documento: '12345678901234'
          qualificacao: '49'
          data_entrada_sociedade: '2020-01-01'
          id_pais: null
          cpf_representante_legal: null
          nome_representante_legal: null
          qualificacao_representante_legal: null
          faixa_etaria: null

