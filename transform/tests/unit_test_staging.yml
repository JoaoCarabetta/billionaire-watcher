unit_tests:
  - name: test_stg_rf_socios_preserves_leading_zeros
    description: |
      Verify that cnpj_basico preserves leading zeros (JBS 02916265).
      RF partner edges are sócio relationships, never dono/UBO.
    model: stg_rf_socios
    given:
      - input: source('br_me_cnpj', 'socios')
        format: sql
        rows: |
          select
            2026 as ano,
            1 as mes,
            cast('2026-01-11' as date) as data,
            '02916265' as cnpj_basico,
            'PJ' as tipo,
            'TEST PARTNER LTDA' as nome,
            '12345678901234' as documento,
            '49' as qualificacao,
            cast('2020-01-01' as date) as data_entrada_sociedade,
            cast(null as varchar) as id_pais,
            cast(null as varchar) as cpf_representante_legal,
            cast(null as varchar) as nome_representante_legal,
            cast(null as varchar) as qualificacao_representante_legal,
            cast(null as varchar) as faixa_etaria
      - input: ref('freeze_cnpj_basicos')
        format: sql
        rows: |
          select '02916265' as cnpj_basico
    expect:
      format: sql
      rows: |
        select
          2026 as ano,
          1 as mes,
          cast('2026-01-11' as date) as data,
          '02916265' as cnpj_basico,
          'PJ' as tipo,
          'TEST PARTNER LTDA' as nome,
          '12345678901234' as documento,
          '49' as qualificacao,
          cast('2020-01-01' as date) as data_entrada_sociedade,
          cast(null as varchar) as id_pais,
          cast(null as varchar) as cpf_representante_legal,
          cast(null as varchar) as nome_representante_legal,
          cast(null as varchar) as qualificacao_representante_legal,
          cast(null as varchar) as faixa_etaria

  - name: test_stg_rf_empresas_preserves_leading_zeros
    description: Verify that cnpj_basico preserves leading zeros (JBS 02916265)
    model: stg_rf_empresas
    given:
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        rows: |
          select
            2026 as ano,
            1 as mes,
            cast('2026-01-11' as date) as data,
            '02916265' as cnpj_basico,
            'JBS S.A.' as razao_social,
            '2046' as natureza_juridica,
            '05' as qualificacao_responsavel,
            23631071304.24 as capital_social,
            '05' as porte,
            cast(null as varchar) as ente_federativo
      - input: ref('freeze_cnpj_basicos')
        format: sql
        rows: |
          select '02916265' as cnpj_basico
    expect:
      format: sql
      rows: |
        select
          2026 as ano,
          1 as mes,
          cast('2026-01-11' as date) as data,
          '02916265' as cnpj_basico,
          'JBS S.A.' as razao_social,
          '2046' as natureza_juridica,
          '05' as qualificacao_responsavel,
          23631071304.24 as capital_social,
          '05' as porte,
          cast(null as varchar) as ente_federativo

  - name: test_stg_rf_estabelecimentos_preserves_leading_zeros
    description: Verify that cnpj_basico (8) and cnpj (14) preserve leading zeros
    model: stg_rf_estabelecimentos
    given:
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: stg_rf_estabelecimentos_given
      - input: ref('freeze_cnpj_basicos')
        format: sql
        rows: |
          select '02916265' as cnpj_basico
    expect:
      format: sql
      fixture: stg_rf_estabelecimentos_expect

  - name: test_stg_group_flags_preserves_leading_zeros
    description: |
      Verify that cnpj_basico (8) and cnpj_full (14) preserve leading zeros.
      JBS: cnpj_basico '02916265', cnpj_full '02916265000160'.
    model: stg_group_flags
    given:
      - input: ref('top50_flags_seed')
        format: sql
        rows: |
          select
            2 as rank_2024,
            'JBS' as empresa,
            'JBS S.A.' as razao_social,
            '02916265' as cnpj_basico,
            '02916265000160' as cnpj_full,
            'true' as listed_flag,
            'CVM cad_cia_aberta' as listed_source,
            'false' as soe_flag,
            'Not a federal SOE' as soe_source,
            'listed' as controlador_tipo,
            'pending' as freeze_status_hint,
            'Brazilian listed issuer' as notes,
            'CVM cad_cia_aberta CD_CVM=20575' as source_doc,
            'basedosdados.br_me_cnpj' as cnpj_source,
            '2026-08-24' as retrieved_at
    expect:
      format: sql
      rows: |
        select
          2 as rank_2024,
          'JBS' as empresa,
          'JBS S.A.' as razao_social,
          '02916265' as cnpj_basico,
          '02916265000160' as cnpj_full,
          true as listed_flag,
          'CVM cad_cia_aberta' as listed_source,
          false as soe_flag,
          'Not a federal SOE' as soe_source,
          'listed' as controlador_tipo,
          'pending' as freeze_status_hint,
          'Brazilian listed issuer' as notes,
          'CVM cad_cia_aberta CD_CVM=20575' as source_doc,
          'basedosdados.br_me_cnpj' as cnpj_source,
          '2026-08-24' as retrieved_at

  - name: test_stg_cvm_fre_cnpj_14_digit_string
    description: |
      Verify CNPJ_Companhia is 14-digit STRING after stripping punctuation.
      JBS: 02.916.265/0001-60 → '02916265000160'.
    model: stg_cvm_fre_posicao_acionaria_2026
    given:
      - input: source('gcs_cvm', 'fre_posicao_acionaria_2026')
        format: sql
        rows: |
          select
            '02916265000160' as CNPJ_Companhia,
            '2025-12-31' as Data_Referencia,
            1 as Versao,
            123456 as ID_Documento,
            'JBS S.A.' as Nome_Companhia,
            1 as ID_Acionista,
            'TEST SHAREHOLDER' as Acionista,
            'PJ' as Tipo_Pessoa_Acionista,
            '12.345.678/0001-90' as CPF_CNPJ_Acionista,
            cast(null as integer) as ID_Acionista_Relacionado,
            cast(null as varchar) as Acionista_Relacionado,
            cast(null as varchar) as Tipo_Pessoa_Acionista_Relacionado,
            cast(null as varchar) as CPF_CNPJ_Acionista_Relacionado,
            1000000 as Quantidade_Acao_Ordinaria_Circulacao,
            25.5 as Percentual_Acao_Ordinaria_Circulacao,
            0 as Quantidade_Acao_Preferencial_Circulacao,
            0.0 as Percentual_Acao_Preferencial_Circulacao,
            1000000 as Quantidade_Total_Acoes_Circulacao,
            25.5 as Percentual_Total_Acoes_Circulacao,
            'BRASILEIRA' as Nacionalidade,
            'SP' as Sigla_UF,
            'N' as Residente_Exterior,
            cast(null as varchar) as Representante_Legal,
            cast(null as varchar) as Tipo_Pessoa_Representante_Legal,
            cast(null as varchar) as CPF_CNPJ_Representante_legal,
            '31/12/2025' as Data_Composicao_Capital_Social,
            '2025-12-31' as Data_Ultima_Alteracao,
            'N' as Acionista_Controlador,
            'N' as Participante_Acordo_Acionistas
    expect:
      format: sql
      fixture: stg_cvm_fre_cnpj_expect

