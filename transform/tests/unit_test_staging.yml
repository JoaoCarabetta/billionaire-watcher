    model: stg_cvm_cad_cia_aberta
    given:
      - input: source('gcs_cvm', 'cad_cia_aberta')
        format: sql
        rows: |
          select
            '02916265000160' as CNPJ_CIA,
            'JBS SA' as DENOM_SOCIAL,
