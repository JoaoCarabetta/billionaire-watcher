  - name: test_stg_group_flags_preserves_leading_zeros
    description: |
      Verify that cnpj_basico (8) and cnpj_full (14) preserve leading zeros.
      JBS: cnpj_basico '02916265', cnpj_full '02916265000160'.
    model: stg_group_flags
    given:
      - input: ref('top50_flags_seed')
        rows:
          - rank_2024: 2
            empresa: 'JBS'
            razao_social: 'JBS S.A.'
            cnpj_basico: '02916265'
            cnpj_full: '02916265000160'
            listed_flag: 'true'
            listed_source: 'CVM cad_cia_aberta'
            soe_flag: 'false'
            soe_source: 'Not a federal SOE'
            controlador_tipo: 'listed'
            freeze_status_hint: 'pending'
            notes: 'Brazilian listed issuer'
            source_doc: 'CVM cad_cia_aberta CD_CVM=20575'
            cnpj_source: 'basedosdados.br_me_cnpj'
            retrieved_at: '2026-08-24'
    expect:
      rows:
        - rank_2024: 2
          empresa: 'JBS'
          razao_social: 'JBS S.A.'
          cnpj_basico: '02916265'
          cnpj_full: '02916265000160'
          listed_flag: true
          listed_source: 'CVM cad_cia_aberta'
          soe_flag: false
          soe_source: 'Not a federal SOE'
          controlador_tipo: 'listed'
          freeze_status_hint: 'pending'
          notes: 'Brazilian listed issuer'
          source_doc: 'CVM cad_cia_aberta CD_CVM=20575'
          cnpj_source: 'basedosdados.br_me_cnpj'
          retrieved_at: '2026-08-24'

  - name: test_stg_cvm_fre_cnpj_14_digit_string
    description: |
      Verify CNPJ_Companhia is 14-digit STRING after stripping punctuation.
      JBS: 02.916.265/0001-60 → '02916265000160'.
    model: stg_cvm_fre_posicao_acionaria_2026
    given:
      - input: source('gcs_cvm', 'fre_posicao_acionaria_2026')
        rows:
          - CNPJ_Companhia: '02.916.265/0001-60'
            Data_Referencia: '2025-12-31'
            Versao: 1
            ID_Documento: 123456
            Nome_Companhia: 'JBS S.A.'
            ID_Acionista: 1
            Acionista: 'TEST SHAREHOLDER'
            Tipo_Pessoa_Acionista: 'PJ'
            CPF_CNPJ_Acionista: '12.345.678/0001-90'
            ID_Acionista_Relacionado: null
            Acionista_Relacionado: null
            Tipo_Pessoa_Acionista_Relacionado: null
            CPF_CNPJ_Acionista_Relacionado: null
