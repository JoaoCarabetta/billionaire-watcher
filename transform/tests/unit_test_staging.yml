            'BOLSA' as TP_MERC,
            'Categoria A' as CATEG_REG,
            '2007-04-02' as DT_INI_CATEG,
            'ATIVO' as SIT_EMISSOR,
            '2007-04-02' as DT_INI_SIT_EMISSOR,
            'PRIVADO' as CONTROLE_ACIONARIO,
            'COMERCIAL' as TP_ENDER,
            'AVENIDA MARGINAL DIREITA TIETE' as LOGRADOURO,
