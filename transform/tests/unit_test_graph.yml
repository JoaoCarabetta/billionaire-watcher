      Verify fund node has gestora and administrador edges only.
      No invented cotistas (zero rows with kind 'cotista').
      Fund 12345678 has edges from gestora 22334455 and administrador 33445566.
    model: graph_edges
    given:
      - input: ref('energisa_edges_fixture')
        format: sql
        rows: |
          select
            '22334455' as from_id,
            '12345678' as to_id,
            'participacao' as edge_kind,
            cast(null as double) as pct_capital,
            cast(null as double) as pct_votos,
            cast(null as integer) as qty_ordinarias,
            cast(null as integer) as qty_preferenciais,
