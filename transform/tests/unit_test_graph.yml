  - name: test_graph_edges_gipar_energisa_single_edge
    description: |
      Verify Gipar→Energisa is one control/participacao edge with two percents.
      27.74% total capital, 62.45% voting shares (published IR 14 Aug 2026).
    model: graph_edges
    given:
      - input: ref('energisa_edges_fixture')
        format: sql
        rows: |
          select
            '02260956' as from_id,
            '00864214' as to_id,
            'participacao' as edge_kind,
            cast(null as string) as edge_role,
            27.74 as pct_capital,
            62.45 as pct_votos,
            609526325 as qty_ordinarias,
            89144004 as qty_preferenciais,
            'Energisa IR 14 Aug 2026' as source_doc,
            'table 6.1' as source_locator,
            '2026-08-14' as source_retrieved_at
      - input: ref('graph_nodes')
        format: sql
        rows: |
          select '02260956' as node_id, 'company' as node_kind
          union all
          select '00864214' as node_id, 'company' as node_kind
      - input: ref('qsa_edges_fixture')
        format: sql
        rows: |
          select
            '99999999999' as from_id,
            '99999999' as to_id,
            'participacao' as edge_kind,
            cast(null as string) as edge_role,
            cast(null as double) as pct_capital,
            cast(null as double) as pct_votos,
            cast(null as integer) as qty_ordinarias,
            cast(null as integer) as qty_preferenciais,
            'Empty' as source_doc,
            'Empty' as source_locator,
            '2000-01-01' as source_retrieved_at
          where false
      - input: ref('qsa_companies_fixture')
        format: sql
        rows: |
          select '99999999' as cnpj_basico, 'company' as node_kind, 'Empty' as name
          where false
      - input: ref('qsa_persons_fixture')
        format: sql
        rows: |
          select '99999999999' as node_id, 'person' as node_kind, 'Empty' as name, '99999999999' as cpf, cast(null as string) as provisional_name_key
          where false
    expect:
      format: sql
      rows: |
        select
          '02260956' as from_id,
          '00864214' as to_id,
          'participacao' as edge_kind,
          cast(null as string) as edge_role,
          27.74 as pct_capital,
          62.45 as pct_votos,
          609526325 as qty_ordinarias,
          89144004 as qty_preferenciais,
          'Energisa IR 14 Aug 2026' as source_doc,
          'table 6.1' as source_locator,
          cast('2026-08-14' as date) as source_retrieved_at

  - name: test_graph_edges_hop_without_percent_keeps_edge
