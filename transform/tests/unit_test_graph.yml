unit_tests:
  - name: test_graph_nodes_company_key_8_digit_cnpj
    description: |
      Verify company key is CNPJ básico (8-digit STRING lpad).
      Energisa CNPJ básico '00864214'.
    model: graph_nodes
    given:
      - input: ref('energisa_companies_fixture')
        format: sql
        rows: |
          select
            '00864214' as cnpj_basico,
            'company' as node_kind,
            'Energisa S.A.' as name
      - input: ref('energisa_persons_fixture')
        format: sql
        rows: |
          select
            '12345678901' as node_id,
            'person' as node_kind,
            'Ana Costa Fictícia' as name,
            '12345678901' as cpf,
            cast(null as string) as provisional_name_key
    expect:
      format: sql
      rows: |
        select
          '00864214' as node_id,
          'company' as node_kind,
          'Energisa S.A.' as name,
          cast(null as string) as cpf,
          cast(null as string) as cpf_masked,
          cast(null as string) as provisional_name_key,
          '00864214' as cnpj_basico
        union all
        select
          '12345678901' as node_id,
          'person' as node_kind,
          'Ana Costa Fictícia' as name,
          '12345678901' as cpf,
          '***901***' as cpf_masked,
          cast(null as string) as provisional_name_key,
          cast(null as string) as cnpj_basico

  - name: test_graph_nodes_person_key_cpf_when_present
    description: |
      Verify person key is CPF (11 digits) when present.
      Person with CPF uses CPF as node_id.
      CPF masked as ***901*** (stars + last-3 + stars).
    model: graph_nodes
    given:
      - input: ref('energisa_companies_fixture')
        format: sql
        rows: |
          select
            '00864214' as cnpj_basico,
            'company' as node_kind,
            'Energisa S.A.' as name
      - input: ref('energisa_persons_fixture')
        format: sql
        rows: |
          select
            '12345678901' as node_id,
            'person' as node_kind,
            'Ana Costa Fictícia' as name,
            '12345678901' as cpf,
            cast(null as string) as provisional_name_key
    expect:
      format: sql
      rows: |
        select
          '00864214' as node_id,
          'company' as node_kind,
          'Energisa S.A.' as name,
          cast(null as string) as cpf,
          cast(null as string) as cpf_masked,
          cast(null as string) as provisional_name_key,
          '00864214' as cnpj_basico
        union all
        select
          '12345678901' as node_id,
          'person' as node_kind,
          'Ana Costa Fictícia' as name,
          '12345678901' as cpf,
          '***901***' as cpf_masked,
          cast(null as string) as provisional_name_key,
          cast(null as string) as cnpj_basico

  - name: test_graph_nodes_person_key_provisional_without_cpf
    description: |
      Verify person key is provisional_name_key when CPF is absent.
      Two identical names without CPF stay two nodes.
    model: graph_nodes
    given:
      - input: ref('energisa_companies_fixture')
        format: sql
        rows: |
          select
            '00864214' as cnpj_basico,
            'company' as node_kind,
            'Energisa S.A.' as name
      - input: ref('energisa_persons_fixture')
        format: sql
        rows: |
          select
            'Bruno Silva Teste_1' as node_id,
            'person' as node_kind,
            'Bruno Silva Teste' as name,
            cast(null as string) as cpf,
            'Bruno Silva Teste_1' as provisional_name_key
          union all
          select
            'Bruno Silva Teste_2' as node_id,
            'person' as node_kind,
            'Bruno Silva Teste' as name,
            cast(null as string) as cpf,
            'Bruno Silva Teste_2' as provisional_name_key
    expect:
      format: sql
      rows: |
        select
          '00864214' as node_id,
          'company' as node_kind,
          'Energisa S.A.' as name,
          cast(null as string) as cpf,
          cast(null as string) as cpf_masked,
          cast(null as string) as provisional_name_key,
          '00864214' as cnpj_basico
        union all
        select
          'Bruno Silva Teste_1' as node_id,
          'person' as node_kind,
          'Bruno Silva Teste' as name,
          cast(null as string) as cpf,
          cast(null as string) as cpf_masked,
          'Bruno Silva Teste_1' as provisional_name_key,
          cast(null as string) as cnpj_basico
        union all
        select
          'Bruno Silva Teste_2' as node_id,
          'person' as node_kind,
          'Bruno Silva Teste' as name,
          cast(null as string) as cpf,
          cast(null as string) as cpf_masked,
          'Bruno Silva Teste_2' as provisional_name_key,
          cast(null as string) as cnpj_basico

