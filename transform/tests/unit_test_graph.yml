  - name: test_graph_edges_gipar_energisa_single_edge
    description: |
      Verify Gipar→Energisa is one control/participacao edge with two percents.
      27.74% total capital, 62.45% voting shares (published IR 14 Aug 2026).
    model: graph_edges
    given:
      - input: ref('energisa_edges_fixture')
        format: sql
        rows: |
          select
            '02260956' as from_id,
            '00864214' as to_id,
            'participacao' as edge_kind,
            27.74 as pct_capital,
            62.45 as pct_votos,
            cast(null as integer) as qty_ordinarias,
            cast(null as integer) as qty_preferenciais,
            'Energisa IR 14 Aug 2026' as source_doc,
            'table 6.1' as source_locator,
            '2026-08-14' as source_retrieved_at
    expect:
      format: sql
      rows: |
        select
          '02260956' as from_id,
          '00864214' as to_id,
          'participacao' as edge_kind,
          27.74 as pct_capital,
          62.45 as pct_votos,
          cast(null as int64) as qty_ordinarias,
          cast(null as int64) as qty_preferenciais,
          'Energisa IR 14 Aug 2026' as source_doc,
          'table 6.1' as source_locator,
          cast('2026-08-14' as date) as source_retrieved_at

  - name: test_graph_edges_hop_without_percent_keeps_edge
    description: |
      Verify hop without percent keeps the edge.
      Both pct_capital and pct_votos are null (not zero).
      Diana → Minoritário Alpha has no percents.
    model: graph_edges
    given:
      - input: ref('energisa_edges_fixture')
        format: sql
        rows: |
          select
            'p5' as from_id,
            '44556677' as to_id,
            'participacao' as edge_kind,
            cast(null as double) as pct_capital,
            cast(null as double) as pct_votos,
            cast(null as integer) as qty_ordinarias,
            cast(null as integer) as qty_preferenciais,
            'Minoritário hop without percent' as source_doc,
            'fixture' as source_locator,
            '2026-08-14' as source_retrieved_at
    expect:
      format: sql
      rows: |
        select
          'p5' as from_id,
          '44556677' as to_id,
          'participacao' as edge_kind,
          cast(null as double) as pct_capital,
          cast(null as double) as pct_votos,
          cast(null as integer) as qty_ordinarias,
          cast(null as integer) as qty_preferenciais,
          'Minoritário hop without percent' as source_doc,
          'fixture' as source_locator,
          cast('2026-08-14' as date) as source_retrieved_at

  - name: test_graph_cycles_self_loop
    description: |
      Verify cycle detection: walk stops, cycle recorded, edges kept.
      Multisetor → Multisetor is a self-loop cycle.
    model: graph_cycles
    given:
      - input: ref('graph_edges')
        format: sql
        rows: |
          select
            '99887766' as from_id,
            '99887766' as to_id,
            'participacao' as edge_kind,
            cast(null as double) as pct_capital,
            cast(null as double) as pct_votos,
            cast(null as integer) as qty_ordinarias,
            cast(null as integer) as qty_preferenciais,
            'Cycle test edge' as source_doc,
            'fixture' as source_locator,
            cast('2026-08-14' as date) as source_retrieved_at
      - input: ref('graph_nodes')
        format: sql
        rows: |
          select
            '99887766' as node_id,
            'company' as node_kind,
            'Multisetor Holding S.A.' as name,
            cast(null as string) as cpf,
            cast(null as string) as cpf_masked,
            cast(null as string) as provisional_name_key,
            '99887766' as cnpj_basico
    expect:
      format: sql
      rows: |
        select
          '99887766' as cycle_start,
          ['99887766'] as cycle_path

  - name: test_graph_edges_fund_gestora_administrador_only
