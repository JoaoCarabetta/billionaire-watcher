      rows: |
        select
          '22334455' as from_id,
          '12345678' as to_id,
          'participacao' as edge_kind,
          cast(null as double) as pct_capital,
          cast(null as double) as pct_votos,
          cast(null as integer) as qty_ordinarias,
          cast(null as integer) as qty_preferenciais,
          'Fund gestora' as source_doc,
          'fixture' as source_locator,
          cast('2026-08-14' as date) as source_retrieved_at
        union all
        select
          '33445566' as from_id,
          '12345678' as to_id,
          'participacao' as edge_kind,
          cast(null as double) as pct_capital,
          cast(null as double) as pct_votos,
          cast(null as integer) as qty_ordinarias,
          cast(null as integer) as qty_preferenciais,
          'Fund administrador' as source_doc,
          'fixture' as source_locator,
          cast('2026-08-14' as date) as source_retrieved_at

  - name: test_graph_person_holdings_complete_path_only
    description: |
      Verify derived person fields only on complete paths.
      Ana → Itacatu (70%) → Nova Gipar (50%) → Gipar (100%) → Energisa (27.74% capital, 62.45% votes).
      Model returns all paths; this test checks the 4-hop path to Energisa.
      Product: 70 × 50 × 100 × 27.74 / 1000000 = 9.709% capital.
      Product: 70 × 50 × 100 × 62.45 / 1000000 = 21.8575% votes.
    model: graph_person_holdings
    given:
      - input: ref('graph_edges')
        format: sql
        rows: |
          select 'p1' as from_id, '55667788' as to_id, 70.0 as pct_capital, 70.0 as pct_votos
          union all
          select '55667788' as from_id, '11223344' as to_id, 50.0 as pct_capital, 50.0 as pct_votos
          union all
          select '11223344' as from_id, '02260956' as to_id, 100.0 as pct_capital, 100.0 as pct_votos
          union all
          select '02260956' as from_id, '00864214' as to_id, 27.74 as pct_capital, 62.45 as pct_votos
      - input: ref('graph_nodes')
        format: sql
        rows: |
          select 'p1' as node_id, 'person' as node_kind, 'Ana Costa Fictícia' as name, '***901' as cpf_masked
          union all
          select '55667788' as node_id, 'company' as node_kind, 'Itacatu Participações S.A.' as name, cast(null as string) as cpf_masked
          union all
          select '11223344' as node_id, 'company' as node_kind, 'Nova Gipar Holding S.A.' as name, cast(null as string) as cpf_masked
          union all
          select '02260956' as node_id, 'company' as node_kind, 'Gipar S.A.' as name, cast(null as string) as cpf_masked
          union all
          select '00864214' as node_id, 'company' as node_kind, 'Energisa S.A.' as name, cast(null as string) as cpf_masked
    expect:
      format: sql
      rows: |
        select
          'p1' as person_node_id,
          'Ana Costa Fictícia' as person_name,
          '***901' as cpf_masked,
          '55667788' as company_node_id,
          'Itacatu Participações S.A.' as company_name,
          cast(70.0 as decimal) as pct_economica_pessoa,
          cast(70.0 as decimal) as pct_votos_pessoa,
          1 as path_length
        union all
        select
          'p1' as person_node_id,
          'Ana Costa Fictícia' as person_name,
          '***901' as cpf_masked,
          '11223344' as company_node_id,
          'Nova Gipar Holding S.A.' as company_name,
          cast(35.0 as decimal) as pct_economica_pessoa,
          cast(35.0 as decimal) as pct_votos_pessoa,
          2 as path_length
        union all
        select
          'p1' as person_node_id,
          'Ana Costa Fictícia' as person_name,
          '***901' as cpf_masked,
          '02260956' as company_node_id,
          'Gipar S.A.' as company_name,
          cast(35.0 as decimal) as pct_economica_pessoa,
          cast(35.0 as decimal) as pct_votos_pessoa,
          3 as path_length
        union all
        select
          'p1' as person_node_id,
          'Ana Costa Fictícia' as person_name,
          '***901' as cpf_masked,
          '00864214' as company_node_id,
          'Energisa S.A.' as company_name,
          9.709 as pct_economica_pessoa,
          21.8575 as pct_votos_pessoa,
          4 as path_length

  - name: test_graph_person_holdings_incomplete_path_null
    description: |
      Verify incomplete path (hop without percent) produces null person percents.
      Diana → Minoritário Alpha (no percent) → Energisa (5% capital, 3.2% votes).
      Product should be null because first hop has null percents.
      Model returns both the 1-hop (to Alpha) and 2-hop (to Energisa) paths.
    model: graph_person_holdings
    given:
      - input: ref('graph_edges')
        format: sql
        rows: |
          select 'p5' as from_id, '44556677' as to_id, cast(null as double) as pct_capital, cast(null as double) as pct_votos
          union all
          select '44556677' as from_id, '00864214' as to_id, 5.0 as pct_capital, 3.2 as pct_votos
      - input: ref('graph_nodes')
        format: sql
        rows: |
          select 'p5' as node_id, 'person' as node_kind, 'Diana Oliveira Teste' as name, cast(null as string) as cpf_masked
          union all
          select '44556677' as node_id, 'company' as node_kind, 'Minoritário Alpha S.A.' as name, cast(null as string) as cpf_masked
          union all
          select '00864214' as node_id, 'company' as node_kind, 'Energisa S.A.' as name, cast(null as string) as cpf_masked
    expect:
      format: sql
      rows: |
        select
          'p5' as person_node_id,
          'Diana Oliveira Teste' as person_name,
          cast(null as string) as cpf_masked,
          '44556677' as company_node_id,
          'Minoritário Alpha S.A.' as company_name,
          cast(null as double) as pct_economica_pessoa,
          cast(null as double) as pct_votos_pessoa,
          1 as path_length
        union all
        select
          'p5' as person_node_id,
          'Diana Oliveira Teste' as person_name,
          cast(null as string) as cpf_masked,
          '00864214' as company_node_id,
          'Energisa S.A.' as company_name,
          cast(null as double) as pct_economica_pessoa,
          cast(null as double) as pct_votos_pessoa,
          2 as path_length

