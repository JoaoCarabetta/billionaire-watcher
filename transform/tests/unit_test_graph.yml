unit_tests:
  - name: test_graph_nodes_company_key_8_digit_cnpj
    description: |
      Verify company key is CNPJ básico (8-digit STRING lpad).
      Energisa CNPJ básico '00864214'.
    model: graph_nodes
    given:
      - input: ref('energisa_companies_fixture')
        format: sql
        rows: |
          select
            '00864214' as cnpj_basico,
            'company' as node_kind,
            'Energisa S.A.' as name
      - input: ref('energisa_persons_fixture')
        format: sql
        rows: |
          select
            '12345678901' as node_id,
            'person' as node_kind,
            'Ana Costa Fictícia' as name,
            '12345678901' as cpf,
            cast(null as string) as provisional_name_key
      - input: ref('qsa_companies_fixture')
        format: sql
        rows: |
          select '99999999' as cnpj_basico, 'company' as node_kind, 'Empty' as name
          where false
      - input: ref('qsa_persons_fixture')
        format: sql
        rows: |
          select '99999999999' as node_id, 'person' as node_kind, 'Empty' as name, '99999999999' as cpf, cast(null as string) as provisional_name_key
          where false
    expect:
      format: sql
      rows: |
        select
          '00864214' as node_id,
          'company' as node_kind,
          'Energisa S.A.' as name,
          cast(null as string) as cpf,
          cast(null as string) as cpf_masked,
          cast(null as string) as provisional_name_key,
          '00864214' as cnpj_basico
        union all
        select
          '12345678901' as node_id,
          'person' as node_kind,
          'Ana Costa Fictícia' as name,
          '12345678901' as cpf,
          '***901***' as cpf_masked,
          cast(null as string) as provisional_name_key,
          cast(null as string) as cnpj_basico

