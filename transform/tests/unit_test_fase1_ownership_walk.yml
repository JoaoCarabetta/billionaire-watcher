unit_tests:
  - name: test_fase1_ownership_walk_emits_empresas
    description: |
      End-to-end fase 1 seam, empresas output: the CVM, BCB, and SUSEP
      registries seed the walk; FRE and QSA legal-person owners enter as subida,
      including a tipo 3 foreign holding without an invented CNPJ. A QSA mask
      shared by two stored oligarch CPFs does not admit its company.
    model: empresas
    given:
      - input: source('fase1_landing', 'controle_empresas_walk')
        format: sql
        fixture: fase1_e2e_seed_a_given
      - input: ref('stg_cvm_cad_cia_aberta')
        format: sql
        fixture: fase1_e2e_cvm_given
      - input: source('fase1_landing', 'bcb_entidades_supervisionadas')
        format: sql
        fixture: fase1_e2e_bcb_given
      - input: source('fase1_landing', 'susep_dados_cadastrais')
        format: sql
        fixture: fase1_e2e_susep_given
      - input: ref('int_empresas_piso')
        format: sql
        fixture: fase1_e2e_empresas_pisos_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: fase1_e2e_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: fase1_e2e_qsa_empresas_given
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: fase1_e2e_qsa_socios_given
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: fase1_e2e_qsa_estabelecimentos_given
    expect:
      format: sql
      fixture: fase1_e2e_empresas_expect

  - name: test_fase1_ownership_walk_emits_vinculos
    description: |
      End-to-end fase 1 seam, edge output: all cited natural people enter and
      company owners traversed by the existing walk point to the companies they
      own, including Formulário-tree person edges whose destination is the
      parent holding (`ID_Acionista_Relacionado`) rather than the issuer.
      QSA rows stay socio, tipo 3 foreign partners do not stop, and old
      FRE documents and administrators do not enter.
    model: vinculos
    given:
      - input: ref('int_walk_roots')
        format: sql
        fixture: fase1_e2e_walk_roots_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: fase1_e2e_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: fase1_e2e_qsa_empresas_given
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: fase1_e2e_qsa_socios_given
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: fase1_e2e_qsa_estabelecimentos_given
    expect:
      format: sql
      fixture: fase1_e2e_vinculos_expect

  - name: test_fase1_ownership_walk_emits_pessoas_empresas
    description: |
      The compatibility view keeps every existing fase 1 person-company row
      and excludes company-origin rows from vinculos.
    model: pessoas_empresas
    given:
      - input: ref('vinculos')
        format: sql
        fixture: fase1_e2e_vinculos_expect
    expect:
      format: sql
      fixture: fase1_e2e_pessoas_empresas_expect

  - name: test_fase1_ownership_walk_emits_percursos
    description: |
      Every e_oligarca person has a stored percurso to a seed Formulário door
      with fonte_documento on every step. Wesley-shaped seed-Formulário people
      keep a one-step path. Inherited holding partners (Quadro de Sócios or
      Formulário tree) have a chain of at least two steps ending on the seed
      door. Hop partners and controllers on a subida company that is not on a
      seed door do not get a path.
    model: percursos
    given:
      - input: ref('vinculos')
        format: sql
        fixture: fase1_e2e_vinculos_expect
      - input: ref('empresas')
        format: sql
        fixture: fase1_e2e_empresas_expect
      - input: ref('pessoas')
        format: sql
        fixture: fase1_e2e_pessoas_expect
    expect:
      format: sql
      fixture: fase1_e2e_percursos_expect

  - name: test_fase1_ownership_walk_rejects_zero_cnpj_hub
    description: |
      A FRE legal-person row with CPF_CNPJ_Acionista 00.000.000/0000-00
      becomes a nome: owner key, never the shared 00000000000000 hub.
      Two issuers whose zero-document shareholders have different names
      stay disconnected. An older Data_Referencia on the same edge is
      dropped in favor of the latest date.
    model: vinculos
    given:
      - input: ref('int_walk_roots')
        format: sql
        fixture: zero_cnpj_walk_roots_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: zero_cnpj_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: ownership_qsa_empresas_empty
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: ownership_qsa_socios_empty
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: ownership_qsa_estabelecimentos_empty
    expect:
      format: sql
      fixture: zero_cnpj_vinculos_expect

  - name: test_fase1_ownership_walk_emits_pessoas
    description: |
      End-to-end fase 1 seam, people output: Alice is an oligarch through
      controller S on a seed and has one valued path plus incomplete hop paths.
      Camila, Carlos, Davi, and Ines have only complete valued paths; the QSA
      partners of seeds have no valued path because Receita cites no percentages.
      Felipe inherits e_oligarca as a Quadro de Sócios partner of a
      Formulário-controller holding, with an incomplete fortune. Jose inherits
      through the seed Formulário tree. Diana inherits because her holding sits
      on a seed door with at least 10 percent ordinary. Elena's cited percentage
      cannot be valued because her hop company has no floor. Hop partners stay
      false. Ines stays false: controller on a subida company that is not on a
      seed door.
    model: pessoas
    given:
      - input: ref('int_walk_roots')
        format: sql
        fixture: fase1_e2e_walk_roots_given
      - input: ref('int_empresas_piso')
        format: sql
        fixture: fase1_e2e_empresas_pisos_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: fase1_e2e_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: fase1_e2e_qsa_empresas_given
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: fase1_e2e_qsa_socios_given
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: fase1_e2e_qsa_estabelecimentos_given
    expect:
      format: sql
      fixture: fase1_e2e_pessoas_expect
