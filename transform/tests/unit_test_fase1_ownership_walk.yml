unit_tests:
  - name: test_fase1_ownership_walk_emits_empresas
    description: |
      End-to-end fase 1 seam, empresas output: the CVM, BCB, and SUSEP
      registries seed the walk; FRE and QSA legal-person owners enter as subida,
      including a tipo 3 foreign holding without an invented CNPJ. A QSA mask
      shared by two stored oligarch CPFs does not admit its company.
    model: empresas
    given:
      - input: source('fase1_landing', 'controle_empresas_walk')
        format: sql
        fixture: fase1_e2e_seed_a_given
      - input: ref('stg_cvm_cad_cia_aberta')
        format: sql
        fixture: fase1_e2e_cvm_given
      - input: source('fase1_landing', 'bcb_entidades_supervisionadas')
        format: sql
        fixture: fase1_e2e_bcb_given
      - input: source('fase1_landing', 'susep_dados_cadastrais')
        format: sql
        fixture: fase1_e2e_susep_given
      - input: ref('int_empresas_piso')
        format: sql
        fixture: fase1_e2e_empresas_pisos_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: fase1_e2e_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: fase1_e2e_qsa_empresas_given
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: fase1_e2e_qsa_socios_given
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: fase1_e2e_qsa_estabelecimentos_given
    expect:
      format: sql
      fixture: fase1_e2e_empresas_expect

  - name: test_fase1_ownership_walk_emits_vinculos
    description: |
      End-to-end fase 1 seam, edge output: all cited natural people enter and
      company owners traversed by the existing walk point to the companies they
      own. QSA rows stay socio, tipo 3 foreign partners do not stop, and old
      FRE documents and administrators do not enter.
    model: vinculos
    given:
      - input: ref('int_walk_roots')
        format: sql
        fixture: fase1_e2e_walk_roots_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: fase1_e2e_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: fase1_e2e_qsa_empresas_given
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: fase1_e2e_qsa_socios_given
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: fase1_e2e_qsa_estabelecimentos_given
    expect:
      format: sql
      fixture: fase1_e2e_vinculos_expect

  - name: test_fase1_ownership_walk_emits_pessoas_empresas
    description: |
      The compatibility view keeps every existing fase 1 person-company row
      and excludes company-origin rows from vinculos.
    model: pessoas_empresas
    given:
      - input: ref('vinculos')
        format: sql
        fixture: fase1_e2e_vinculos_expect
    expect:
      format: sql
      fixture: fase1_e2e_pessoas_empresas_expect

  - name: test_fase1_ownership_walk_emits_pessoas
    description: |
      End-to-end fase 1 seam, people output: Alice is an oligarch through
      controller S on a seed and has one valued path plus incomplete hop paths.
      Camila, Carlos, Davi, and Diana have only complete valued paths; the QSA
      partners have no valued path because Receita cites no percentages.
      Elena's cited percentage cannot be valued because her hop company has no
      floor. The oligarch flags remain exactly those established by issue 181.
    model: pessoas
    given:
      - input: ref('int_walk_roots')
        format: sql
        fixture: fase1_e2e_walk_roots_given
      - input: ref('int_empresas_piso')
        format: sql
        fixture: fase1_e2e_empresas_pisos_given
      - input: ref('stg_cvm_fre_posicao_acionaria_2026')
        format: sql
        fixture: fase1_e2e_fre_given
      - input: source('br_me_cnpj', 'empresas')
        format: sql
        fixture: fase1_e2e_qsa_empresas_given
      - input: source('br_me_cnpj', 'socios')
        format: sql
        fixture: fase1_e2e_qsa_socios_given
      - input: source('br_me_cnpj', 'estabelecimentos')
        format: sql
        fixture: fase1_e2e_qsa_estabelecimentos_given
    expect:
      format: sql
      fixture: fase1_e2e_pessoas_expect
