version: 2
unit_tests:
- name: test_published_facts_fact_id_unique
  description: 'Seam 1: fact_id must be unique in published_facts.

    Fixture includes duplicate fact_ids to ensure test catches violations.

    '
  model: published_facts
  given:
  - input: ref('identity_facts')
    rows: "select\n            'fact_001' as fact_id,\n            'João Silva' as person_name,\n            'identity' as fact_kind,\n            'name' as field,\n            'João Silva' as value,\n            'CVM' as source_publisher,\n            'CVM FRE 2026' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '02916265' as cnpj_basico,\n            'JBS' as group_name\n          union all\n          select\n            'fact_002' as fact_id,\n            'Maria Santos' as person_name,\n            'identity' as fact_kind,\n            'name' as field,\n            'Maria Santos' as value,\n            'RF' as source_publisher,\n            'RF QSA' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '33000167' as cnpj_basico,\n            'Petrobras' as group_name"
    format: sql
  - input: ref('control_edge_facts')
    rows: "select\n            'fact_003' as fact_id,\n            'João Silva' as person_name,\n            'control_edge' as fact_kind,\n            'João Silva é sócio de JBS' as value,\n            'RF' as source_publisher,\n            'RF QSA' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '02916265' as cnpj_basico,\n            'JBS' as group_name,\n            'socio' as edge_label"
    format: sql
  - input: ref('donation_facts')
    rows: "select\n            cast(null as varchar) as fact_id,\n            cast(null as varchar) as person_name,\n            cast(null as varchar) as fact_kind,\n            cast(null as varchar) as value,\n            cast(null as varchar) as source_publisher,\n            cast(null as varchar) as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            cast(null as varchar) as cnpj_basico,\n            cast(null as varchar) as group_name\n          where false"
    format: sql
  - input: ref('association_facts')
    rows: "select\n            cast(null as varchar) as fact_id,\n            cast(null as varchar) as person_name,\n            cast(null as varchar) as fact_kind,\n            cast(null as varchar) as value,\n            cast(null as varchar) as source_publisher,\n            cast(null as varchar) as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            cast(null as varchar) as cnpj_basico,\n            cast(null as varchar) as group_name,\n            NULL::VARCHAR[] as supporting_fact_ids\n          where false"
    format: sql
  expect:
    rows: "select\n            'fact_001' as fact_id,\n            'João Silva' as person_id,\n            'identity' as fact_kind,\n            'João Silva' as value,\n            'CVM' as source_publisher,\n            'CVM FRE 2026' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '02916265' as cnpj_basico,\n            'JBS' as group_name,\n            NULL::VARCHAR[] as supporting_fact_ids\n          union all\n          select\n            'fact_002' as fact_id,\n            'Maria Santos' as person_id,\n            'identity' as fact_kind,\n            'Maria Santos' as value,\n            'RF' as source_publisher,\n            'RF QSA' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '33000167' as cnpj_basico,\n            'Petrobras' as group_name,\n            NULL::VARCHAR[] as supporting_fact_ids\n          union all\n          select\n            'fact_003' as fact_id,\n            'João Silva' as person_id,\n            'control_edge' as fact_kind,\n            'João Silva é sócio de JBS' as value,\n            'RF' as source_publisher,\n            'RF QSA' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '02916265' as cnpj_basico,\n            'JBS' as group_name,\n            NULL::VARCHAR[] as supporting_fact_ids"
    format: sql
