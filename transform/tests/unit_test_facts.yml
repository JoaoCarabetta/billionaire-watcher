            person_name: Ana Maria Silva
            fact_kind: donation
            value: Ana Maria Silva doou R$ 50000.0 para Deputado Federal Candidato A em 2026 (recibo 2026001)
            source_publisher: Tribunal Superior Eleitoral
            source_locator: TSE Receitas Candidato 2026 recibo 2026001
            source_retrieved_at: null
