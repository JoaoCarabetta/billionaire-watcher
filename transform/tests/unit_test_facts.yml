  # Donation TDD Seam 3: only freeze_status=in publishes donations
  - name: test_donation_facts_only_freeze_status_in
    description: |
      Donation Seam 3: Only freeze_status=in persons publish donation facts.
      review/hole/skip_soe/candidato_forbes do NOT publish.
    model: donation_facts
    given:
      - input: ref('freeze_persons_with_forbes')
