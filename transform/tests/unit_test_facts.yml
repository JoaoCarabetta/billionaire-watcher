            group_name: Test Group C
            role: null
            source_doc: CVM FRE 2026
            cpf_masked: '***999***'
      - input: ref('tse_donations_2026')
        rows:
          - ano: 2026
            cpf_candidato: '***234***'
            nome_candidato: Deputado Federal Candidato A
            cpf_cnpj_doador: '***456***'
            nome_doador: Ana Maria Silva
            valor_receita: 50000.00
            tipo_receita: Doação
            fonte_receita: Pessoa física
            numero_recibo_eleitoral: '2026001'
            cpf_doador_masked: '***456***'
          - ano: 2026
