            valor_receita: 50000.00
            tipo_receita: Doação
            fonte_receita: Pessoa física
            numero_recibo_eleitoral: '2026001'
            cpf_doador_masked: '***456***'
          - ano: 2026
            cpf_candidato: '***234***'
            nome_candidato: Deputado Federal Candidato A
            cpf_cnpj_doador: '***789***'
            nome_doador: Carlos Eduardo Santos
            valor_receita: 75000.00
            tipo_receita: Doação
            fonte_receita: Pessoa física
            numero_recibo_eleitoral: '2026002'
            cpf_doador_masked: '***789***'
    expect:
      rows:
        - fact_id: donation_2026001_Ana Maria Silva
          person_name: Ana Maria Silva
          fact_kind: donation
        - fact_id: donation_2026002_Carlos Eduardo Santos
          person_name: Carlos Eduardo Santos
          fact_kind: donation

  # Donation TDD Seam 2: source_locator not_null
  - name: test_donation_facts_source_not_null
    description: |
      Donation Seam 2: source_locator must never be null.
    model: donation_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: Ana Maria Silva
