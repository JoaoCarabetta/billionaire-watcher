  # Association TDD Seam 1: association without supporting fact_ids does NOT emit
  - name: test_association_facts_no_emit_without_supporting_facts
    description: |
      Association Seam 1: Association without supporting fact_ids does NOT emit.
    model: association_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: Ana Maria Silva
            freeze_status: in
            cnpj_basico: '11111111'
