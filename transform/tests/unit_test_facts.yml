  # PM Review 1: No candidate CPF in value or fact_id
  - name: test_no_candidate_cpf_in_value_or_fact_id
    description: |
      PM Review: No candidate CPF in value or fact_id.
      Live TSE has full CPF. Public fields use candidate name only.
    model: published_facts
    given:
      - input: ref('identity_facts')
        rows: []
      - input: ref('control_edge_facts')
        rows: []
      - input: ref('donation_facts')
        rows:
