- name: test_identity_facts_only_freeze_status_in
  description: 'Seam 3: Every published fact''s person must be in freeze with freeze_status=in.

    Fixture includes review/hole/skip_soe to ensure they produce zero facts.

    '
  model: identity_facts
  given:
  - input: ref('freeze_persons_with_forbes')
    rows: "select\n            cast(null as integer) as group_rank,\n            'JBS' as group_name,\n            '02916265' as cnpj_basico,\n            cast(null as varchar) as ranking_source,\n            cast(null as varchar) as receita_fy2024_brl,\n            cast(null as boolean) as listed_flag,\n            cast(null as boolean) as soe_flag,\n            cast(null as varchar) as controlador_tipo,\n            'João Silva' as person_name,\n            'controlador' as role,\n            cast(null as varchar) as edge_label,\n            cast(null as varchar) as acordo_acionistas,\n            'CVM FRE 2026' as source_doc,\n            cast(null as varchar) as fre_item,\n            cast(null as boolean) as hole,\n            cast(null as varchar) as cpf_masked,\n            'in' as freeze_status,\n            cast(null as varchar) as notes\n          union all\n          select\n            cast(null as integer), 'Petrobras', '33000167', cast(null as varchar), cast(null as varchar), cast(null as boolean), cast(null as boolean), cast(null as varchar), 'Pedro Costa', 'candidato_forbes', cast(null as varchar), cast(null as varchar), 'Forbes 2026', cast(null as varchar), cast(null as boolean), cast(null as varchar), 'review', cast(null as varchar)\n          union all\n          select\n            cast(null as integer), 'Vale', '01832635', cast(null as varchar), cast(null as varchar), cast(null as boolean), cast(null as boolean), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), 'CVM FRE 2026 empty', cast(null as varchar), cast(null as boolean), cast(null as varchar), 'hole', cast(null as varchar)\n          union all\n          select\n            cast(null as integer), 'Banco do Brasil', '33592510', cast(null as varchar), cast(null as varchar), cast(null as boolean), cast(null as boolean), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as varchar), cast(null as boolean), cast(null as varchar), 'skip_soe', cast(null as varchar)"
    format: sql
  expect:
    rows: "select\n            'identity_02916265_João Silva_name' as fact_id,\n            'João Silva' as person_name,\n            'identity' as fact_kind,\n            'name' as field,\n            'João Silva' as value,\n            'CVM - Comissão de Valores Mobiliários' as source_publisher,\n            'CVM FRE 2026' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '02916265' as cnpj_basico,\n            'JBS' as group_name\n          union all\n          select\n            'identity_02916265_João Silva_role', 'João Silva', 'identity', 'role', 'controlador', 'CVM - Comissão de Valores Mobiliários', 'CVM FRE 2026', cast(null as varchar), cast(null as varchar), '02916265', 'JBS'\n          union all\n          select\n            'identity_02916265_João Silva_group', 'João Silva', 'identity', 'group_name', 'JBS', 'CVM - Comissão de Valores Mobiliários', 'CVM FRE 2026', cast(null as varchar), cast(null as varchar), '02916265', 'JBS'"
    format: sql
