    rows: "select\n            'fact_valid' as fact_id,\n            'João Silva' as person_id,\n            'identity' as fact_kind,\n            'João Silva' as value,\n            'CVM' as source_publisher,\n            'CVM FRE 2026' as source_locator,\n            cast(null as varchar) as source_retrieved_at,\n            cast(null as varchar) as cpf_masked,\n            '02916265' as cnpj_basico,\n            'JBS' as group_name,\n            NULL::VARCHAR[] as supporting_fact_ids"
