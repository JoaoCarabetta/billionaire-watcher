version: 2

unit_tests:
  # TDD Seam 1: fact_id unique
  - name: test_published_facts_fact_id_unique
    description: |
      Seam 1: fact_id must be unique in published_facts.
      Fixture includes duplicate fact_ids to ensure test catches violations.
    model: published_facts
    given:
      - input: ref('identity_facts')
        rows:
          - fact_id: fact_001
            person_name: João Silva
            fact_kind: identity
            value: João Silva
            source_publisher: CVM
            source_locator: CVM FRE 2026
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '02916265'
            group_name: JBS
          - fact_id: fact_002
            person_name: Maria Santos
            fact_kind: identity
            value: Maria Santos
            source_publisher: RF
            source_locator: RF QSA
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '33000167'
            group_name: Petrobras
      - input: ref('control_edge_facts')
        rows:
          - fact_id: fact_003
            person_name: João Silva
            fact_kind: control_edge
            value: João Silva é sócio de JBS
            source_publisher: RF
            source_locator: RF QSA
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '02916265'
            group_name: JBS
    expect:
      rows:
        - fact_id: fact_001
          person_id: João Silva
        - fact_id: fact_002
          person_id: Maria Santos
        - fact_id: fact_003
          person_id: João Silva

  # TDD Seam 2: source_locator not_null
  - name: test_published_facts_source_not_null
    description: |
      Seam 2: source_locator must never be null.
      Fixture includes null source to ensure test catches violations.
    model: published_facts
    given:
      - input: ref('identity_facts')
        rows:
          - fact_id: fact_valid
            person_name: João Silva
            fact_kind: identity
            value: João Silva
            source_publisher: CVM
            source_locator: CVM FRE 2026
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '02916265'
            group_name: JBS
      - input: ref('control_edge_facts')
        rows: []
    expect:
      rows:
        - fact_id: fact_valid
          person_id: João Silva
          source_locator: CVM FRE 2026

  # TDD Seam 3: relationship to freeze_status=in
  - name: test_identity_facts_only_freeze_status_in
    description: |
      Seam 3: Every published fact's person must be in freeze with freeze_status=in.
      Fixture includes review/hole/skip_soe to ensure they produce zero facts.
    model: identity_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: João Silva
            freeze_status: in
            cnpj_basico: '02916265'
            group_name: JBS
            role: controlador
            source_doc: CVM FRE 2026
            cpf_masked: null
          - person_name: Pedro Costa
            freeze_status: review
            cnpj_basico: '33000167'
            group_name: Petrobras
            role: candidato_forbes
            source_doc: Forbes 2026
            cpf_masked: null
          - person_name: null
            freeze_status: hole
            cnpj_basico: '01832635'
            group_name: Vale
            role: null
            source_doc: CVM FRE 2026 empty
            cpf_masked: null
          - person_name: null
            freeze_status: skip_soe
            cnpj_basico: '33592510'
            group_name: Banco do Brasil
            role: null
            source_doc: null
            cpf_masked: null
    expect:
      rows:
        - person_name: João Silva
          fact_kind: identity
          value: João Silva
        - person_name: João Silva
          fact_kind: identity
          value: controlador
        - person_name: João Silva
          fact_kind: identity
          value: JBS

  # TDD Seam 4: review/hole/skip_soe/candidato_forbes produce zero published facts
  - name: test_published_facts_excludes_non_in_status
    description: |
      Seam 4: review / hole / skip_soe / candidato_forbes produce zero published facts.
    model: published_facts
    given:
      - input: ref('identity_facts')
        rows:
          - fact_id: fact_in_status
            person_name: João Silva
            fact_kind: identity
            value: João Silva
            source_publisher: CVM
            source_locator: CVM FRE 2026
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '02916265'
            group_name: JBS
      - input: ref('control_edge_facts')
        rows: []
    expect:
      rows:
        - fact_id: fact_in_status
          person_id: João Silva

  # TDD Seam 5: no edge_label dono or UBO
  - name: test_control_edge_facts_no_dono_or_ubo
    description: |
      Seam 5: No edge_label dono or UBO in control edge facts.
      Fixture validates allowed edge labels only.
    model: control_edge_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: João Silva
            freeze_status: in
            cnpj_basico: '02916265'
            group_name: JBS
            role: controlador
            edge_label: acionista_controlador
            source_doc: CVM FRE 2026
            cpf_masked: null
          - person_name: Maria Santos
            freeze_status: in
            cnpj_basico: '33000167'
            group_name: Petrobras
            role: socio_chave
            edge_label: socio
            source_doc: RF QSA
            cpf_masked: null
    expect:
      rows:
        - person_name: João Silva
          fact_kind: control_edge
          edge_label: acionista_controlador
        - person_name: Maria Santos
          fact_kind: control_edge
          edge_label: socio

  # TDD Seam 6: no full CPF in fact columns/values
  - name: test_published_facts_no_full_cpf
    description: |
      Seam 6: No full CPF (11 digits) in fact columns or values.
      Fixture validates cpf_masked only.
    model: published_facts
    given:
      - input: ref('identity_facts')
        rows:
          - fact_id: fact_masked_cpf
            person_name: João Silva
            fact_kind: identity
            value: João Silva
            source_publisher: CVM
            source_locator: CVM FRE 2026
            source_retrieved_at: 2026-08-24
            cpf_masked: '***456***'
            cnpj_basico: '02916265'
            group_name: JBS
      - input: ref('control_edge_facts')
        rows: []
    expect:
      rows:
        - fact_id: fact_masked_cpf
          person_id: João Silva
          cpf_masked: '***456***'

  # TDD Seam 7: no "o bilionário" / "o bilionário X" in fact values
  - name: test_published_facts_no_bilionario_phrase
    description: |
      Seam 7: No "o bilionário" or "o bilionário X" in fact values.
    model: published_facts
    given:
      - input: ref('identity_facts')
        rows:
          - fact_id: fact_clean_value
            person_name: João Silva
            fact_kind: identity
            value: João Silva
            source_publisher: CVM
            source_locator: CVM FRE 2026
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '02916265'
            group_name: JBS
      - input: ref('control_edge_facts')
        rows:
          - fact_id: fact_control_clean
            person_name: João Silva
            fact_kind: control_edge
            value: João Silva é sócio de JBS
            source_publisher: RF
            source_locator: RF QSA
            source_retrieved_at: 2026-08-24
            cpf_masked: null
            cnpj_basico: '02916265'
            group_name: JBS
    expect:
      rows:
        - fact_id: fact_clean_value
          value: João Silva
        - fact_id: fact_control_clean
          value: João Silva é sócio de JBS

  # PM Review 1: Identity facts must be raw fields only (no "Controla {group}")
  - name: test_identity_facts_no_controla_sentence
    description: |
      PM Review: Identity facts must output raw fields only.
      No sentence "Controla {group}". value is person_name, role, or group_name as stored.
    model: identity_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: João Silva
            freeze_status: in
            cnpj_basico: '02916265'
            group_name: JBS
            role: controlador
            source_doc: CVM FRE 2026
            cpf_masked: null
    expect:
      rows:
        - person_name: João Silva
          field: name
          value: João Silva
        - person_name: João Silva
          field: role
          value: controlador
        - person_name: João Silva
          field: group_name
          value: JBS

  # PM Review 2: Control facts must follow freeze edge_label (acionista_controlador NOT "é sócio de")
  - name: test_control_edge_facts_follow_freeze_edge_label
    description: |
      PM Review: Control facts must follow freeze edge_label.
      If edge_label is acionista_controlador, do NOT write "é sócio de".
      Use freeze source_doc, not invented RF URL.
    model: control_edge_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: João Silva
            freeze_status: in
            cnpj_basico: '02916265'
            group_name: JBS
            role: controlador
            edge_label: acionista_controlador
            source_doc: CVM FRE 2026 item 6.1 CNPJ 02916265000160 ref 2026-08-24
            cpf_masked: null
          - person_name: Maria Santos
            freeze_status: in
            cnpj_basico: '33000167'
            group_name: Petrobras
            role: socio_chave
            edge_label: socio
            source_doc: RF QSA CNPJ 33000167
            cpf_masked: null
    expect:
      rows:
        - person_name: João Silva
          edge_label: acionista_controlador
          value: João Silva é acionista controlador de JBS (CNPJ 02916265)
          source_locator: CVM FRE 2026 item 6.1 CNPJ 02916265000160 ref 2026-08-24
        - person_name: Maria Santos
          edge_label: socio
          value: Maria Santos é sócio de Petrobras (CNPJ 33000167)
          source_locator: RF QSA CNPJ 33000167

  # PM Review 3: No fake locator, drop facts with null source_doc
  - name: test_facts_drop_null_source_doc
    description: |
      PM Review: No fake locator ("Freeze source document").
      Drop the fact if source_doc is null. No current_timestamp() as retrieved_at.
    model: identity_facts
    given:
      - input: ref('freeze_persons_with_forbes')
        rows:
          - person_name: João Silva
            freeze_status: in
            cnpj_basico: '02916265'
            group_name: JBS
            role: controlador
            source_doc: CVM FRE 2026
            cpf_masked: null
          - person_name: Pedro Costa
            freeze_status: in
            cnpj_basico: '33000167'
            group_name: Petrobras
            role: controlador
            source_doc: null
            cpf_masked: null
    expect:
      rows:
        - person_name: João Silva
          source_locator: CVM FRE 2026
          source_retrieved_at: null

  # Donation TDD Seam 1: unique fact_id
  - name: test_donation_facts_fact_id_unique
    description: |
      Donation Seam 1: fact_id must be unique in donation_facts.
    model: donation_facts
    given:
      - input: ref('freeze_persons_with_forbes')
