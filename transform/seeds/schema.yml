version: 2

seeds:
  - name: freeze_cnpj_basicos
    description: Freeze-chain CNPJ basicos (8-digit, zero-padded STRING) for top-50 billionaire watcher targets
    config:
      column_types:
        cnpj_basico: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ base with leading zeros preserved (STRING)
        tests:
          - not_null
          - unique

  - name: vehicle_cnpj_basicos
    description: |
      Nine issue #88 control-vehicle CNPJ básicos used for the bounded Receita
      QSA ingest. This is warehouse input, not a test fixture, and remains
      separate from the fifty `freeze_cnpj_basicos` roots.
    config:
      column_types:
        cnpj_basico: STRING
        vehicle_name: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit vehicle CNPJ básico with leading zeros preserved.
        tests:
          - not_null
          - unique
      - name: vehicle_name
        description: Human-readable vehicle name supplied by issue #88.
        tests:
          - not_null

  - name: unlisted_owned_cnpj_basicos
    description: |
      Nine issue #92 unlisted owned-company CNPJ básicos used for a bounded
      Receita QSA ingest. This warehouse input remains separate from both the
      fifty freeze roots and the nine issue #88 control vehicles.
    config:
      enabled: true
      column_types:
        cnpj_basico: STRING
        company_name: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit company CNPJ básico with leading zeros preserved.
        tests:
          - not_null
          - unique
      - name: company_name
        description: Human-readable legal name supplied by issue #92.
        tests:
          - not_null

  - name: gestora_cnpj_basicos
    description: |
      Seven issue #97 asset-manager CNPJ básicos used for the bounded Receita
      partner ingest. This is warehouse input, not a test fixture, and remains
      separate from the freeze, issue #88 vehicle, and issue #92 unlisted keys.
    config:
      enabled: true
      column_types:
        cnpj_basico: STRING
        gestora_name: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit asset-manager CNPJ básico with leading zeros preserved.
        tests:
          - not_null
          - unique
      - name: gestora_name
        description: Human-readable asset-manager name supplied by issue #97.
        tests:
          - not_null

  - name: top50_flags_seed
    description: Top-50 billionaire watcher group flags from Valor 1000 2025
    config:
      column_types:
        rank_2024: INT64
        empresa: STRING
        razao_social: STRING
        cnpj_basico: STRING
        cnpj_full: STRING
        listed_flag: STRING
        listed_source: STRING
        soe_flag: STRING
        soe_source: STRING
        controlador_tipo: STRING
        freeze_status_hint: STRING
        notes: STRING
        source_doc: STRING
        cnpj_source: STRING
        retrieved_at: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ base (STRING with leading zeros)
        tests:
          - not_null
          
  - name: forbes_billionaires_brazil_nexus
    description: |
      Forbes World's Billionaires with Brazil-operations nexus (FIXTURE/SEED ONLY, NOT LIVE FORBES DATA).
      Test data for Forbes safety-net logic. Does not contain real Forbes billionaires or actual USD wealth estimates.
      Safety-net AFTER positional freeze. Add as candidato_forbes + freeze_status=review when:
      - On Forbes World's Billionaires list
      - Brazil-operations nexus = true
      - cnpj_basico is NOT NULL (identified Brazil-operating group)
      - NOT already in positional freeze
      - Documentable control of Brazil-operating group (group MAY be outside top-50)
      Do NOT add celebrities/athletes unless they control a Brazil-operating group.
      GAP-FORBES-BR-URL: no separate Forbes Brazil methodology URL; global list + Brazil-nexus filter.
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        person_name: STRING
        forbes_year: INT64
        estimated_wealth_usd_billions: FLOAT64
        brazil_operations_nexus: BOOLEAN
        control_doc_available: BOOLEAN
        cnpj_basico: STRING
        notes: STRING
        source_doc: STRING
    columns:
      - name: person_name
        description: Natural person name from Forbes list (FIXTURE TEST DATA, not real names)
        tests:
          - not_null
      - name: forbes_year
        description: Forbes list year
        tests:
          - not_null
      - name: estimated_wealth_usd_billions
        description: Forbes estimated wealth in USD billions (FIXTURE TEST DATA, not real estimates)
      - name: brazil_operations_nexus
        description: Has Brazil-operations nexus (required=true to add; must also have cnpj_basico)
        tests:
          - not_null
      - name: control_doc_available
        description: Control document available (does NOT auto-promote to freeze_status=in even when true)
        tests:
          - not_null
      - name: cnpj_basico
        description: 8-digit CNPJ base of controlled group (STRING with leading zeros; REQUIRED to add Forbes row, may be null for excluded cases)
      - name: notes
        description: Notes about the Forbes candidate (must use Forbes formula, not "o bilionário X")
        tests:
          - not_null
      - name: source_doc
        description: Source document citation

  - name: tse_donations_2026
    description: |
      TSE 2026 campaign donations (FIXTURE/SEED ONLY, NOT LIVE TSE DATA).
      Test data for donation facts. Fake CPFs (masked), not João Silva page people.
      One row per donor×candidate×cycle receipt (match HTML fixture table grain).
      PJ donations banned since 2016; 2026 donations are PF only.
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        ano: INT64
        cpf_candidato: STRING
        nome_candidato: STRING
        cpf_cnpj_doador: STRING
        nome_doador: STRING
        valor_receita: FLOAT64
        tipo_receita: STRING
        fonte_receita: STRING
        numero_recibo_eleitoral: STRING
        cpf_doador_masked: STRING
    columns:
      - name: ano
        description: Election year (2026)
        tests:
          - not_null
      - name: cpf_candidato
        description: Candidate CPF (masked, NOT FOR PUBLIC FACTS - use nome_candidato)
        tests:
          - not_null
      - name: nome_candidato
        description: Candidate name (public field for facts)
        tests:
          - not_null
      - name: cpf_cnpj_doador
        description: Donor CPF or CNPJ (masked)
      - name: nome_doador
        description: Donor name
        tests:
          - not_null
      - name: valor_receita
        description: Receipt amount
        tests:
          - not_null
      - name: numero_recibo_eleitoral
        description: Electoral receipt number (unique identifier per receipt)
        tests:
          - not_null
          - unique
      - name: cpf_doador_masked
        description: Donor masked CPF (no full CPF)

  - name: energisa_companies_fixture
    description: |
      Energisa control graph companies fixture (FIXTURE/SEED ONLY, NOT LIVE CVM OR RECEITA).
      Test data for control graph node/edge transform. Includes Energisa, Gipar, holdings, fund, minorities, outros.
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        cnpj_basico: STRING
        node_kind: STRING
        name: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ básico (STRING with leading zeros)
        tests:
          - not_null
          - unique
      - name: node_kind
        description: Node type (company, fund, or outros)
        tests:
          - not_null
      - name: name
        description: Company, fund, or outros acionistas name
        tests:
          - not_null

  - name: energisa_persons_fixture
    description: |
      Energisa control graph persons fixture (FIXTURE/SEED ONLY, fake person names).
      Test data for control graph node/edge transform. Includes persons with CPF, without CPF, and homonyms.
      node_id is the resolved key (CPF when present, else provisional_name_key).
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        node_id: STRING
        node_kind: STRING
        name: STRING
        cpf: STRING
        provisional_name_key: STRING
    columns:
      - name: node_id
        description: Person node ID (CPF when present, else provisional_name_key)
        tests:
          - not_null
          - unique
      - name: node_kind
        description: Node type (person)
        tests:
          - not_null
      - name: name
        description: Person name (fake names for testing)
        tests:
          - not_null
      - name: cpf
        description: Person CPF (11 digits, warehouse only) when present
      - name: provisional_name_key
        description: Provisional name key for persons without CPF

  - name: energisa_edges_fixture
    description: |
      Energisa control graph edges fixture (FIXTURE/SEED ONLY, participacao edges).
      Test data for control graph transform. Includes edges with/without percents, cycle, fund edges with roles.
      from_id and to_id use resolved node_ids (CPF or provisional_name_key for persons, cnpj_basico for companies).
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        from_id: STRING
        to_id: STRING
        edge_kind: STRING
        edge_role: STRING
        pct_capital: FLOAT64
        pct_votos: FLOAT64
        qty_ordinarias: INT64
        qty_preferenciais: INT64
        source_doc: STRING
        source_locator: STRING
        source_retrieved_at: STRING
    columns:
      - name: from_id
        description: Source node (resolved node_id)
        tests:
          - not_null
      - name: to_id
        description: Target node (resolved node_id)
        tests:
          - not_null
      - name: edge_kind
        description: Edge type (participacao)
        tests:
          - not_null
      - name: edge_role
        description: Edge role (gestora, administrador, or null for regular participacao)
      - name: pct_capital
        description: Total capital percentage (nullable)
      - name: pct_votos
        description: Voting percentage (nullable)
      - name: qty_ordinarias
        description: Quantity of ordinary shares (nullable)
      - name: qty_preferenciais
        description: Quantity of preferred shares (nullable)
      - name: source_doc
        description: Source document citation
        tests:
          - not_null
      - name: source_locator
        description: Source document locator
      - name: source_retrieved_at
        description: Source retrieval date

  - name: b3_listed_prices
    description: |
      Warehouse-enabled, dated closes for the verified Bolsa classes used by /grafo.
      Values are unadjusted PREULT (official closing price) records for the common
      trading date 2025-05-16 in B3's annual historical quotation archive:
      https://bvmf.bmfbovespa.com.br/InstDados/SerHist/COTAHIST_A2025.ZIP
      The fixed-width record layout is published by B3 at:
      https://www.b3.com.br/data/files/C8/F3/08/B4/297BE410F816C9E492D828A8/SeriesHistoricas_Layout.pdf
      Extraction used record type 01, round-lot market 010, and PREULT positions
      109-121 divided by 100. The date had trades in every included ticker.
      New business dates append rows at the ticker/class/date grain.

      ENGI11 is retained honestly as a unit; graph_listed_prices does not value it
      because graph_edges currently supplies only ordinary/preferred quantities.
      Claro Telecom Participações (07043628) is intentionally absent because it
      has no listed Brasil Bolsa Balcão share class.
    config:
      enabled: true
      column_types:
        cnpj_basico: STRING
        ticker: STRING
        classe: STRING
        preco: "{{ 'DOUBLE' if target.type == 'duckdb' else 'FLOAT64' }}"
        preco_date: STRING
        source: STRING
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cnpj_basico
              - ticker
              - classe
              - preco_date
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ básico (STRING with leading zeros)
        tests:
          - not_null
      - name: ticker
        description: Verified B3 trading code
        tests:
          - not_null
      - name: classe
        description: Share class (ordinaria, preferencial, or unit)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ordinaria', 'preferencial', 'unit']
      - name: preco
        description: Unadjusted official B3 closing price (PREULT), in BRL
        tests:
          - not_null
      - name: preco_date
        description: B3 trading date (YYYY-MM-DD)
        tests:
          - not_null
      - name: source
        description: Exact quote source label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Brasil Bolsa Balcão']

  - name: listed_prices_fixture
    description: |
      Listed stock price fixture (FIXTURE/SEED ONLY, NOT LIVE BOLSA).
      Covers the verified listed roots published on /grafo plus WEG and Ambev;
      Claro is absent because it has no listed Bolsa class.
      Quotes and symbols are deterministic test data; quantity still comes exclusively
      from graph_edges listed hops. WEG and Ambev therefore remain absent until a hop
      supplies a quantity. Energisa has two business dates to test append behavior.
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        cnpj_basico: STRING
        ticker: STRING
        classe: STRING
        preco: "{{ 'DOUBLE' if target.type == 'duckdb' else 'FLOAT64' }}"
        preco_date: STRING
        source: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ básico (STRING with leading zeros)
        tests:
          - not_null
      - name: ticker
        description: Real stock ticker symbol used with deterministic test prices
        tests:
          - not_null
      - name: classe
        description: Share class (ordinaria or preferencial)
        tests:
          - not_null
      - name: preco
        description: Stock price (fixture price, not live)
        tests:
          - not_null
      - name: preco_date
        description: Price date (YYYY-MM-DD)
        tests:
          - not_null
      - name: source
        description: Recorded or deterministic fixture quote source
        tests:
          - not_null

  - name: qsa_companies_fixture
    description: |
      QSA (Receita Federal Quadro Societário) companies fixture (FIXTURE/SEED ONLY, NOT LIVE RECEITA).
      Test data for QSA-based graph recursion. Includes state companies (BNDESPAR, União), named minorities (Squadra, Opportunity), unlisted holdings.
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        cnpj_basico: STRING
        node_kind: STRING
        name: STRING
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ básico (STRING with leading zeros) or state identifier
        tests:
          - not_null
          - unique
      - name: node_kind
        description: Node type (company or state)
        tests:
          - not_null
      - name: name
        description: Company or state entity name
        tests:
          - not_null

  - name: qsa_persons_fixture
    description: |
      QSA persons fixture (FIXTURE/SEED ONLY, fake person names).
      Test data for QSA-based graph recursion. Includes sócios (partners) with/without CPF.
      node_id is the resolved key (CPF when present, else provisional_name_key).
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        node_id: STRING
        node_kind: STRING
        name: STRING
        cpf: STRING
        provisional_name_key: STRING
    columns:
      - name: node_id
        description: Person node ID (CPF when present, else provisional_name_key)
        tests:
          - not_null
          - unique
      - name: node_kind
        description: Node type (person)
        tests:
          - not_null
      - name: name
        description: Person name (fake names for testing)
        tests:
          - not_null
      - name: cpf
        description: Person CPF (11 digits, warehouse only) when present
      - name: provisional_name_key
        description: Provisional name key for persons without CPF

  - name: qsa_edges_fixture
    description: |
      QSA edges fixture (FIXTURE/SEED ONLY, sócio/participacao edges from Receita Federal QSA).
      Test data for QSA-based graph recursion. Includes company-person and company-company edges from QSA data.
      QSA sócio edges use edge_role='socio' (never 'dono' or 'UBO').
      from_id and to_id use resolved node_ids.
      
      PRODUCTION EXCLUSION: This seed is disabled on the warehouse target (dev) and prod.
      Only test/ci targets may seed this fixture. Do NOT seed into billionairewatcher warehouse.
    config:
      enabled: "{{ target.name in ['test', 'ci'] }}"
      column_types:
        from_id: STRING
        to_id: STRING
        edge_kind: STRING
        edge_role: STRING
        pct_capital: FLOAT64
        pct_votos: FLOAT64
        qty_ordinarias: INT64
        qty_preferenciais: INT64
        source_doc: STRING
        source_locator: STRING
        source_retrieved_at: STRING
    columns:
      - name: from_id
        description: Source node (resolved node_id)
        tests:
          - not_null
      - name: to_id
        description: Target node (resolved node_id)
        tests:
          - not_null
      - name: edge_kind
        description: Edge type (participacao)
        tests:
          - not_null
      - name: edge_role
        description: Edge role (socio for QSA partners, or null for participacao; never dono/UBO)
      - name: pct_capital
        description: Total capital percentage (nullable)
      - name: pct_votos
        description: Voting percentage (nullable)
      - name: qty_ordinarias
        description: Quantity of ordinary shares (nullable)
      - name: qty_preferenciais
        description: Quantity of preferred shares (nullable)
      - name: source_doc
        description: Source document citation (QSA fixture)
        tests:
          - not_null
      - name: source_locator
        description: Source document locator
      - name: source_retrieved_at
        description: Source retrieval date
