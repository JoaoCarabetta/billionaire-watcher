version: 2

models:
  - name: graph_nodes
    description: |
      Control graph nodes: companies, persons, funds, state entities, outros.
      Company key = CNPJ básico (8-digit STRING lpad).
      Person key = CPF (11 digits) when present; otherwise provisional_name_key.
      Two identical names without CPF stay two nodes (no homonym merge).
      CPF masked as ***NNN*** (stars + last-3 + stars) derived from warehouse cpf.
    columns:
      - name: node_id
        description: Unique node identifier (cnpj_basico for companies, cpf or provisional_name_key for persons)
        tests:
          - not_null
          - unique
      - name: node_kind
        description: Node type (person, company, fund, state, outros)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['person', 'company', 'fund', 'state', 'outros']
      - name: name
        description: Node name
        tests:
          - not_null
      - name: cpf
        description: Person CPF (11 digits, warehouse only) when present
      - name: cpf_masked
        description: Published masked CPF (***NNN*** format with trailing stars, no full CPF)
      - name: provisional_name_key
        description: Provisional name key for persons without CPF
      - name: cnpj_basico
        description: Company CNPJ básico (8-digit STRING lpad) when node is company, fund, or outros

  - name: graph_edges
    description: |
      Control graph edges: participacao relationships.
      Missing percent is NULL, not zero.
      Hop without percent keeps the edge (both percents null on that path).
      edge_role labels fund relationships (gestora, administrador).
    columns:
      - name: from_id
        description: Source node ID (resolved node_id)
        tests:
          - not_null
      - name: to_id
        description: Target node ID (resolved node_id)
        tests:
          - not_null
      - name: edge_kind
        description: Edge type (participacao)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['participacao']
      - name: edge_role
        description: Edge role (gestora, administrador, or null for regular participacao)
      - name: pct_capital
        description: Total capital percentage (nullable; null means missing, not zero)
      - name: pct_votos
        description: Voting percentage (nullable; null means missing, not zero)
      - name: qty_ordinarias
        description: Quantity of ordinary shares (nullable)
      - name: qty_preferenciais
        description: Quantity of preferred shares (nullable)
      - name: source_doc
        description: Source document citation
        tests:
          - not_null
      - name: source_locator
        description: Source document locator
      - name: source_retrieved_at
        description: Source retrieval date

  - name: graph_cycles
    description: |
      Cycles detected in the control graph.
      A cycle occurs when a CNPJ básico repeats in a path (real rings, not only self-loops).
      Walk stops at cycle; edges of the ring are kept.
    columns:
      - name: cycle_start
        description: Node ID where cycle starts
        tests:
          - not_null
      - name: cycle_path
        description: Ordered list of CNPJ básico that formed the ring

  - name: graph_person_holdings
    description: |
      Derived person holdings: pct_economica_pessoa and pct_votos_pessoa.
      Computed only on complete paths (product of capital % and product of voting %).
      Incomplete path (any hop has null percent) → null person percents.
      Disjoint complete paths are summed by person × company.
    columns:
      - name: person_node_id
        description: Person node ID
        tests:
          - not_null
      - name: person_name
        description: Person name
        tests:
          - not_null
      - name: cpf_masked
        description: Published masked CPF (***NNN*** format only)
      - name: company_node_id
        description: Company node ID
        tests:
          - not_null
      - name: company_name
        description: Company name
        tests:
          - not_null
      - name: pct_economica_pessoa
        description: Economic share percentage (sum of complete path products, null if all paths incomplete)
      - name: pct_votos_pessoa
        description: Voting power percentage (sum of complete path products, null if all paths incomplete)
      - name: min_path_length
        description: Minimum number of hops across all paths
        tests:
          - not_null
      - name: max_path_length
        description: Maximum number of hops across all paths
        tests:
          - not_null
      - name: path_count
        description: Total number of paths from person to company
        tests:
          - not_null

  - name: graph_listed_prices
    description: |
      Dated listed price facts: ticker, class, price, quantity, product, date, source.
      Business-day run appends a new row (does not overwrite yesterday).
      Quantity comes from the listed hop (IR/FRE table) in graph_edges.
      Product is quantity × price (Brasil Bolsa Balcão).
      Unlisted companies: no price row.
      Product is not copied to person node if any hop has null percent (see graph_person_holdings).
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ básico (STRING with leading zeros)
        tests:
          - not_null
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
      - name: classe
        description: Share class (ordinaria or preferencial)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ordinaria', 'preferencial']
      - name: preco
        description: Stock price from Brasil Bolsa Balcão
        tests:
          - not_null
      - name: quantidade
        description: Share quantity from listed hop (IR/FRE table)
        tests:
          - not_null
      - name: produto
        description: Product of quantity × price
        tests:
          - not_null
      - name: preco_date
        description: Price date (business day)
        tests:
          - not_null
      - name: source
        description: Combined source (Brasil Bolsa Balcão + IR/FRE table that gave quantity)
        tests:
          - not_null

  - name: graph_listed_quantities
    description: |
      Formulário share quantity at seed × class grain for priced listed seeds (issue #129).
      Warehouse sidecar the public graph / Coder can read. Not the money-script FRE 17.1 CSV.
      Quantity comes only from graph_edges listed-hop columns (qty_ordinarias / qty_preferenciais).
      Identical company totals copied onto more than one holder hop collapse to one row.
      A seed with no hop quantity is omitted, not zero. Unit classes are never emitted.
      Claro Telecom Participações (07043628) has no Bolsa class, so it never appears.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - cnpj_basico
              - classe
    columns:
      - name: cnpj_basico
        description: 8-digit CNPJ básico (STRING with leading zeros)
        tests:
          - not_null
      - name: ticker
        description: Priced Bolsa ticker for this seed × class (ENGI3 / ENGI4, never ENGI11)
        tests:
          - not_null
      - name: classe
        description: Share class (ordinaria or preferencial). Unit is never emitted.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ordinaria', 'preferencial']
      - name: quantidade
        description: Company-level outstanding share quantity from the listed hop (IR/FRE table)
        tests:
          - not_null
      - name: source_doc
        description: Formulário / IR document that cited the quantity
        tests:
          - not_null
      - name: source_locator
        description: Locator inside that document (for example table 6.1)
      - name: source_retrieved_at
        description: Source retrieval date from the listed hop
