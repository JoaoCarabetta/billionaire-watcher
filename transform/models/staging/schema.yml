version: 2

models:
  - name: stg_cvm_fre_posicao_acionaria_2026
    description: |
      CVM FRE shareholder position 2026.
      Source: GCS gs://billionairewatcher-landing/raw/cvm/fre/2026/fre_cia_aberta_posicao_acionaria_2026.csv
      
      CNPJ_Companhia is 14-digit STRING (full CNPJ of listed issuer), not 8-digit.
      CPF_CNPJ fields may contain masked CPFs. DO NOT expand masked CPFs for HTML output.
    columns:
      - name: CNPJ_Companhia
        description: 14-digit full CNPJ of listed company (STRING with leading zeros)
        tests:
          - not_null
      - name: Data_Referencia
        description: Reference date for this shareholder position
        tests:
          - not_null
      - name: ID_Acionista
        description: Shareholder ID
        tests:
          - not_null
      - name: CPF_CNPJ_Acionista
        description: |
          CPF or CNPJ of shareholder (may be masked).
          DO NOT expand masked CPFs. No full CPF on any field intended for HTML.
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - CNPJ_Companhia
              - Data_Referencia
              - ID_Acionista

  - name: stg_cvm_fre_capital_social_2026
    description: |
      CVM FRE item 17.1 capital social 2026.
      Source: GCS gs://billionairewatcher-landing/raw/cvm/fre/2026/fre_cia_aberta_capital_social_2026.csv

      CNPJ_Companhia is 14-digit STRING (full CNPJ of listed issuer), not 8-digit.
      Tipo_Capital is Autorizado / Emitido / Subscrito / Integralizado. Downstream
      must pick one view (prefer Integralizado, else Emitido) and must not sum tipos.
    columns:
      - name: CNPJ_Companhia
        description: 14-digit full CNPJ of listed company (STRING with leading zeros)
        tests:
          - not_null
      - name: Data_Referencia
        description: Reference date for this capital social row
        tests:
          - not_null
      - name: ID_Documento
        description: CVM FRE document id
        tests:
          - not_null
      - name: ID_Capital_Social
        description: Capital social record id inside the document
        tests:
          - not_null
      - name: Tipo_Capital
        description: Capital view (Autorizado, Emitido, Subscrito, Integralizado)
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: error
          arguments:
            combination_of_columns:
              - CNPJ_Companhia
              - ID_Documento
              - Tipo_Capital
              - ID_Capital_Social

  - name: stg_cvm_cad_cia_aberta
    description: |
      CVM registered listed companies (cadastro).
      Source: GCS gs://billionairewatcher-landing/raw/cvm/fre/2026/cad_cia_aberta.csv
      
      CNPJ_CIA is 14-digit STRING (full CNPJ of listed issuer), not 8-digit.
    columns:
      - name: CNPJ_CIA
        description: 14-digit full CNPJ of listed company (STRING with leading zeros)
        tests:
          - not_null
          - unique
      - name: CD_CVM
        description: CVM registration code
        tests:
          - not_null
          - unique
      - name: DENOM_SOCIAL
        description: Legal name (denominação social)
        tests:
          - not_null
      - name: SIT
        description: Registration status (ATIVO, CANCELADA)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ATIVO', 'CANCELADA']

  - name: stg_bolsa_cotahist_piso
    description: |
      Market capitalization at one row per 14-digit issuer CNPJ. Share counts
      come from B3 GetListedSupplementCompany. Tickers are mapped by CVM FCA
      Codigo_Negociacao, and prices are each ticker's latest official PREULT
      from COTAHIST_A2026 with TPMERC=010 and CODBDI=02. This model never uses
      basedosdados.br_b3_cotacoes.cotacoes, which is a trade tape rather than
      COTAHIST bars. When an issuer has several tickers for the same broad
      common/preferred class, its most-traded ticker on the latest available
      date supplies the representative close for B3's class-level quantity.
    columns:
      - name: cnpj
        description: Full 14-digit listed-company CNPJ.
        tests:
          - not_null
          - unique
      - name: valor_do_piso
        description: Sum of common and preferred share quantities times their selected closes.
        tests:
          - not_null

  - name: stg_ifdata_ativo_total_piso
    description: |
      IF.data Ativo Total at one row per full bank-headquarters CNPJ. The model
      exclusively uses TipoInstituicao=1, the prudential-conglomerate and
      independent-institution grain, Relatorio=2, Conta=140220, and Saldo.
      IfDataCadastro maps the prudential reporter to CnpjInstituicaoLider;
      codigoCNPJ8 then joins to the BCB seed registry. Individual and financial
      conglomerate rows are never mixed in.
    columns:
      - name: cnpj
        description: Full 14-digit BCB headquarters CNPJ.
        tests:
          - not_null
          - unique
      - name: valor_do_piso
        description: Prudential Ativo Total in Brazilian reais.
        tests:
          - not_null

  - name: stg_susep_premios_emitidos_piso
    description: |
      Annual-to-date emitted insurance premiums at one row per 14-digit CNPJ,
      summed from ReceitasSeguros.valor across month, group, and ramo. It does
      not use premio_ganho from the SES dataset.
    columns:
      - name: cnpj
        description: Full 14-digit insurer CNPJ.
        tests:
          - not_null
          - unique
      - name: valor_do_piso
        description: Sum of ReceitasSeguros.valor in Brazilian reais.
        tests:
          - not_null
