version: 2

models:
  - name: unlisted_qsa_partners
    description: |
      Receita Federal QSA partners of the nine issue #92 unlisted owned companies.
      Reads `source('br_me_cnpj', 'socios')` only at `rf_partition_date`.
      The grain is one source partner row; companies with no source rows receive
      one explicit sentinel with `partner_count=0` and the exact `source_query`.
      `documento` remains warehouse-only and `percent` is always null because
      this Receita source has no ownership-percentage column.
    columns:
      - name: cnpj_basico
        description: Configured company CNPJ básico, normalized to an 8-digit STRING.
        tests:
          - not_null
      - name: tipo
        description: Partner type exactly as Base dos Dados emits it; null only on an explicit empty row.
      - name: nome
        description: Partner name exactly as Base dos Dados emits it; null only on an explicit empty row.
      - name: documento
        description: Base dos Dados partner document, masked for PF and kept warehouse-only.
      - name: qualificacao
        description: Receita partner qualification code.
      - name: data_entrada_sociedade
        description: Date the partner entered the company.
      - name: percent
        description: Always null; the source has no ownership-percentage field.
      - name: partner_count
        description: Source-row count for the company; zero marks an explicit empty result.
        tests:
          - not_null
      - name: source_query
        description: Reproducible partition-bounded source query for this company.
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          name: unlisted_qsa_partners_never_invents_percent
          config:
            severity: error
          arguments:
            expression: "percent is null"
      - dbt_utils.expression_is_true:
          name: unlisted_qsa_partners_empty_row_has_null_details
          config:
            severity: error
          arguments:
            expression: "partner_count > 0 or (tipo is null and nome is null and documento is null)"

  - name: unlisted_qsa_companies_owned
    description: |
      One-hop companies whose Receita QSA names one of the nine issue #92
      companies as a PJ partner. Reads `socios` and `empresas` only at
      `rf_partition_date`. Owner matching strips non-digits, pads to 14 digits,
      and compares only the first eight digits; containment matching is forbidden.
      Owners with no edge receive one explicit sentinel with
      `owned_company_count=0` and the exact `source_query`. `documento` remains
      warehouse-only and `percent` is always null.
    columns:
      - name: owner_cnpj_basico
        description: Configured owner CNPJ básico, normalized to an 8-digit STRING.
        tests:
          - not_null
      - name: owned_cnpj_basico
        description: Owned company CNPJ básico, normalized to an 8-digit STRING; null on an empty row.
      - name: owned_name
        description: Owned company legal name from the same `empresas` partition.
      - name: qualificacao
        description: Receita qualification code for the owner's PJ partner row.
      - name: documento
        description: Full PJ CNPJ exactly as Base dos Dados emits it; warehouse-only.
      - name: percent
        description: Always null; the source has no ownership-percentage field.
      - name: owned_company_count
        description: Matching one-hop edge count for the owner; zero marks an explicit empty result.
        tests:
          - not_null
      - name: source_query
        description: Reproducible partition-bounded prefix-8 source query for this owner.
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          name: unlisted_qsa_companies_owned_never_invents_percent
          config:
            severity: error
          arguments:
            expression: "percent is null"
      - dbt_utils.expression_is_true:
          name: unlisted_qsa_companies_owned_empty_row_has_null_details
          config:
            severity: error
          arguments:
            expression: "owned_company_count > 0 or (owned_cnpj_basico is null and owned_name is null and documento is null)"
