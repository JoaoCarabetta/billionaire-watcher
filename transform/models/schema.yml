version: 2

models:
  - name: empresas
    description: |
      Fase 1 company door at one row per company. Contains the resolvable Valor
      inventory (seed A) union active CVM companies, selected BCB headquarters,
      and selected SUSEP companies (seed B), plus intermediate companies cited
      while walking ownership upward. Size floors are implemented separately.
    columns:
      - name: empresa_id
        description: Full 14-digit CNPJ, or nome plus normalized name for the five no-walk exceptions.
        tests:
          - not_null
          - unique
      - name: cnpj
        description: Nullable full 14-digit CNPJ stored as a string with leading zeros.
      - name: razao_social
        description: Company name from seed A when present, otherwise CVM, BCB, then SUSEP.
        tests:
          - not_null
      - name: em_semente_a
        description: Whether the company has a resolvable row in the Valor control inventory.
        tests:
          - not_null
      - name: fontes_semente_b
        description: Sorted subset of cvm, bcb, and susep whose filters admitted the company.
        tests:
          - not_null
      - name: motivo_entrada
        description: Entry reason; semente for A union B and subida for an intermediate owner.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['semente', 'subida']
      - name: nao_caminha
        description: True only for Folha, Globo, Havan, Record, and Natura without CNPJ.
        tests:
          - not_null
      - name: valor_do_piso
        description: Size-floor value; null until issue 180.
      - name: fonte_do_piso
        description: Size-floor source; null until issue 180.
      - name: tem_piso
        description: False until issue 180 adds size-floor coverage.
        tests:
          - not_null

  - name: int_walk_roots
    description: Seed-company IDs permitted to start an upward ownership walk.
    columns:
      - name: root_empresa_id
        description: Walkable seed empresa_id.
        tests:
          - not_null
          - unique

  - name: pessoas
    description: |
      Natural people reached by walking upward from seed companies. CPF-backed
      identities use a one-way hash key; citations without CPF are scoped to
      the cited company so unsupported homonym merges cannot occur.
    columns:
      - name: pessoa_id
        description: Stable CPF hash when CPF exists, otherwise a provisional name-and-company key.
        tests:
          - not_null
          - unique
      - name: nome
        description: Person name as cited by FRE or Receita QSA.
        tests:
          - not_null
      - name: cpf
        description: Full CPF when supplied by the warehouse source; warehouse-only and never public HTML.
      - name: filiacao
        description: Reserved warehouse-only identity-matching evidence.
      - name: data_nascimento
        description: Reserved warehouse-only identity-matching evidence.
      - name: e_oligarca
        description: |
          True only for a FRE citation on a seed company with controller S or
          at least 10 percent of circulating ordinary shares.
        tests:
          - not_null
      - name: fortuna_valor
        description: Fortune estimate; null until issue 182.
      - name: fortuna_incompleta
        description: Whether cited paths remain unvalued or lack percentages.
        tests:
          - not_null

  - name: pessoas_empresas
    description: |
      One cited person-company relationship per person, company, source, and
      reference date. Receita rows are always socio and carry no inferred
      control or percentages.
    columns:
      - name: pessoa_id
        description: Foreign key to pessoas.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pessoas')
                field: pessoa_id
      - name: empresa_id
        description: Cited company, whether seed or subida.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('empresas')
                field: empresa_id
      - name: papel
        description: acionista_controlador, acionista, or socio.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['acionista_controlador', 'acionista', 'socio']
      - name: fonte
        description: fre for CVM shareholder position or qsa for Receita QSA.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fre', 'qsa']
      - name: acionista_controlador
        description: FRE controller flag; null for QSA.
      - name: participante_acordo_acionistas
        description: FRE shareholders-agreement flag; null for QSA.
      - name: percentual_on
        description: FRE percentage of circulating ordinary shares; null for QSA.
      - name: percentual_total
        description: FRE percentage of all circulating shares; null for QSA.
      - name: qualificacao
        description: Receita partner qualification; null for FRE.
      - name: data_referencia
        description: FRE reference date or Receita partition date.
        tests:
          - not_null
      - name: fonte_documento
        description: Exact source citation including FRE document ID or QSA partition/company key.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pessoa_id
              - empresa_id
              - fonte
              - data_referencia
