version: 2

models:
  - name: empresas
    description: |
      Fase 1 company door at one row per company. Contains the resolvable Valor
      inventory (seed A) union active CVM companies, selected BCB headquarters,
      and selected SUSEP companies (seed B), plus intermediate companies cited
      while walking ownership upward and one CPF-only downward hop from
      oligarchs. Size floors are optional metadata: companies without a floor
      stay in the model and keep walking.
    columns:
      - name: empresa_id
        description: Full 14-digit CNPJ, or nome plus normalized name for the five no-walk exceptions.
        tests:
          - not_null
          - unique
      - name: cnpj
        description: Nullable full 14-digit CNPJ stored as a string with leading zeros.
      - name: razao_social
        description: Company name from seed A when present, otherwise CVM, BCB, then SUSEP.
        tests:
          - not_null
      - name: em_semente_a
        description: Whether the company has a resolvable row in the Valor control inventory.
        tests:
          - not_null
      - name: fontes_semente_b
        description: Sorted subset of cvm, bcb, and susep whose filters admitted the company.
        tests:
          - not_null
      - name: motivo_entrada
        description: Entry reason; semente for A union B, subida for an intermediate owner, or hop for a one-hop downward match.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['semente', 'subida', 'hop']
      - name: nao_caminha
        description: True only for Folha, Globo, Havan, Record, and Natura without CNPJ.
        tests:
          - not_null
      - name: valor_do_piso
        description: |
          Optional BRL size floor: listed market value, prudential banking
          assets, or annual-to-date emitted insurance premiums.
      - name: fonte_do_piso
        description: Exact source label for valor_do_piso; null when uncovered.
        tests:
          - accepted_values:
              arguments:
                values:
                  - bolsa_cotahist
                  - ifdata_ativo_total
                  - susep_premios_emitidos
      - name: tem_piso
        description: True only when valor_do_piso and fonte_do_piso are present.
        tests:
          - not_null

  - name: int_walk_roots
    description: Seed-company IDs permitted to start an upward ownership walk.
    columns:
      - name: root_empresa_id
        description: Walkable seed empresa_id.
        tests:
          - not_null
          - unique

  - name: pessoas
    description: |
      Natural people reached by walking upward from seed companies. CPF-backed
      identities use a one-way hash key; citations without CPF are scoped to
      the cited company so unsupported homonym merges cannot occur. Direct
      natural-person partners of one-hop companies are also included.
    columns:
      - name: pessoa_id
        description: Stable CPF hash when CPF exists, otherwise a provisional name-and-company key.
        tests:
          - not_null
          - unique
      - name: nome
        description: Person name as cited by FRE or Receita QSA.
        tests:
          - not_null
      - name: cpf
        description: Full CPF when supplied by the warehouse source; warehouse-only and never public HTML.
      - name: filiacao
        description: Reserved warehouse-only identity-matching evidence.
      - name: data_nascimento
        description: Reserved warehouse-only identity-matching evidence.
      - name: e_oligarca
        description: |
          True only for a FRE citation on a seed company with controller S or
          at least 10 percent of circulating ordinary shares. Hop-company
          citations never change this flag.
        tests:
          - not_null
      - name: fortuna_valor
        description: |
          Sum of each leaf-company floor times the product of cited total-share
          percentages along that person's complete ownership paths. Paths with
          a missing percentage or missing leaf floor do not contribute.
      - name: fortuna_incompleta
        description: |
          True when at least one cited ownership path for the person has a
          missing total-share percentage or its leaf company has no floor.
        tests:
          - not_null

  - name: vinculos
    description: |
      Written ownership-edge table. Each row points from a cited person or
      company to the company it owns, at one row per origin, destination,
      source, and reference date. Includes company edges traversed by the
      upward walk and direct person citations on one-hop companies.
    columns:
      - name: origem_tipo
        description: Whether the cited owner is a pessoa or empresa.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pessoa', 'empresa']
      - name: origem_pessoa_id
        description: Person owner ID; set only when origem_tipo is pessoa.
        tests:
          - relationships:
              arguments:
                to: ref('pessoas')
                field: pessoa_id
      - name: origem_empresa_id
        description: Company owner ID; set only when origem_tipo is empresa.
        tests:
          - relationships:
              arguments:
                to: ref('empresas')
                field: empresa_id
      - name: destino_empresa_id
        description: Owned company, whether seed, subida, or hop.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('empresas')
                field: empresa_id
      - name: papel
        description: acionista_controlador, acionista, or socio.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['acionista_controlador', 'acionista', 'socio']
      - name: fonte
        description: fre for CVM shareholder position or qsa for Receita QSA.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fre', 'qsa']
      - name: acionista_controlador
        description: FRE controller flag; null for QSA.
      - name: participante_acordo_acionistas
        description: FRE shareholders-agreement flag; null for QSA.
      - name: percentual_on
        description: FRE percentage of circulating ordinary shares; null for QSA.
      - name: percentual_total
        description: FRE percentage of all circulating shares; null for QSA.
      - name: qualificacao
        description: Receita partner qualification; null for FRE.
      - name: data_referencia
        description: FRE reference date or Receita partition date.
        tests:
          - not_null
      - name: fonte_documento
        description: Exact source citation including FRE document ID or QSA partition/company key.
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (
                origem_tipo = 'pessoa'
                and origem_pessoa_id is not null
                and origem_empresa_id is null
              ) or (
                origem_tipo = 'empresa'
                and origem_pessoa_id is null
                and origem_empresa_id is not null
              )
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - origem_tipo
              - origem_pessoa_id
              - origem_empresa_id
              - destino_empresa_id
              - fonte
              - data_referencia

  - name: pessoas_empresas
    description: |
      Compatibility view of person-origin rows from vinculos, exposing the
      original person-company columns. Receita rows are always socio and carry
      no inferred control or percentages.
    columns:
      - name: pessoa_id
        description: Foreign key to pessoas.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('pessoas')
                field: pessoa_id
      - name: empresa_id
        description: Cited company, whether seed, subida, or hop.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('empresas')
                field: empresa_id
      - name: papel
        description: acionista_controlador, acionista, or socio.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['acionista_controlador', 'acionista', 'socio']
      - name: fonte
        description: fre for CVM shareholder position or qsa for Receita QSA.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fre', 'qsa']
      - name: acionista_controlador
        description: FRE controller flag; null for QSA.
      - name: participante_acordo_acionistas
        description: FRE shareholders-agreement flag; null for QSA.
      - name: percentual_on
        description: FRE percentage of circulating ordinary shares; null for QSA.
      - name: percentual_total
        description: FRE percentage of all circulating shares; null for QSA.
      - name: qualificacao
        description: Receita partner qualification; null for FRE.
      - name: data_referencia
        description: FRE reference date or Receita partition date.
        tests:
          - not_null
      - name: fonte_documento
        description: Exact source citation including FRE document ID or QSA partition/company key.
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - pessoa_id
              - empresa_id
              - fonte
              - data_referencia

  - name: int_empresas_piso
    description: |
      Optional company size floors at one row per 14-digit CNPJ. When a CNPJ
      appears in more than one family, source precedence is Bolsa, IF.data,
      then SUSEP. The model never emits rows for uncovered companies; empresas
      left-joins it so missing floors do not become a door.
    columns:
      - name: empresa_id
        description: Full 14-digit CNPJ, equal to cnpj.
        tests:
          - not_null
          - unique
      - name: cnpj
        description: Full 14-digit CNPJ.
        tests:
          - not_null
          - unique
      - name: valor_do_piso
        description: Floor value in Brazilian reais.
        tests:
          - not_null
      - name: fonte_do_piso
        description: Exact floor source label selected by family precedence.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bolsa_cotahist
                  - ifdata_ativo_total
                  - susep_premios_emitidos
      - name: tem_piso
        description: Always true for rows emitted by this covered-only model.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
                quote: false
