version: 2

models:
  - name: gestora_qsa_partners
    description: |
      Receita Federal QSA partners of the seven issue #97 asset managers already
      represented on `/grafo`. Reads `source('br_me_cnpj', 'socios')` only at
      `rf_partition_date`. The grain is one source partner row; a gestora with no
      source rows receives one explicit sentinel with `partner_count=0` and the
      exact `source_query`. `documento` remains warehouse-only and `percent` is
      always null because this Receita source has no ownership-percentage column.
    columns:
      - name: cnpj_basico
        description: Configured gestora CNPJ básico, normalized to an 8-digit STRING.
        tests:
          - not_null
      - name: tipo
        description: Partner type exactly as Base dos Dados emits it; null only on an explicit empty row.
      - name: nome
        description: Partner name exactly as Base dos Dados emits it; null only on an explicit empty row.
      - name: documento
        description: Base dos Dados partner document, masked for PF and kept warehouse-only.
      - name: qualificacao
        description: Receita partner qualification code.
      - name: data_entrada_sociedade
        description: Date the partner entered the gestora.
      - name: percent
        description: Always null; the source has no ownership-percentage field.
      - name: partner_count
        description: Source-row count for the gestora; zero marks an explicit empty result.
        tests:
          - not_null
      - name: source_query
        description: Reproducible partition-bounded source query for this gestora.
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          name: gestora_qsa_partners_never_invents_percent
          config:
            severity: error
          arguments:
            expression: "percent is null"
      - dbt_utils.expression_is_true:
          name: gestora_qsa_partners_empty_row_has_null_details
          config:
            severity: error
          arguments:
            expression: "partner_count > 0 or (tipo is null and nome is null and documento is null)"
