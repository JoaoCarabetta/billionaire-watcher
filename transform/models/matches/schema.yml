version: 2

models:
  - name: graph_person_tse_events
    description: |
      Privacy boundary for Tribunal person events in cycles 2016, 2018, 2020,
      2022, and 2024. The 2026 branch is explicitly empty because no real TSE
      Dados Abertos landing exists at the declared missing prefix
      gs://billionairewatcher-landing/raw/tse/2026/; the test/ci seed is never
      used on dev. Full warehouse CPFs are converted immediately to p- plus
      eight hex and are never selected. Donor rows whose document is masked or
      otherwise not complete are excluded because they cannot support either a
      strong key or a distinct-hash review.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - person_id
              - cycle
              - event_kind
    columns:
      - name: person_id
        description: Privacy-preserving strong key derived from the full warehouse CPF
        tests:
          - not_null
      - name: normalized_name
        description: Public full name after upper, trim, and inner-space collapse
        tests:
          - not_null
      - name: cycle
        description: Election cycle
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2016, 2018, 2020, 2022, 2024, 2026]
      - name: event_kind
        description: Whether this identity appeared as a candidate or donor
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['candidate', 'donor']

  - name: graph_person_tse_match
    description: |
      One row per person already present on the live public graph. Badge-class
      candidate and donor flags and cycle strings come only from a strong p-id
      match. Exact normalized name matching never sets those flags: one distinct
      Tribunal identity is name_review and two or more are collision. No accent
      folding, fuzzy matching, LIKE matching, graph expansion, or raw CPF output.
    columns:
      - name: person_id
        description: Existing public graph person id
        tests:
          - not_null
          - unique
      - name: label
        description: Existing public graph label
        tests:
          - not_null
      - name: is_candidate_strong
        description: True only when person_id strongly matches a candidate identity
        tests:
          - not_null
      - name: is_donor_strong
        description: True only when person_id strongly matches a donor identity
        tests:
          - not_null
      - name: candidate_cycles
        description: Comma-separated candidate cycles from strong matches only
      - name: donor_cycles
        description: Comma-separated donor cycles from strong matches only
      - name: match_class
        description: Highest-confidence disposition for this graph person
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['strong', 'name_review', 'collision', 'no_hit']
    tests:
      - dbt_utils.expression_is_true:
          name: graph_person_tse_match_no_eleven_digit_output
          config:
            severity: error
          arguments:
            expression: |
              not regexp_contains(
                concat(
                  coalesce(person_id, ''),
                  coalesce(label, ''),
                  coalesce(candidate_cycles, ''),
                  coalesce(donor_cycles, ''),
                  coalesce(match_class, '')
                ),
                r'\d{11}'
              )

  - name: graph_person_tse_match_counts
    description: |
      One-row audit counts for the graph-person Tribunal match. Candidate and
      donor strong-hit counts are independent and can overlap.
    columns:
      - name: graph_persons
        description: Number of live graph person rows evaluated
        tests:
          - not_null
      - name: strong_candidate_hits
        description: Graph persons with a strong candidate match
        tests:
          - not_null
      - name: strong_donor_hits
        description: Graph persons with a strong donor match
        tests:
          - not_null
      - name: name_only_review
        description: Graph persons with exactly one name-only Tribunal identity
        tests:
          - not_null
      - name: collisions
        description: Graph persons whose exact name maps to multiple Tribunal identities
        tests:
          - not_null
      - name: no_hit
        description: Graph persons with no strong, review, or collision match
        tests:
          - not_null
