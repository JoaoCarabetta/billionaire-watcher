          - name: Data_Ultima_Alteracao
            data_type: string
          - name: Acionista_Controlador
            data_type: string
          - name: Participante_Acordo_Acionistas
            data_type: string
      - name: fre_capital_social_2026
        identifier: cvm_fre_capital_social_2026
        description: |
          FRE item 17.1 capital social 2026. Staging reader: stg_cvm_fre_capital_social.
          Autorizado / Emitido / Subscrito / Integralizado are views, not addends.
        columns:
          - name: CNPJ_Companhia
            data_type: string
