version: 2

sources:
  - name: valor
    description: Valor 1000 inventory used as seed A. Editorial starting list, not the oligarch definition.
    database: billionairewatcher
    schema: raw
    tables:
      - name: controle_empresas_walk
        identifier: valor_controle_empresas_walk
        description: |
          Repository inventory at data/controle-empresas-walk.csv, landed as-is.
          CNPJ lives in identificador and must stay STRING.

  - name: cvm
    description: Comissão de Valores Mobiliários files landed in GCS. All identifier columns are STRING.
    database: billionairewatcher
    schema: raw
    tables:
      - name: cad_cia_aberta
        identifier: cvm_cad_cia_aberta
        description: Listed-company registry. Filter SIT in staging, not here.
      - name: fre_posicao_acionaria_2026
        identifier: cvm_fre_posicao_acionaria_2026
        description: FRE shareholder positions for 2026. CPF_CNPJ fields may be masked.
      - name: fre_capital_social_2026
        identifier: cvm_fre_capital_social_2026
        description: |
          FRE item 17.1 capital social 2026. Autorizado / Emitido / Subscrito /
          Integralizado are different views, not addends.
      - name: fca_valor_mobiliario_2026
        identifier: cvm_fca_valor_mobiliario_2026
        description: FCA securities file used later to map Codigo_Negociacao to CNPJ.

  - name: bcb
    description: Banco Central Unicad and IF.data extracts. CNPJ columns are STRING.
    database: billionairewatcher
    schema: raw
    tables:
      - name: entidades_supervisionadas
        identifier: bcb_entidades_supervisionadas
        description: Unicad entities for the configured dataBase. Seed filters belong in staging.
      - name: ifdata_cadastro
        identifier: bcb_ifdata_cadastro
        description: IF.data quarter registry mapping reporter codes to the leading CNPJ8.
      - name: ifdata_ativo_total_prudencial
        identifier: bcb_ifdata_ativo_total_prudencial
        description: |
          IF.data Relatorio 2, Conta 140220 (Ativo Total), TipoInstituicao=1 only.

  - name: susep
    description: Superintendência de Seguros Privados extracts. CNPJ columns are STRING.
    database: billionairewatcher
    schema: raw
    tables:
      - name: dados_cadastrais
        identifier: susep_dados_cadastrais
        description: Full DadosCadastrais dump, fetched without $top.
      - name: receitas_seguros_2026
        identifier: susep_receitas_seguros_2026
        description: ReceitasSeguros(Ano='2026') emitted premiums. Not SES premio_ganho.

  - name: b3
    description: Brasil Bolsa Balcão listed-company and official close extracts.
    database: billionairewatcher
    schema: raw
    tables:
      - name: listed_companies
        identifier: b3_listed_companies
        description: GetInitialCompanies rows restricted to type=1.
      - name: listed_supplement
        identifier: b3_listed_supplement
        description: GetListedSupplementCompany share quantities for type=1 issuers.
      - name: cotahist_2026
        identifier: b3_cotahist_2026
        description: |
          COTAHIST_A2026 records with TPMERC=010 and CODBDI=02. PREULT is
          integer cents. This is not the Base dos Dados trade tape.

  - name: rf
    description: |
      Receita Federal CNPJ snapshot copied from Base dos Dados into this
      project. One partition only. Downstream models must not query
      basedosdados.br_me_cnpj directly.
    database: billionairewatcher
    schema: raw
    tables:
      - name: socios
        identifier: rf_socios
        description: QSA partners at rf_partition_date. documento may be masked.
      - name: empresas
        identifier: rf_empresas
        description: Company registry at rf_partition_date. cnpj_basico is 8-digit STRING.
      - name: estabelecimentos
        identifier: rf_estabelecimentos
        description: Establishments at rf_partition_date. cnpj is 14-digit STRING.

  - name: warehouse
    description: Load inventory for the raw dataset.
    database: billionairewatcher
    schema: raw
    tables:
      - name: _manifest
        description: One row per raw table with source URL, as-of date, GCS URI, checksum, and row count.
