          - name: CNPJ_CIA
            data_type: string
          - name: DENOM_SOCIAL
            data_type: string
          - name: DENOM_COMERC
            data_type: string
          - name: DT_REG
            data_type: string
          - name: DT_CONST
            data_type: string
          - name: DT_CANCEL
            data_type: string
          - name: MOTIVO_CANCEL
            data_type: string
          - name: SIT
            data_type: string
          - name: DT_INI_SIT
            data_type: string
          - name: CD_CVM
            data_type: string
          - name: SETOR_ATIV
            data_type: string
          - name: TP_MERC
            data_type: string
          - name: CATEG_REG
            data_type: string
          - name: DT_INI_CATEG
            data_type: string
          - name: SIT_EMISSOR
            data_type: string
          - name: DT_INI_SIT_EMISSOR
            data_type: string
          - name: CONTROLE_ACIONARIO
            data_type: string
            description: PRIVADO/ESTATAL/ESTRANGEIRO — type of control, not the person
          - name: TP_ENDER
            data_type: string
          - name: LOGRADOURO
            data_type: string
          - name: COMPL
            data_type: string
          - name: BAIRRO
            data_type: string
          - name: MUN
            data_type: string
          - name: UF
            data_type: string
          - name: PAIS
            data_type: string
          - name: CEP
            data_type: string
          - name: DDD_TEL
            data_type: string
          - name: TEL
            data_type: string
          - name: DDD_FAX
            data_type: string
          - name: FAX
            data_type: string
          - name: EMAIL
            data_type: string
          - name: TP_RESP
            data_type: string
          - name: RESP
            data_type: string
          - name: DT_INI_RESP
            data_type: string
          - name: LOGRADOURO_RESP
            data_type: string
          - name: COMPL_RESP
            data_type: string
          - name: BAIRRO_RESP
            data_type: string
          - name: MUN_RESP
            data_type: string
          - name: UF_RESP
            data_type: string
          - name: PAIS_RESP
            data_type: string
          - name: CEP_RESP
            data_type: string
          - name: DDD_TEL_RESP
            data_type: string
          - name: TEL_RESP
            data_type: string
          - name: DDD_FAX_RESP
            data_type: string
          - name: FAX_RESP
            data_type: string
          - name: EMAIL_RESP
            data_type: string
          - name: CNPJ_AUDITOR
            data_type: string
          - name: AUDITOR
            data_type: string
      - name: fre_posicao_acionaria_2026
        identifier: cvm_fre_posicao_acionaria_2026
        description: |
          FRE shareholder positions for 2026. Staging reader:
          stg_cvm_fre_posicao_acionaria. CPF_CNPJ fields may be masked.
        columns:
          - name: CNPJ_Companhia
            data_type: string
          - name: Data_Referencia
            data_type: string
          - name: Versao
            data_type: string
          - name: ID_Documento
            data_type: string
          - name: Nome_Companhia
            data_type: string
          - name: ID_Acionista
            data_type: string
          - name: Acionista
            data_type: string
          - name: Tipo_Pessoa_Acionista
            data_type: string
          - name: CPF_CNPJ_Acionista
            data_type: string
          - name: ID_Acionista_Relacionado
            data_type: string
          - name: Acionista_Relacionado
            data_type: string
          - name: Tipo_Pessoa_Acionista_Relacionado
            data_type: string
          - name: CPF_CNPJ_Acionista_Relacionado
            data_type: string
          - name: Quantidade_Acao_Ordinaria_Circulacao
            data_type: string
          - name: Percentual_Acao_Ordinaria_Circulacao
