          - name: Mercado
            data_type: string
          - name: Sigla_Entidade_Administradora
            data_type: string
          - name: Entidade_Administradora
            data_type: string
          - name: Data_Inicio_Negociacao
            data_type: string
          - name: Data_Fim_Negociacao
            data_type: string
          - name: Segmento
            data_type: string
          - name: Data_Inicio_Listagem
            data_type: string
          - name: Data_Fim_Listagem
            data_type: string

  - name: bcb
    description: Banco Central Unicad and IF.data extracts. CNPJ columns are STRING.
    database: billionairewatcher
    schema: raw
    tables:
      - name: entidades_supervisionadas
        identifier: bcb_entidades_supervisionadas
        description: |
          Unicad entities for the configured dataBase. Staging reader:
          stg_bcb_entidade_supervisionada. Seed-B tipo/situação filters are later.
        columns:
          - name: database
            data_type: string
          - name: codigoCNPJ14
            data_type: string
          - name: codigoCNPJ8
            data_type: string
          - name: nomeEntidadeInteresse
            data_type: string
          - name: codigoTipoSituacaoPessoaJuridica
            data_type: string
          - name: codigoTipoEntidadeSupervisionada
            data_type: string
      - name: ifdata_cadastro
        identifier: bcb_ifdata_cadastro
        description: |
          IF.data quarter registry. Staging reader: stg_bcb_ifdata_cadastro.
        columns:
          - name: CodInst
            data_type: string
          - name: Data
            data_type: string
          - name: NomeInstituicao
            data_type: string
          - name: CodConglomeradoPrudencial
            data_type: string
          - name: CnpjInstituicaoLider
            data_type: string
          - name: Situacao
            data_type: string
      - name: ifdata_ativo_total_prudencial
        identifier: bcb_ifdata_ativo_total_prudencial
        description: |
          IF.data Relatorio 2, Conta 140220 (Ativo Total), TipoInstituicao=1 only.
          Staging reader: stg_bcb_ifdata_ativo_total.
        columns:
          - name: TipoInstituicao
            data_type: string
          - name: CodInst
            data_type: string
          - name: AnoMes
            data_type: string
          - name: NumeroRelatorio
            data_type: string
          - name: Conta
            data_type: string
          - name: NomeColuna
            data_type: string
          - name: Saldo
            data_type: string

  - name: susep
    description: Superintendência de Seguros Privados extracts. CNPJ columns are STRING.
    database: billionairewatcher
    schema: raw
    tables:
      - name: dados_cadastrais
        identifier: susep_dados_cadastrais
        description: |
          Full DadosCadastrais dump, fetched without $top. Staging reader:
          stg_susep_dado_cadastral. mercodigo filter is later.
        columns:
          - name: mercodigo
            data_type: string
          - name: entnome
            data_type: string
          - name: entcgc
            data_type: string
      - name: receitas_seguros_2026
        identifier: susep_receitas_seguros_2026
        description: |
          ReceitasSeguros(Ano='2026') emitted premiums. Not SES premio_ganho.
          Staging reader: stg_susep_receita_seguro.
        columns:
          - name: entnome
            data_type: string
          - name: cnpj
            data_type: string
          - name: mesreferencia
            data_type: string
          - name: grupo
            data_type: string
          - name: ramo
            data_type: string
          - name: valor
            data_type: string

  - name: b3
    description: Brasil Bolsa Balcão listed-company and official close extracts.
    database: billionairewatcher
    schema: raw
    tables:
      - name: listed_companies
        identifier: b3_listed_companies
        description: |
          GetInitialCompanies rows restricted to type=1. Staging reader:
          stg_b3_empresa_listada.
        columns:
          - name: codeCVM
            data_type: string
          - name: issuingCompany
            data_type: string
          - name: companyName
            data_type: string
          - name: tradingName
            data_type: string
          - name: cnpj
            data_type: string
          - name: type
            data_type: string
      - name: listed_supplement
        identifier: b3_listed_supplement
        description: |
          GetListedSupplementCompany share quantities. Staging reader:
          stg_b3_empresa_listada_complemento.
        columns:
          - name: code
            data_type: string
          - name: codeCVM
            data_type: string
          - name: tradingName
            data_type: string
          - name: numberCommonShares
            data_type: string
          - name: numberPreferredShares
            data_type: string
          - name: totalNumberShares
            data_type: string
      - name: cotahist_2026
        identifier: b3_cotahist_2026
        description: |
          COTAHIST_A2026 records with TPMERC=010 and CODBDI=02. PREULT is
          integer cents. Staging reader: stg_b3_cotahist (divides by 100).
          This is not the Base dos Dados trade tape.
        columns:
          - name: DATA_PREGAO
            data_type: string
          - name: CODBDI
            data_type: string
          - name: CODNEG
            data_type: string
          - name: TPMERC
            data_type: string
          - name: PREULT
            data_type: string
          - name: NUMNEG
            data_type: string

  - name: rf
    description: |
      Receita Federal CNPJ snapshot copied from Base dos Dados into this
      project. One partition only. Downstream models must not query
      basedosdados.br_me_cnpj directly. Staging readers: stg_rf_socio,
      stg_rf_empresa, stg_rf_estabelecimento.
    database: billionairewatcher
    schema: raw
    tables:
      - name: socios
        identifier: rf_socios
        description: QSA partners at rf_partition_date. documento may be masked.
        columns:
          - name: data
            data_type: date
          - name: ano
            data_type: int64
          - name: mes
            data_type: int64
          - name: cnpj_basico
            data_type: string
          - name: tipo
            data_type: string
          - name: nome
            data_type: string
          - name: documento
            data_type: string
          - name: qualificacao
            data_type: string
          - name: data_entrada_sociedade
            data_type: date
          - name: id_pais
            data_type: string
          - name: cpf_representante_legal
            data_type: string
          - name: nome_representante_legal
            data_type: string
          - name: qualificacao_representante_legal
            data_type: string
          - name: faixa_etaria
            data_type: string
      - name: empresas
        identifier: rf_empresas
        description: Company registry at rf_partition_date. cnpj_basico is 8-digit STRING.
        columns:
          - name: data
            data_type: date
          - name: ano
            data_type: int64
          - name: mes
            data_type: int64
          - name: cnpj_basico
            data_type: string
          - name: razao_social
            data_type: string
          - name: natureza_juridica
            data_type: string
          - name: qualificacao_responsavel
            data_type: string
          - name: capital_social
            data_type: float64
          - name: porte
            data_type: string
          - name: ente_federativo
            data_type: string
      - name: estabelecimentos
        identifier: rf_estabelecimentos
        description: Establishments at rf_partition_date. cnpj is 14-digit STRING.
        columns:
          - name: data
            data_type: date
          - name: ano
            data_type: int64
          - name: mes
            data_type: int64
          - name: cnpj
            data_type: string
          - name: cnpj_basico
            data_type: string
          - name: cnpj_ordem
            data_type: string
          - name: cnpj_dv
            data_type: string
          - name: identificador_matriz_filial
            data_type: string
          - name: nome_fantasia
            data_type: string
          - name: situacao_cadastral
            data_type: string
          - name: data_situacao_cadastral
            data_type: date
          - name: motivo_situacao_cadastral
            data_type: string
          - name: nome_cidade_exterior
            data_type: string
          - name: id_pais
            data_type: string
          - name: data_inicio_atividade
            data_type: date
          - name: cnae_fiscal_principal
            data_type: string
          - name: cnae_fiscal_secundaria
            data_type: string
          - name: sigla_uf
            data_type: string
          - name: id_municipio
            data_type: string
          - name: id_municipio_rf
            data_type: string
          - name: tipo_logradouro
            data_type: string
          - name: logradouro
            data_type: string
          - name: numero
            data_type: string
          - name: complemento
            data_type: string
          - name: bairro
            data_type: string
          - name: cep
            data_type: string
          - name: ddd_1
            data_type: string
          - name: telefone_1
            data_type: string
          - name: ddd_2
            data_type: string
          - name: telefone_2
            data_type: string
          - name: ddd_fax
            data_type: string
          - name: fax
            data_type: string
          - name: email
            data_type: string
          - name: situacao_especial
            data_type: string
          - name: data_situacao_especial
            data_type: date

  - name: warehouse
    description: Load inventory for the raw dataset.
    database: billionairewatcher
    schema: raw
    tables:
      - name: _manifest
        description: One row per raw table with source URL, as-of date, GCS URI, checksum, and row count.
