          - name: Quantidade_Acoes_Preferenciais
            data_type: string
          - name: Quantidade_Total_Acoes
            data_type: string
      - name: fca_valor_mobiliario_2026
        identifier: cvm_fca_valor_mobiliario_2026
        description: |
          FCA securities file. Staging reader: stg_cvm_fca_valor_mobiliario.
          Codigo_Negociacao maps to COTAHIST CODNEG.
