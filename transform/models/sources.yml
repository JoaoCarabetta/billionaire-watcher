version: 2

sources:
  - name: br_me_cnpj
    description: Base dos Dados - Receita Federal CNPJ tables
    database: basedosdados
    schema: br_me_cnpj
    tables:
      - name: socios
        description: RF CNPJ sócios (partners), partitioned by data
        columns:
          - name: data
            description: Partition date
          - name: cnpj_basico
            description: 8-digit CNPJ base (STRING with leading zeros)
          - name: tipo
            description: Partner type (PJ/PF)
          - name: nome
            description: Partner name
          - name: documento
            description: CPF or CNPJ (masked per BD)
          - name: qualificacao
            description: Partner qualification code
          
      - name: empresas
        description: RF CNPJ empresas (companies), partitioned by data
        columns:
          - name: data
            description: Partition date
          - name: cnpj_basico
            description: 8-digit CNPJ base (STRING with leading zeros)
          - name: razao_social
            description: Company legal name
          - name: natureza_juridica
            description: Legal nature code
          - name: capital_social
            description: Share capital
          
      - name: estabelecimentos
        description: RF CNPJ estabelecimentos (establishments), partitioned by data
        columns:
          - name: data
            description: Partition date
          - name: cnpj_basico
            description: 8-digit CNPJ base (STRING with leading zeros)
          - name: cnpj
            description: 14-digit full CNPJ (STRING with leading zeros)

  - name: gcs_cvm
    description: CVM files on GCS (latin-1, semicolon-delimited)
    database: billionairewatcher
    schema: billionaire_watcher_raw
    tables:
      - name: fre_posicao_acionaria_2026
        description: CVM FRE shareholder position 2026 (external table from GCS)
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/cvm/fre/2026/fre_cia_aberta_posicao_acionaria_2026.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1
          
      - name: cad_cia_aberta
        description: CVM registered listed companies (external table from GCS)
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/cvm/fre/2026/cad_cia_aberta.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1

      - name: fre_capital_social_2026
        description: |
          CVM FRE item 17.1 capital social 2026 (external table from GCS).
          Company-level Quantidade_Acoes_Ordinarias / Quantidade_Acoes_Preferenciais.
          Do not sum Tipo_Capital rows (Autorizado / Emitido / Subscrito / Integralizado
          are different views of the same capital, not addends).
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/cvm/fre/2026/fre_cia_aberta_capital_social_2026.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1

  - name: br_tse_eleicoes
    description: Base dos Dados - TSE election data (closed cycles)
    database: basedosdados
    schema: br_tse_eleicoes
    tables:
      - name: receitas_candidato
        description: |
          TSE candidate receipts (donations), partitioned by ano.
          FIX #51: nome_candidato and tipo_receita do NOT exist on this table.
          Join to candidatos for candidate names.
          Verified 2026-08-24: origem_receita (not fonte_receita) for PF filter.
          Receipt ID varies by year: numero_recibo_eleitoral (2014), numero_recibo_doacao (2018),
          numero_documento_doacao (2022), sequencial_receita (fallback).
        columns:
          - name: ano
            description: Election year
          - name: sequencial_candidato
            description: Candidate sequential ID (join key to candidatos.sequencial)
          - name: cpf_cnpj_doador
            description: Donor CPF or CNPJ (masked)
          - name: nome_doador
            description: Donor name
          - name: valor_receita
            description: Receipt amount
          - name: origem_receita
            description: Receipt origin (e.g., "recursos de pessoas fisicas" for PF donations)
          - name: numero_recibo_eleitoral
            description: Electoral receipt number (2014 coverage, may be null in other years)
          - name: numero_recibo_doacao
            description: Donation receipt number (2018 coverage, may be null in other years)
          - name: numero_documento_doacao
            description: Donation document number (2022 coverage, may be null in other years)
          - name: sequencial_receita
            description: Receipt sequential ID (available all years, fallback identifier)
            
      - name: candidatos
        description: |
          TSE candidates by year.
          Join target for receitas_candidato to get candidate PUBLIC names.
        columns:
          - name: ano
            description: Election year
          - name: sequencial
            description: Candidate sequential ID (join key from receitas_candidato.sequencial_candidato)
          - name: nome
            description: Candidate full name (PUBLIC, use in value/fact_id)
          - name: nome_urna
            description: Candidate ballot name (PUBLIC, use in value/fact_id)
          - name: numero
            description: Candidate number
          - name: cpf
            description: Candidate CPF (NEVER use in value/fact_id, matching only)

  - name: tse_2026_snapshot
    description: |
      Expected TSE Dados Abertos snapshot through 4 October 2026. The landing
      is not present yet. Load the real Tribunal exports into the declared
      BigQuery tables before running the match models; never substitute the
      tse_donations_2026 test-fixture seed.
    database: billionairewatcher
    schema: billionaire_watcher_raw
    tables:
      - name: candidatos_2026_10_04
        description: |
          Candidate snapshot from TSE Dados Abertos through 2026-10-04.
          Expected table:
          billionairewatcher.billionaire_watcher_raw.candidatos_2026_10_04
        columns:
          - name: ano
            description: Election year
          - name: cpf
            description: Candidate CPF, matching only
          - name: nome
            description: Candidate public full name
      - name: receitas_candidato_2026_10_04
        description: |
          Candidate-receipt snapshot from TSE Dados Abertos through 2026-10-04.
          Expected table:
          billionairewatcher.billionaire_watcher_raw.receitas_candidato_2026_10_04
        columns:
          - name: ano
            description: Election year
          - name: cpf_cnpj_doador
            description: Donor document, matching only when it contains all CPF digits
          - name: nome_doador
            description: Donor public full name
