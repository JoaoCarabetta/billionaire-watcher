version: 2

sources:
  - name: fase1_landing
    description: |
      Raw fase 1 company-door and size-floor files landed in GCS. Repository
      downloaders preserve source fields; dbt owns normalization and business
      logic. CNPJ columns in external tables must always be declared STRING.
    database: billionairewatcher
    schema: billionaire_watcher_raw
    tables:
      - name: controle_empresas_walk
        description: Repository inventory used as seed A.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/controle-empresas-walk.csv
            encoding: UTF-8
            field_delimiter: ";"
            skip_leading_rows: 1
      - name: bcb_entidades_supervisionadas
        description: Banco Central Unicad entities for the configured reference date.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/bcb_entidades_supervisionadas.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: susep_dados_cadastrais
        description: Full SUSEP DadosCadastrais dump, fetched without $top.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/susep_dados_cadastrais.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: b3_listed_companies
        description: GetInitialCompanies response rows restricted to type=1.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/b3_listed_companies.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: b3_listed_supplement
        description: GetListedSupplementCompany share quantities for type=1 issuers.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/b3_listed_supplement.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: b3_cotahist_2026
        description: |
          B3 COTAHIST_A2026 records with TPMERC=010 and CODBDI=02. PREULT is
          retained as integer cents. This is not the Base dos Dados trade tape.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/b3_cotahist_2026.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: cvm_fca_valor_mobiliario_2026
        description: CVM FCA securities file used to map Codigo_Negociacao to CNPJ.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/cvm_fca_valor_mobiliario_2026.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1
      - name: ifdata_cadastro
        description: |
          IF.data quarter registry used to map prudential reporter codes to
          the leading institution's 8-digit CNPJ.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/ifdata_cadastro.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: ifdata_ativo_total_prudencial
        description: |
          IF.data Relatorio 2, Conta 140220 (Ativo Total), exclusively at
          TipoInstituicao=1 (prudential) grain.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/ifdata_ativo_total_prudencial.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1
      - name: susep_receitas_seguros_2026
        description: SUSEP ReceitasSeguros(Ano='2026') premiums rows.
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/fase1/pisos/susep_receitas_seguros_2026.csv
            encoding: UTF-8
            field_delimiter: ","
            skip_leading_rows: 1

  - name: br_me_cnpj
    description: Base dos Dados - Receita Federal CNPJ tables
    database: basedosdados
    schema: br_me_cnpj
    tables:
      - name: socios
        description: RF CNPJ sócios (partners), partitioned by data
        columns:
          - name: data
            description: Partition date
          - name: cnpj_basico
            description: 8-digit CNPJ base (STRING with leading zeros)
          - name: tipo
            description: Partner type (PJ/PF)
          - name: nome
            description: Partner name
          - name: documento
            description: CPF or CNPJ (masked per BD)
          - name: qualificacao
            description: Partner qualification code
          
      - name: empresas
        description: RF CNPJ empresas (companies), partitioned by data
        columns:
          - name: data
            description: Partition date
          - name: cnpj_basico
            description: 8-digit CNPJ base (STRING with leading zeros)
          - name: razao_social
            description: Company legal name
          - name: natureza_juridica
            description: Legal nature code
          - name: capital_social
            description: Share capital
          
      - name: estabelecimentos
        description: RF CNPJ estabelecimentos (establishments), partitioned by data
        columns:
          - name: data
            description: Partition date
          - name: cnpj_basico
            description: 8-digit CNPJ base (STRING with leading zeros)
          - name: cnpj
            description: 14-digit full CNPJ (STRING with leading zeros)

  - name: gcs_cvm
    description: CVM files on GCS (latin-1, semicolon-delimited)
    database: billionairewatcher
    schema: billionaire_watcher_raw
    tables:
      - name: fre_posicao_acionaria_2026
        description: CVM FRE shareholder position 2026 (external table from GCS)
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/cvm/fre/2026/fre_cia_aberta_posicao_acionaria_2026.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1
          
      - name: cad_cia_aberta
        description: CVM registered listed companies (external table from GCS)
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/cvm/fre/2026/cad_cia_aberta.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1

      - name: fre_capital_social_2026
        description: |
          CVM FRE item 17.1 capital social 2026 (external table from GCS).
          Company-level Quantidade_Acoes_Ordinarias / Quantidade_Acoes_Preferenciais.
          Do not sum Tipo_Capital rows (Autorizado / Emitido / Subscrito / Integralizado
          are different views of the same capital, not addends).
        config:
          meta:
            external_location: gs://billionairewatcher-landing/raw/cvm/fre/2026/fre_cia_aberta_capital_social_2026.csv
            encoding: ISO-8859-1
            field_delimiter: ";"
            skip_leading_rows: 1
