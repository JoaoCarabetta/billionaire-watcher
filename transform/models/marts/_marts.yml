          union all
          select 'pessoa' as origem_tipo, 'nome:JOESLEY BATISTA@07379937000127' as origem_id, 'JOESLEY BATISTA' as origem_nome, cast(null as varchar) as origem_documento, '02916265000160' as cnpj, 'acionista_controlador' as papel, 'fre' as fonte, true as acionista_controlador, false as participante_acordo_acionistas, 40.0 as percentual_on, 40.0 as percentual_total, cast(null as varchar) as qualificacao, true as tem_informacao_de_controle, date '2025-12-31' as data_referencia, 'fre_cia_aberta_posicao_acionaria_2026 id_documento=100' as fonte_documento, '02916265' as cnpj_basico, '100' as id_documento, 'J AND F INVESTIMENTOS' as via, '07379937000127' as via_cnpj
          union all
          select 'estado' as origem_tipo, 'estado:UNIAOFEDERAL' as origem_id, 'UNIÃO FEDERAL' as origem_nome, cast(null as varchar) as origem_documento, '07379937000127' as cnpj, 'acionista' as papel, 'fre' as fonte, false as acionista_controlador, false as participante_acordo_acionistas, 10.0 as percentual_on, 10.0 as percentual_total, cast(null as varchar) as qualificacao, true as tem_informacao_de_controle, date '2025-12-31' as data_referencia, 'fre_cia_aberta_posicao_acionaria_2026 id_documento=200' as fonte_documento, '07379937' as cnpj_basico, '200' as id_documento, cast(null as varchar) as via, cast(null as varchar) as via_cnpj
          union all
          select 'pessoa' as origem_tipo, 'nome:MARIA SILVA@02916265000160' as origem_id, 'MARIA SILVA' as origem_nome, cast(null as varchar) as origem_documento, '02916265000160' as cnpj, 'socio' as papel, 'qsa' as fonte, cast(null as boolean) as acionista_controlador, cast(null as boolean) as participante_acordo_acionistas, cast(null as double) as percentual_on, cast(null as double) as percentual_total, '22' as qualificacao, false as tem_informacao_de_controle, date '2026-01-11' as data_referencia, 'rf.socios partição 2026-01-11 cnpj_basico=02916265' as fonte_documento, '02916265' as cnpj_basico, cast(null as varchar) as id_documento, cast(null as varchar) as via, cast(null as varchar) as via_cnpj
    expect:
      rows:
        - {origem_tipo: empresa, origem_id: '07379937000127', origem_nome: J AND F INVESTIMENTOS, origem_documento: '07379937000127', cnpj: '02916265000160', papel: acionista_controlador, fonte: fre, acionista_controlador: true, participante_acordo_acionistas: false, percentual_on: 85.0, percentual_total: 85.0, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre_cia_aberta_posicao_acionaria_2026 id_documento=100'}
        - {origem_tipo: pessoa, origem_id: 'nome:JOESLEY BATISTA@07379937000127', origem_nome: JOESLEY BATISTA, origem_documento: null, cnpj: '07379937000127', papel: acionista_controlador, fonte: fre, acionista_controlador: true, participante_acordo_acionistas: false, percentual_on: 60.0, percentual_total: 60.0, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre_cia_aberta_posicao_acionaria_2026 id_documento=200'}
        - {origem_tipo: estado, origem_id: 'estado:UNIAOFEDERAL', origem_nome: UNIÃO FEDERAL, origem_documento: null, cnpj: '07379937000127', papel: acionista, fonte: fre, acionista_controlador: false, participante_acordo_acionistas: false, percentual_on: 10.0, percentual_total: 10.0, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre_cia_aberta_posicao_acionaria_2026 id_documento=200'}
        - {origem_tipo: pessoa, origem_id: 'nome:MARIA SILVA@02916265000160', origem_nome: MARIA SILVA, origem_documento: null, cnpj: '02916265000160', papel: socio, fonte: qsa, acionista_controlador: null, participante_acordo_acionistas: null, percentual_on: null, percentual_total: null, qualificacao: '22', tem_informacao_de_controle: false, data_referencia: '2026-01-11', fonte_documento: 'rf.socios partição 2026-01-11 cnpj_basico=02916265'}

  - name: walk_up_vinculos_veiculo_interno
    description: >
