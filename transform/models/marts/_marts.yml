          union all
          select 'pessoa', 'nome:BRUNO RIZZO SETUBAL@60872504000123', 'BRUNO RIZZO SETUBAL', cast(null as varchar), '60872504000123', 'acionista_controlador', 'fre', true, false, 1.728, 0.85, cast(null as varchar), true, date '2025-12-31', 'fre id=1 bruno esa', '60872504', '1', 'COMPANHIA ESA', '52117397000108'
          union all
          select 'pessoa', 'nome:BRUNO RIZZO SETUBAL@60872504000123', 'BRUNO RIZZO SETUBAL', cast(null as varchar), '60872504000123', 'acionista_controlador', 'fre', true, false, 1.084, 0.53, cast(null as varchar), true, date '2025-12-31', 'fre id=1 bruno itausa', '60872504', '1', 'ITAUSA', '61532644000115'
          union all
