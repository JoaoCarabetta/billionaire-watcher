        - {origem_tipo: empresa, origem_id: '52117397000108', origem_nome: COMPANHIA ESA, origem_documento: '52117397000108', cnpj: '61532644000115', papel: acionista_controlador, fonte: fre, acionista_controlador: true, participante_acordo_acionistas: false, percentual_on: 19.6, percentual_total: 19.6, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre id=2'}
        - {origem_tipo: pessoa, origem_id: 'nome:BRUNO RIZZO SETUBAL@60872504000123', origem_nome: BRUNO RIZZO SETUBAL, origem_documento: null, cnpj: '52117397000108', papel: acionista_controlador, fonte: fre, acionista_controlador: true, participante_acordo_acionistas: false, percentual_on: null, percentual_total: null, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre id=1 bruno esa'}

  - name: walk_up_pessoas_so_pessoa_natural
