    given:
      - input: ref('int_caminhada')
        format: sql
        rows: |
          select '02916265000160' as cnpj, 0 as profundidade, cast(null as varchar) as cnpj_origem, 'semente' as fonte_chegada
          union all
          select '07379937000127', 1, '02916265000160', 'fre'
      - input: ref('int_vinculo_propriedade')
        format: sql
        rows: |
          select 'empresa' as origem_tipo, '07379937000127' as origem_id, 'J AND F INVESTIMENTOS' as origem_nome, '07379937000127' as origem_documento, '02916265000160' as cnpj, 'acionista_controlador' as papel, 'fre' as fonte, true as acionista_controlador, false as participante_acordo_acionistas, 85.0 as percentual_on, 85.0 as percentual_total, cast(null as varchar) as qualificacao, true as tem_informacao_de_controle, date '2025-12-31' as data_referencia, 'fre_cia_aberta_posicao_acionaria_2026 id_documento=100' as fonte_documento, '02916265' as cnpj_basico, '100' as id_documento, cast(null as varchar) as via, cast(null as varchar) as via_cnpj
          union all
