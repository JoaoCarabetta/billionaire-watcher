        format: sql
        rows: |
          select '60872504000123' as cnpj, 0 as profundidade, cast(null as varchar) as cnpj_origem, 'semente' as fonte_chegada
          union all
          select '61532644000115', 1, '60872504000123', 'fre'
          union all
          select '52117397000108', 2, '61532644000115', 'fre'
      - input: ref('int_vinculo_propriedade')
        format: sql
        rows: |
          select 'empresa' as origem_tipo, '61532644000115' as origem_id, 'ITAUSA' as origem_nome, '61532644000115' as origem_documento, '60872504000123' as cnpj, 'acionista_controlador' as papel, 'fre' as fonte, true as acionista_controlador, false as participante_acordo_acionistas, 36.7 as percentual_on, 19.4 as percentual_total, cast(null as varchar) as qualificacao, true as tem_informacao_de_controle, date '2025-12-31' as data_referencia, 'fre id=1' as fonte_documento, '60872504' as cnpj_basico, '1' as id_documento, 'IUPAR' as via, '60958473000173' as via_cnpj
