version: 2

models:
  - name: empresas
    description: >
      One row per company CNPJ: seed A (Valor 1000 2025 lists) union
      holdings reached by the walk-up (motivo_entrada_categoria = subida).
      If a CNPJ is both, it stays semente. Never invent /0001.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(cnpj) = 14"
          description: >
            CNPJ is always 14 digits. Never invent a /0001 suffix.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "motivo_entrada_categoria in ('semente', 'subida')"
          description: >
            This pass every company entered as semente or subida.
    columns:
      - name: cnpj
        data_type: string
        description: >
          14-digit headquarters CNPJ. Primary key. Receita matriz when the
          match has a cnpj_basico; else the CNPJ already on FRE / cadastro.
        data_tests:
          - unique
          - not_null
      - name: razao_social
        data_type: string
        description: >
          Legal name. Receita razão when matched; else the name cited on
          the edge that brought a holding.
        data_tests:
          - not_null
      - name: capital_social
        data_type: float64
        description: Receita capital_social in BRL. Null when no Receita match.
      - name: motivo_entrada_categoria
        data_type: string
        description: semente or subida. hop is reserved.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['semente', 'subida']
      - name: motivo_entrada_descricao
        data_type: string
        description: >
          Seed: Valor list and posição. Subida: FRE id_documento or QSA
          partition of the child company that cited this holding.
        data_tests:
          - not_null
      - name: motivo_entrada_date
        data_type: date
        description: >
          Seed: Valor 1000 2025 publication date. Subida: FRE Data_Referencia
          or Receita partition date.
        data_tests:
          - not_null

  - name: pessoas
    description: >
      Natural-person terminals of the walk. No state, no company. No
      e_oligarca this pass. A folded name plus unique CPF or mask is one
      id across companies. A 2-token homonym without a shared document
      stays one id per citing CNPJ.
    config:
      contract:
        enforced: true
    columns:
      - name: pessoa_id
        data_type: string
        description: >
          person_id_from_cpf when an 11-digit CPF or unique mask resolves;
          nome: + folded name when the same undocumented long name (or the
          same 2-token mask) repeats; otherwise nome: + folded name + @ + CNPJ.
        data_tests:
          - unique
          - not_null
      - name: nome
        data_type: string
        description: Name as cited. FRE preferred when both sources cite.
        data_tests:
          - not_null
      - name: cpf
        data_type: string
        description: Full 11 digits, warehouse only. Null when masked or missing.

  - name: vinculos
    description: >
      Path edges of visited companies. A person cited through
      Acionista_Relacionado attaches to the innermost vehicle, not to the
      issuer. PJ photocopy edges (origem already owns the via) are dropped.
      Agreement vias stay on the issuer. No via columns. Citation grain for
      e_oligarca stays on int_vinculo_propriedade.
    config:
      contract:
        enforced: true
    columns:
      - name: origem_tipo
        data_type: string
        description: pessoa, empresa, estado, outros, tesouraria, estrangeiro, or nao_resolvido.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pessoa
                  - empresa
                  - estado
                  - outros
                  - tesouraria
                  - estrangeiro
                  - nao_resolvido
      - name: origem_id
        data_type: string
        description: pessoa_id, 14-digit CNPJ, or prefixed stop/state key.
        data_tests:
          - not_null
      - name: origem_nome
        data_type: string
        description: Name as cited.
        data_tests:
          - not_null
      - name: origem_documento
        data_type: string
        description: Warehouse only. FRE CPF_CNPJ_Acionista or QSA documento.
      - name: cnpj
        data_type: string
        description: Destination company, 14 digits (issuer or vehicle).
        data_tests:
          - not_null
      - name: papel
        data_type: string
        description: acionista_controlador (FRE S), acionista (other FRE), socio (QSA).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['acionista_controlador', 'acionista', 'socio']
      - name: fonte
        data_type: string
        description: fre or qsa.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fre', 'qsa']
      - name: acionista_controlador
        data_type: boolean
        description: FRE S/N. Null on QSA.
      - name: participante_acordo_acionistas
        data_type: boolean
        description: FRE Participante_Acordo_Acionistas. Null on QSA.
      - name: percentual_on
        data_type: float64
        description: FRE Percentual_Acao_Ordinaria_Circulacao. Always null on QSA.
      - name: percentual_total
        data_type: float64
        description: FRE Percentual_Total_Acoes_Circulacao. Always null on QSA.
      - name: qualificacao
        data_type: string
        description: QSA 2-digit code. Null on FRE.
      - name: tem_informacao_de_controle
        data_type: boolean
        description: True on FRE. False on QSA.
        data_tests:
          - not_null
      - name: data_referencia
        data_type: date
        description: FRE Data_Referencia or Receita partition date.
        data_tests:
          - not_null
      - name: fonte_documento
        data_type: string
        description: Exact citation of this source row.
        data_tests:
          - not_null

unit_tests:
  - name: walk_up_empresas_semente_e_subida
    description: >
      Seed JBS stays semente; the FRE holding enters as subida. The walk
      does not stop on the company controller.
    model: empresas
    given:
      - input: ref('int_empresas_semente_a')
        format: sql
        rows: |
          select '02916265000160' as cnpj, 'JBS S/A' as razao_social, 23631071304.24 as capital_social, 'semente' as motivo_entrada_categoria, 'Valor 1000 2025, ranking industrial, posição 1000' as motivo_entrada_descricao, date '2025-09-16' as motivo_entrada_date
      - input: ref('int_caminhada')
        format: sql
        rows: |
          select '02916265000160' as cnpj, 0 as profundidade, cast(null as varchar) as cnpj_origem, 'semente' as fonte_chegada
          union all
          select '07379937000127', 1, '02916265000160', 'fre'
      - input: ref('int_vinculo_propriedade')
        format: sql
        rows: |
          select 'empresa' as origem_tipo, '07379937000127' as origem_id, 'J AND F INVESTIMENTOS' as origem_nome, '07379937000127' as origem_documento, '02916265000160' as cnpj, 'acionista_controlador' as papel, 'fre' as fonte, true as acionista_controlador, false as participante_acordo_acionistas, 85.0 as percentual_on, 85.0 as percentual_total, cast(null as varchar) as qualificacao, true as tem_informacao_de_controle, date '2025-12-31' as data_referencia, 'fre_cia_aberta_posicao_acionaria_2026 id_documento=100' as fonte_documento, '02916265' as cnpj_basico, '100' as id_documento, cast(null as varchar) as via, cast(null as varchar) as via_cnpj
      - input: ref('stg_rf_empresa')
        format: sql
        rows: |
          select date '2026-01-11' as data, '07379937' as cnpj_basico, 'J AND F INVESTIMENTOS SA' as razao_social, 1.0 as capital_social
    expect:
      rows:
        - {cnpj: '02916265000160', razao_social: JBS S/A, capital_social: 23631071304.24, motivo_entrada_categoria: semente, motivo_entrada_descricao: "Valor 1000 2025, ranking industrial, posição 1000", motivo_entrada_date: '2025-09-16'}
        - {cnpj: '07379937000127', razao_social: J AND F INVESTIMENTOS SA, capital_social: 1.0, motivo_entrada_categoria: subida, motivo_entrada_descricao: "FRE id_documento 100 da companhia 02916265000160", motivo_entrada_date: '2025-12-31'}

  - name: walk_up_vinculos_pessoa_empresa_estado
    description: >
      Path of visited companies: holding→JBS, Joesley on J&F (the JBS via
      J&F photocopy is dropped), União, QSA sócio.
