        format: sql
        rows: |
          select 'pessoa' as origem_tipo, 'p-1585ec8c' as origem_id, 'ALDO LUPO NETO' as origem_nome, '***815438**' as origem_documento, '02916265000160' as cnpj, 'acionista' as papel, 'fre' as fonte, false as acionista_controlador, false as participante_acordo_acionistas, 5.0 as percentual_on, 5.0 as percentual_total, cast(null as varchar) as qualificacao, true as tem_informacao_de_controle, date '2025-12-31' as data_referencia, 'fre id=100' as fonte_documento
      - input: ref('int_vinculo_propriedade')
        format: sql
        rows: |
          select 'p-1585ec8c' as origem_id, 'pessoa' as origem_tipo, '13881543821' as origem_documento
    expect:
      rows:
        - {pessoa_id: 'p-1585ec8c', nome: ALDO LUPO NETO, cpf: '13881543821'}
