      - input: ref('int_vinculo_propriedade')
        format: sql
        rows: |
          select cast(null as varchar) as origem_id, cast(null as varchar) as origem_tipo, cast(null as varchar) as origem_documento
          where false
    expect:
      rows:
        - {pessoa_id: 'p-1585ec8c', nome: ALDO LUPO NETO, cpf: '13881543821'}

  - name: walk_up_pessoas_cpf_vem_do_int
    description: >
