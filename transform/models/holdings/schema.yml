version: 2

models:
  - name: holding_qsa_companies_owned
    description: |
      One-hop companies whose Receita QSA names one of the six issue #110
      graph holdings as a PJ partner. Reads `socios` and `empresas` only at
      `rf_partition_date`. Owner matching strips non-digits, pads to 14 digits,
      and compares only the first eight digits; substring matching is forbidden.
      Owners with no edge receive one explicit sentinel with
      `owned_company_count=0` and the exact `source_query`. `percent` is always
      null. `documento` is the PJ partner document as Base dos Dados emits it
      and stays warehouse-only. Owned-company identity for downstream use is
      the 8-digit `owned_cnpj_basico`, `owned_name`, and `qualificacao`.
      `size_warning` is true when the owner is the bank-book seed flag or the
      owned-company count meets `holding_owned_size_warning_threshold` (40).
      This model does not write public HTML or `/grafo`.
    columns:
      - name: owner_cnpj_basico
        description: Configured holding CNPJ básico, normalized to an 8-digit STRING.
        tests:
          - not_null
      - name: owned_cnpj_basico
        description: Owned company CNPJ básico, normalized to an 8-digit STRING; null on an empty row.
      - name: owned_name
        description: Owned company legal name from the same `empresas` partition.
      - name: qualificacao
        description: Receita qualification code for the holding's PJ partner row.
      - name: documento
        description: Full PJ partner document as Base dos Dados emits it; warehouse-only.
      - name: percent
        description: Always null; the source has no ownership-percentage field.
      - name: owned_company_count
        description: Matching one-hop edge count for the owner; zero marks an explicit empty result.
        tests:
          - not_null
      - name: size_warning
        description: |
          True when the owner is flagged `bank_book` on the seed and has at
          least one owned company, or when `owned_company_count` meets the
          size-warning threshold. Warehouse-only; do not emit that book to
          `/grafo`.
        tests:
          - not_null
      - name: source_query
        description: Reproducible partition-bounded prefix-8 source query for this owner.
        tests:
          - not_null
    tests:
      - dbt_utils.expression_is_true:
          name: holding_qsa_companies_owned_never_invents_percent
          config:
            severity: error
          arguments:
            expression: "percent is null"
      - dbt_utils.expression_is_true:
          name: holding_qsa_companies_owned_empty_row_has_null_details
          config:
            severity: error
          arguments:
            expression: "owned_company_count > 0 or (owned_cnpj_basico is null and owned_name is null and documento is null)"
      - dbt_utils.expression_is_true:
          name: holding_qsa_companies_owned_owned_key_is_eight_digits
          config:
            severity: error
          arguments:
            expression: "owned_cnpj_basico is null or length(owned_cnpj_basico) = 8"
      - dbt_utils.expression_is_true:
          name: holding_qsa_companies_owned_owner_key_is_eight_digits
          config:
            severity: error
          arguments:
            expression: "length(owner_cnpj_basico) = 8"
