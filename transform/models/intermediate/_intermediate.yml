version: 2

models:
  - name: int_empresas_semente_a
    description: >
      Seed A only. Same grain and columns as the previous empresas mart:
      Valor 1000 2025 industrial 1–1000 ∪ banks ∪ insurers. Walk holdings
      are added later in empresas.
    columns:
      - name: cnpj
        description: 14-digit headquarters CNPJ.
        data_tests:
          - unique
          - not_null
      - name: razao_social
        data_tests:
          - not_null
      - name: capital_social
      - name: motivo_entrada_categoria
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['semente']
      - name: motivo_entrada_descricao
        data_tests:
          - not_null
      - name: motivo_entrada_date
        data_tests:
          - not_null

  - name: int_fre_posicao_recente
    description: >
      Latest FRE document per company (max id_documento), then every
      shareholder line on that document, including Acionista_Relacionado.

  - name: int_vinculo_propriedade
    description: >
      FRE latest-document shareholders union RF QSA ownership-qualificacao
      socios. Classifies origem_tipo. Resolves pessoa_id: 11-digit CPF,
      unique mask on folded name or first+last block, unique CPF for that
      name, then token proximity to one CPF. Same mask across companies
      shares an id. Keeps via / via_cnpj. QSA percents stay null.
      Administrators are not owners.

  - name: int_aresta_empresa
    description: >
      Company-to-company ownership edges only (origem_tipo = empresa, 14-digit
      CNPJ). The walk reads this instead of scanning all vinculos.

  - name: int_caminhada
    description: >
      Companies visited walking up from seed A through PJ owners and through
      via_cnpj of person lines, depth 0–8. Does not stop on a company
      controller.

unit_tests:
  - name: empresas_semente_a_valor_listas
    description: >
      Unique Receita razão gets the matriz CNPJ; an ambiguous razão takes
      the largest capital_social; Cia. matches Companhia. Grain is CNPJ.
    model: int_empresas_semente_a
    given:
      - input: ref('stg_valor_ranking')
        format: sql
        rows: |
          select 1 as posicao, 'Petrobras' as nome, 'Petroleo Brasileiro S.A. Petrobras' as razao_social
          union all
          select 1000, 'JBS', 'JBS S.A.'
      - input: ref('stg_valor_banco')
        format: sql
        rows: |
          select 1 as posicao, 'Itau Unibanco' as nome, 'Cia. Itau Unibanco Holding S.A.' as razao_social
      - input: ref('stg_valor_seguradora')
        format: sql
        rows: |
          select 1 as posicao, 'Bradesco Seguros' as nome, 'Bradesco Seguros S.A.' as razao_social
      - input: ref('stg_rf_empresa')
        format: sql
        rows: |
          select date '2026-01-11' as data, '33000167' as cnpj_basico, 'Petroleo Brasileiro S.A. Petrobras' as razao_social, 100.0 as capital_social
          union all
          select date '2026-01-11', '02916265', 'JBS S/A', 23631071304.24
          union all
          select date '2026-01-11', '07452328', 'JBS S.A.', 1000.0
          union all
          select date '2026-01-11', '60872504', 'COMPANHIA ITAU UNIBANCO HOLDING S.A.', 90000000000.0
          union all
          select date '2026-01-11', '33032580', 'Bradesco Seguros S.A.', 1.0
      - input: ref('stg_rf_estabelecimento')
        format: sql
        rows: |
          select date '2026-01-11' as data, '33000167000158' as cnpj, '33000167' as cnpj_basico, '0001' as cnpj_ordem, '1' as identificador_matriz_filial, '02' as situacao_cadastral
          union all
          select date '2026-01-11', '02916265000160', '02916265', '0001', '1', '02'
          union all
          select date '2026-01-11', '07452328000100', '07452328', '0001', '1', '02'
          union all
          select date '2026-01-11', '60872504000123', '60872504', '0001', '1', '02'
          union all
          select date '2026-01-11', '33032580000109', '33032580', '0001', '1', '02'
      - input: ref('stg_cvm_cia_aberta')
        format: sql
        rows: |
          select cast(null as varchar) as id_cnpj, cast(null as varchar) as razao_social, cast(null as varchar) as nome_comercial, cast(null as varchar) as situacao
          where false
      - input: ref('stg_b3_empresa_listada')
        format: sql
        rows: |
          select cast(null as varchar) as id_cnpj, cast(null as varchar) as razao_social, cast(null as varchar) as nome_comercial
          where false
      - input: ref('stg_bcb_entidade_supervisionada')
        format: sql
        rows: |
          select cast(null as varchar) as id_cnpj, cast(null as varchar) as nome
          where false
      - input: ref('stg_susep_dado_cadastral')
        format: sql
        rows: |
          select cast(null as varchar) as id_cnpj, cast(null as varchar) as nome
          where false
    expect:
      rows:
        - {cnpj: '33000167000158', razao_social: Petroleo Brasileiro S.A. Petrobras, capital_social: 100.0, motivo_entrada_categoria: semente, motivo_entrada_descricao: "Valor 1000 2025, ranking industrial, posição 1", motivo_entrada_date: '2025-09-16'}
        - {cnpj: '02916265000160', razao_social: JBS S/A, capital_social: 23631071304.24, motivo_entrada_categoria: semente, motivo_entrada_descricao: "Valor 1000 2025, ranking industrial, posição 1000", motivo_entrada_date: '2025-09-16'}
        - {cnpj: '60872504000123', razao_social: COMPANHIA ITAU UNIBANCO HOLDING S.A., capital_social: 90000000000.0, motivo_entrada_categoria: semente, motivo_entrada_descricao: "Valor 1000 2025, bancos, posição 1", motivo_entrada_date: '2025-09-16'}
        - {cnpj: '33032580000109', razao_social: Bradesco Seguros S.A., capital_social: 1.0, motivo_entrada_categoria: semente, motivo_entrada_descricao: "Valor 1000 2025, seguradoras, posição 1", motivo_entrada_date: '2025-09-16'}

  - name: vinculo_classifica_pessoa_estado_empresa
    description: >
      FRE holding is empresa (keep walking); FRE person is pessoa; União is
      estado; QSA sócio with no percent is kept as socio; admin 05 is dropped.
