        - {origem_tipo: pessoa, origem_id: 'p-1585ec8c', origem_nome: ALDO LUPO NETO, origem_documento: '***815438**', cnpj: '02916265000160', papel: acionista, fonte: fre, acionista_controlador: false, participante_acordo_acionistas: false, percentual_on: 5.0, percentual_total: 5.0, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre_cia_aberta_posicao_acionaria_2026 id_documento=100', cnpj_basico: '02916265', id_documento: '100', via: null, via_cnpj: null}
        - {origem_tipo: pessoa, origem_id: 'p-1585ec8c', origem_nome: ALDO LUPO NETO, origem_documento: '13881543821', cnpj: '07379937000127', papel: acionista_controlador, fonte: fre, acionista_controlador: true, participante_acordo_acionistas: false, percentual_on: 10.0, percentual_total: 10.0, qualificacao: null, tem_informacao_de_controle: true, data_referencia: '2025-12-31', fonte_documento: 'fre_cia_aberta_posicao_acionaria_2026 id_documento=200', cnpj_basico: '07379937', id_documento: '200', via: null, via_cnpj: null}

