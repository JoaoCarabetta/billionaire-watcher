name: 'billionaire_watcher'
version: '1.0.0'

profile: 'billionaire_watcher'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  billionaire_watcher:
    +materialized: table
    staging:
      +schema: staging
      +persist_docs:
        relation: true
        columns: true
      +contract:
        enforced: true
    marts:
      +schema: marts

seeds:
  billionaire_watcher:
    dicionario:
      +enabled: true

vars:
  rf_partition_date: '2026-01-11'
