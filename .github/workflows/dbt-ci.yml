name: dbt CI

on:
  pull_request:
    paths:
      - 'transform/**'
      - '.github/workflows/dbt-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'transform/**'
      - '.github/workflows/dbt-ci.yml'

jobs:
  dbt-parse-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery==1.8.2

      - name: Create CI profiles.yml
        working-directory: transform
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          billionaire_watcher:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: dummy-project
                dataset: dummy_dataset
                location: US
                threads: 1
          EOF

      - name: Create auth bypass for unit tests
        run: |
          # Set environment variables to bypass BigQuery authentication
          echo "GOOGLE_APPLICATION_CREDENTIALS=/dev/null" >> $GITHUB_ENV
          echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=/dev/null" >> $GITHUB_ENV
          echo "GOOGLE_AUTH_SUPPRESS_CREDENTIALS_WARNINGS=true" >> $GITHUB_ENV

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps

      - name: Run dbt parse
        working-directory: transform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: |
          echo "Running dbt parse..."
          dbt parse || (echo "dbt parse failed with exit code $?" && exit 1)

      - name: Run dbt unit tests
        working-directory: transform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
          DBT_PROFILES_DIR: ~/.dbt
        run: |
          echo "Running dbt unit tests..."
          echo "Profile directory: $DBT_PROFILES_DIR"
          cat ~/.dbt/profiles.yml
          dbt debug --config-dir || true
          dbt test --select test_type:unit 2>&1 | tee /tmp/dbt_test_output.log || (echo "dbt test failed, output:" && cat /tmp/dbt_test_output.log && exit 1)
