name: dbt CI

on:
  pull_request:
    paths:
      - 'transform/**'
      - '.github/workflows/dbt-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'transform/**'
      - '.github/workflows/dbt-ci.yml'

jobs:
  dbt-parse-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery==1.8.2

      - name: Create CI profiles.yml
        working-directory: transform
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          billionaire_watcher:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: dummy-project
                dataset: dummy_dataset
                location: US
                threads: 1
          EOF

      - name: Create auth bypass for unit tests
        run: |
          mkdir -p /tmp/dbt_ci
          cat > /tmp/dbt_ci/sitecustomize.py << 'EOF'
          # Bypass BigQuery authentication for dbt unit tests
          import sys
          
          def patch_google_auth():
              try:
                  from unittest.mock import MagicMock, patch
                  import google.auth
                  import google.auth.credentials
                  
                  class MockCredentials:
                      def __init__(self):
                          self.token = "mock-token"
                          self.valid = True
                          self.expired = False
                          self._project_id = "dummy-project"
                      
                      def refresh(self, request):
                          pass
                      
                      def before_request(self, request, method, url, headers):
                          headers['authorization'] = 'Bearer mock-token'
                  
                  def mock_default(scopes=None, request=None, quota_project_id=None):
                      return MockCredentials(), "dummy-project"
                  
                  google.auth.default = mock_default
                  
              except Exception as e:
                  print(f"Warning: Could not patch google.auth: {e}", file=sys.stderr)
          
          patch_google_auth()
          EOF
          
          echo "PYTHONPATH=/tmp/dbt_ci:$PYTHONPATH" >> $GITHUB_ENV

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps

      - name: Run dbt parse
        working-directory: transform
        run: dbt parse

      - name: Run dbt unit tests
        working-directory: transform
        run: dbt test --select test_type:unit
