name: dbt CI

on:
  pull_request:
    paths:
      - 'transform/**'
      - '.github/workflows/dbt-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'transform/**'
      - '.github/workflows/dbt-ci.yml'

jobs:
  dbt-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt-bigquery and dbt-duckdb
        run: |
          pip install dbt-bigquery==1.8.2
          pip install dbt-duckdb

      - name: Create CI profiles.yml
        run: |
          mkdir -p $HOME/.dbt
          cat > $HOME/.dbt/profiles.yml << 'EOF'
          billionaire_watcher:
            target: test
            outputs:
              test:
                type: duckdb
                path: ":memory:"
              dev:
                type: bigquery
                method: oauth
                project: dummy-project
                dataset: marts
                location: US
                threads: 1
          EOF

      - name: Install dbt packages
        working-directory: transform
        run: dbt deps

      - name: Run dbt parse
        working-directory: transform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: dbt parse --target test

      - name: Run dbt unit tests
        working-directory: transform
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: dbt test --select test_type:unit --target test
